zentrale.hauptsitz: Hauptsitz
zentrale.hilfe: "Im Land des Hauptsitzes zahlt die Firma ihre Gewinnsteuer; nach seinem Lohnniveau richten sich die Gehälter des Vorstands und der Zentrale. Die Stadt bestimmt, wie viele Akademiker die Zentrale findet und was ihre Büros kosten. Ein Umzug kostet sofort, dauert einige Monate, und nicht alle Angestellten der Zentrale ziehen mit."
