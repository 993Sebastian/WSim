vertrag.hilfe: Ein Liefervertrag sichert Menge und Preis über Monate. Geliefert wird jeden Tag vor dem Markt, frei Standort des Käufers – Fracht und Zoll trägt der Verkäufer. Fehlt im Monat Ware, zahlt der Verkäufer die Vertragsstrafe; fehlt dem Käufer das Geld, zahlt er.
