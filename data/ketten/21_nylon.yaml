# Kette 21 – Nylon (M33, Epoche 1940–1964)
# Benzin (Benzol, Cyclohexan) oder Kohle (Benzol und Phenol aus dem Steinkohlenteer der
# Kokereien, der Weg der 1940er-Jahre) und Ammoniak → Polyamid (Nylon 6.6 von DuPont,
# Perlon der IG Farben) → Nylonstrümpfe. Am 15. Mai 1940 kamen sie in den USA in den
# Handel und verdrängten die Strümpfe aus Kunstseide über den Preis.
# Alle Zahlen sind Annäherungen für etwa 1955.

produkte:
  - id: nylon
    art: halbzeug
    branche: chemie
    einheit: t                    # Polyamidgarn
    verwendung: industrie
    warengruppe: textilien
    transportklasse: stueckgut
    richtpreis_usd: 20_000        # um 1955 etwa 85 Cent je lb
    annaeherung: true

anlagen:
  - id: polyamidanlage            # Salzbildung, Polykondensation, Schmelzspinnen
    standorttyp: werk
    investition_usd: 50_000_000
    bauzeit_tage: 450
    kapazitaet_je_tag: 10
    lebensdauer_jahre: 25
    wartung_je_jahr: 0.04
    automatisierung_max: 0.5
    technologie: polyamid
    annaeherung: true

rezepte:
  - id: nylon_synthese
    produkt: nylon
    menge: 1
    dauer_tage: 2
    anlage: polyamidanlage
    technologie: polyamid
    eingang:
      benzin: 1.5                 # Benzol und Cyclohexan für die Adipinsäure
      ammoniak: 0.4               # für das Hexamethylendiamin
    arbeit_stunden:
      angelernt: 450
      fachkraft.chemie: 120
      fachkraft.textil: 150
      akademiker.chemie: 8
    energie_mwh: 4
    qualitaet_basis: 65
    annaeherung: true

  - id: nylon_aus_kohle
    produkt: nylon
    menge: 1
    dauer_tage: 2
    anlage: polyamidanlage
    technologie: polyamid
    eingang:
      kohle: 8                    # Kokerei: Teer mit Benzol und Phenol, Koks wird verkauft
      ammoniak: 0.4
    arbeit_stunden:
      angelernt: 500
      fachkraft.chemie: 140
      fachkraft.textil: 150
      akademiker.chemie: 8
    energie_mwh: 5
    qualitaet_basis: 60
    annaeherung: true

  - id: strumpf_nylon             # dünner und haltbarer als Kunstseide
    produkt: strumpf
    menge: 1
    dauer_tage: 1
    anlage: strumpffabrik
    technologie: polyamid
    eingang:
      nylon: 0.00002
    arbeit_stunden:
      angelernt: 0.25
      fachkraft.textil: 0.08
    qualitaet_basis: 65
    annaeherung: true

technologien:
  - id: polyamid                  # Wallace Carothers 1935, Paul Schlack 1938
    fachgebiet: chemie
    erfindungsjahr: 1938
    voraussetzungen: [viskoseverfahren]
    forschungsaufwand: 20000
    annaeherung: true
