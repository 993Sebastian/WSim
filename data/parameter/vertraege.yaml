# Lieferverträge (W4, Lastenheft §9.3; Formeln: docs/FORMELN.md, Abschnitt W4).

vertraege:
  laufzeit_monate_max: 60
  laufzeit_standard: 12
  strafe_max: 1.0            # Anteil am Wert der fehlenden Menge
  strafe_standard: 0.2
  kuendigung_monate: 3       # wer kündigt, zahlt die Strafe auf so viele Monatsmengen
  angebot_tage: 30           # so lange wartet ein Angebot der KI auf die Antwort
  aufbewahren_monate: 12     # beendete Verträge bleiben so lange in der Liste
  ausfall_kuendigung_monate: 3 # liefert der Verkäufer so viele Monate in Folge zu wenig, kündigt der Käufer ohne Strafe (BP4)
  exklusiv_aufschlag: 0.1    # Preisaufschlag, den die KI für Exklusivität verlangt (BP4)
  # Nachverhandlung laufender Verträge: nur über den Preis lässt sich die KI nicht ein;
  # die Menge muss sich um diesen Anteil ändern oder die Laufzeit so viele Monate wachsen.
  nachverhandlung_menge_min: 0.2
  nachverhandlung_verlaengerung_monate: 3
  # Partnerschaft und Umsatzanteil (LV2, 13.10.2026; Formeln: FORMELN.md, Abschnitt LV2).
  partnerschaft:
    aufbau_monate: 60        # so viele Monate mit Lieferung bis zum vollen Grad
    verfall_monate: 120      # so viele Monate ohne Lieferung bis zum Verlust
    abzug_fehlmenge: 0.25    # Grad, den eine Fehlmenge des Lieferanten kostet
    rabatt_max: 0.10         # Rabatt bei vollem Grad
    umsatz_rabatt_max: 0.10  # Rabatt, wenn der Käufer umsatz_ab des Lieferantenumsatzes bezieht
    umsatz_ab: 0.20
    gesamt_max: 0.20         # beide Rabatte zusammen höchstens
  ki:
    # Rabatt für Bindung (10.10.2026): je Monat Laufzeit über den ersten mehr, bis zum Höchstwert.
    abschlag_verkauf: 0.08   # für sichere Abnahme verkauft die KI 8 % billiger …
    abschlag_je_monat: 0.005 # … plus 0,5 % je weiteren Monat (12 Monate: 13,5 %) …
    abschlag_max: 0.20       # … höchstens 20 %
    aufschlag_kauf: 0.05     # für sichere Lieferung zahlt sie 5 % mehr …
    aufschlag_je_monat: 0.0025
    aufschlag_max: 0.12
    anteil: 0.5              # höchstens die Hälfte ihrer Leistung oder ihres Bedarfs
    strafe_max: 0.5
    angebot_chance: 0.25     # je Monat und Produkt des Spielers
  annaeherung: true
