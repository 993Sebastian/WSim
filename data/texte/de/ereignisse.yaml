# Titel und Beschreibung der historischen Ereignisse (data/ereignisse/).

ereignis.boxeraufstand: "Boxeraufstand"
ereignis.boxeraufstand.text: "Belagerung der Gesandtschaften in Peking. Acht Mächte greifen ein; China muss hohe Entschädigungen zahlen, der Handel mit Nordchina stockt."
ereignis.australischer_bund: "Australischer Bund gegründet"
ereignis.australischer_bund.text: "Die sechs Kolonien schließen sich zum Commonwealth of Australia zusammen; zwischen ihnen fallen die Zölle."
ereignis.us_steel: "United States Steel gegründet"
ereignis.us_steel.text: "J. P. Morgan vereinigt Carnegie Steel mit anderen Stahlwerken zum ersten Konzern mit über einer Milliarde Dollar Kapital."
ereignis.russisch_japanischer_krieg: "Russisch-Japanischer Krieg"
ereignis.russisch_japanischer_krieg.text: "Japan greift die russische Flotte in Port Arthur an. Rüstungsaufträge steigen, Russlands Staatsfinanzen geraten unter Druck."
ereignis.revolution_1905: "Revolution in Russland"
ereignis.revolution_1905.text: "Nach dem Petersburger Blutsonntag legen Streiks Fabriken und Eisenbahnen lahm; der Zar gewährt ein Parlament."
ereignis.frieden_portsmouth: "Frieden von Portsmouth"
ereignis.frieden_portsmouth.text: "Ende des Russisch-Japanischen Kriegs; Japan steigt zur Großmacht in Ostasien auf."
ereignis.norwegen_unabhaengig: "Norwegen wird unabhängig"
ereignis.norwegen_unabhaengig.text: "Norwegen löst die Union mit Schweden und wird ein eigenständiges Königreich."
ereignis.erdbeben_san_francisco: "Erdbeben von San Francisco"
ereignis.erdbeben_san_francisco.text: "Beben und Brände zerstören große Teile der Stadt. Versicherungen zahlen Milliarden, Baustoffe werden knapp."
ereignis.bankenpanik_1907: "Bankenpanik in New York"
ereignis.bankenpanik_1907.text: "Ein Ansturm auf die Knickerbocker Trust löst eine Bankenkrise aus. Kredite werden knapp, die Industrieproduktion bricht ein."
ereignis.ford_model_t: "Das Auto für alle"
ereignis.ford_model_t.text: "Ein einfaches, robustes Auto für breite Käuferschichten kommt auf den Markt."
ereignis.bulgarien_unabhaengig: "Bulgarien wird unabhängig"
ereignis.bulgarien_unabhaengig.text: "Bulgarien sagt sich vom Osmanischen Reich los und wird ein eigenständiges Königreich."
ereignis.suedafrikanische_union: "Südafrikanische Union"
ereignis.suedafrikanische_union.text: "Die britischen Kolonien im Süden Afrikas vereinigen sich; Gold- und Diamantenförderung prägen die Wirtschaft."
ereignis.mexikanische_revolution: "Mexikanische Revolution"
ereignis.mexikanische_revolution.text: "Aufstände gegen Porfirio Díaz beginnen ein Jahrzehnt der Kämpfe; Bergbau und Ölförderung werden immer wieder unterbrochen."
ereignis.xinhai_revolution: "Revolution in China"
ereignis.xinhai_revolution.text: "Der Aufstand von Wuchang stürzt die Qing-Dynastie; am 1. Januar 1912 wird die Republik ausgerufen."
ereignis.erster_balkankrieg: "Erster Balkankrieg"
ereignis.erster_balkankrieg.text: "Montenegro, Serbien, Bulgarien und Griechenland kämpfen gegen das Osmanische Reich."
ereignis.albanien_unabhaengig: "Albanien wird unabhängig"
ereignis.albanien_unabhaengig.text: "Albanien erklärt seine Unabhängigkeit vom Osmanischen Reich."
ereignis.fliessband_highland_park: "Fließband im Autobau"
ereignis.fliessband_highland_park.text: "In den USA läuft die Automontage erstmals am Fließband; die Fertigungszeit eines Autos sinkt von zwölf auf unter zwei Stunden."
ereignis.erster_weltkrieg: "Erster Weltkrieg"
ereignis.erster_weltkrieg.text: "Österreich-Ungarn erklärt Serbien den Krieg; binnen einer Woche stehen die Großmächte im Krieg. Handel über See bricht ein, Staaten kaufen Stahl, Kohle und Fahrzeuge für die Front, Arbeitskräfte fehlen."
ereignis.panamakanal: "Panamakanal eröffnet"
ereignis.panamakanal.text: "Der Seeweg zwischen Atlantik und Pazifik verkürzt sich um Tausende Kilometer."
ereignis.usa_kriegseintritt: "USA treten in den Krieg ein"
ereignis.usa_kriegseintritt.text: "Die Vereinigten Staaten erklären dem Deutschen Reich den Krieg; ihre Industrie stellt auf Kriegsproduktion um."
ereignis.oktoberrevolution: "Oktoberrevolution"
ereignis.oktoberrevolution.text: "Die Bolschewiki übernehmen die Macht in Russland. Fabriken, Banken und ausländische Beteiligungen werden verstaatlicht."
ereignis.finnland_unabhaengig: "Finnland wird unabhängig"
ereignis.finnland_unabhaengig.text: "Finnland erklärt seine Unabhängigkeit von Russland."
ereignis.spanische_grippe: "Spanische Grippe"
ereignis.spanische_grippe.text: "Eine weltweite Grippewelle beginnt; bis 1920 sterben Millionen Menschen, Arbeitskräfte fallen aus."
ereignis.baltische_staaten: "Baltische Staaten unabhängig"
ereignis.baltische_staaten.text: "Estland erklärt seine Unabhängigkeit; Litauen hatte es eine Woche zuvor getan, Lettland folgt im November."
ereignis.tschechoslowakei: "Tschechoslowakei gegründet"
ereignis.tschechoslowakei.text: "Aus Böhmen, Mähren und der Slowakei entsteht ein neuer Staat mit starker Industrie."
ereignis.waffenstillstand_1918: "Waffenstillstand von Compiègne"
ereignis.waffenstillstand_1918.text: "Der Erste Weltkrieg endet. Rüstungsaufträge brechen weg, Soldaten kehren in die Fabriken zurück."
ereignis.polen_unabhaengig: "Polen wird unabhängig"
ereignis.polen_unabhaengig.text: "Polen entsteht nach über hundert Jahren als Staat neu, mit dem Industrierevier um Łódź und später Oberschlesien."
ereignis.jugoslawien: "Königreich der Serben, Kroaten und Slowenen"
ereignis.jugoslawien.text: "Die südslawischen Gebiete schließen sich zu einem Königreich zusammen."
ereignis.versailler_vertrag: "Vertrag von Versailles"
ereignis.versailler_vertrag.text: "Deutschland muss Reparationen zahlen, Gebiete abtreten und Kohle liefern."
ereignis.irischer_freistaat: "Irischer Freistaat"
ereignis.irischer_freistaat.text: "Irland erhält als Freistaat weitgehende Selbstständigkeit vom Vereinigten Königreich."
ereignis.sowjetunion: "Sowjetunion gegründet"
ereignis.sowjetunion.text: "Russland, die Ukraine, Belarus und Transkaukasien bilden die Union der Sozialistischen Sowjetrepubliken."
ereignis.ruhrbesetzung: "Besetzung des Ruhrgebiets"
ereignis.ruhrbesetzung.text: "Frankreich und Belgien besetzen das Ruhrgebiet, weil Reparationen ausbleiben; Zechen und Hütten stehen still."
ereignis.hyperinflation: "Ende der Hyperinflation"
ereignis.hyperinflation.text: "Die Rentenmark beendet die Hyperinflation in Deutschland; Ersparnisse sind vernichtet, Sachwerte gewinnen."
ereignis.tuerkische_republik: "Republik Türkei"
ereignis.tuerkische_republik.text: "Mustafa Kemal ruft die Republik aus; der Staat fördert Industrie und Eisenbahnbau."
ereignis.dawes_plan: "Dawes-Plan"
ereignis.dawes_plan.text: "Neue Regeln für die Reparationen und amerikanische Kredite stabilisieren die deutsche Wirtschaft."
ereignis.schwarzer_donnerstag: "Börsenkrach in New York"
ereignis.schwarzer_donnerstag.text: "Am Schwarzen Donnerstag stürzen die Kurse an der Wall Street. Es beginnt die Weltwirtschaftskrise: Nachfrage, Preise und Löhne sinken über Jahre."
ereignis.smoot_hawley: "Smoot-Hawley-Zollgesetz"
ereignis.smoot_hawley.text: "Die USA erhöhen die Zölle auf über 20 000 Waren; andere Länder antworten mit eigenen Zöllen, der Welthandel schrumpft."
ereignis.goldstandard_gbr: "Großbritannien verlässt den Goldstandard"
ereignis.goldstandard_gbr.text: "Das Pfund wird abgewertet; viele Länder folgen."
ereignis.new_deal: "New Deal"
ereignis.new_deal.text: "Präsident Roosevelt beginnt Programme für Banken, Arbeitsbeschaffung und öffentliche Bauten."
ereignis.zweiter_weltkrieg: "Zweiter Weltkrieg"
ereignis.zweiter_weltkrieg.text: "Das Deutsche Reich überfällt Polen; Frankreich und Großbritannien erklären den Krieg. Die Industrie stellt auf Rüstung um."

# 1940–2026 (M28)
ereignis.westfeldzug: "Westfeldzug"
ereignis.westfeldzug.text: "Deutsche Truppen überfallen die Niederlande, Belgien und Luxemburg und besiegen Frankreich in sechs Wochen. Großbritannien kämpft allein weiter; der Handel über den Ärmelkanal bricht ab."
ereignis.leih_und_pachtgesetz: "Leih- und Pachtgesetz"
ereignis.leih_und_pachtgesetz.text: "Die USA liefern Großbritannien und später der Sowjetunion Waffen, Fahrzeuge, Rohstoffe und Lebensmittel auf Kredit. Die amerikanische Industrie stellt auf Rüstung um."
ereignis.angriff_sowjetunion: "Überfall auf die Sowjetunion"
ereignis.angriff_sowjetunion.text: "Deutschland greift die Sowjetunion an. Die Sowjetunion verlegt ganze Fabriken mit ihren Arbeitern hinter den Ural."
ereignis.pearl_harbor: "Angriff auf Pearl Harbor"
ereignis.pearl_harbor.text: "Japan greift die amerikanische Pazifikflotte an; die USA treten in den Krieg ein. Japan besetzt Südostasien und damit die wichtigsten Kautschukgebiete der Welt – die USA bauen in kurzer Zeit eine Industrie für synthetischen Kautschuk auf."
ereignis.stalingrad: "Schlacht von Stalingrad"
ereignis.stalingrad.text: "Die 6. Armee kapituliert in Stalingrad, der Krieg im Osten wendet sich. Deutschland stellt seine Wirtschaft ganz auf Rüstung um und zieht Arbeiter aus den Fabriken ein."
ereignis.landung_normandie: "Landung in der Normandie"
ereignis.landung_normandie.text: "Alliierte Truppen landen in Nordfrankreich und eröffnen die zweite Front im Westen."
ereignis.bretton_woods: "Konferenz von Bretton Woods"
ereignis.bretton_woods.text: "44 Staaten vereinbaren feste Wechselkurse zum an Gold gebundenen US-Dollar und gründen den Internationalen Währungsfonds und die Weltbank."
ereignis.kriegsende_europa: "Kriegsende in Europa"
ereignis.kriegsende_europa.text: "Deutschland kapituliert bedingungslos. Städte, Brücken und Fabriken liegen in Trümmern, Millionen Menschen sind auf der Flucht."
ereignis.hiroshima: "Atombombe auf Hiroshima"
ereignis.hiroshima.text: "Die USA werfen die erste Atombombe auf Hiroshima, drei Tage später eine zweite auf Nagasaki. Über hunderttausend Menschen sterben."
ereignis.kapitulation_japan: "Kapitulation Japans"
ereignis.kapitulation_japan.text: "Japan unterzeichnet die Kapitulation, der Zweite Weltkrieg ist zu Ende. Rüstungsaufträge brechen weg, die Industrie stellt wieder auf zivile Güter um."
ereignis.vereinte_nationen: "Vereinte Nationen gegründet"
ereignis.vereinte_nationen.text: "Die Charta der Vereinten Nationen tritt in Kraft; 51 Staaten wollen künftige Kriege verhindern."
ereignis.indien_pakistan: "Unabhängigkeit Indiens und Pakistans"
ereignis.indien_pakistan.text: "Britisch-Indien wird in die Staaten Indien und Pakistan geteilt. Millionen Menschen fliehen über die neuen Grenzen, Handelswege und Bahnlinien werden zerschnitten."
ereignis.gatt: "Allgemeines Zoll- und Handelsabkommen (GATT)"
ereignis.gatt.text: "23 Staaten senken gegenseitig ihre Zölle und verpflichten sich, alle Handelspartner gleich zu behandeln. In weiteren Runden sinken die Zölle über Jahrzehnte."
ereignis.marshallplan: "Marshallplan"
ereignis.marshallplan.text: "Die USA unterstützen den Wiederaufbau Westeuropas mit Krediten, Rohstoffen und Maschinen im Wert von rund 13 Milliarden Dollar."
ereignis.israel: "Staat Israel gegründet"
ereignis.israel.text: "David Ben-Gurion ruft den Staat Israel aus; am nächsten Tag greifen die arabischen Nachbarstaaten an."
ereignis.berlin_blockade: "Berlin-Blockade"
ereignis.berlin_blockade.text: "Nach der Währungsreform in den Westzonen sperrt die Sowjetunion die Wege nach West-Berlin. Die Westmächte versorgen die Stadt fast ein Jahr lang über eine Luftbrücke."
ereignis.nato: "NATO gegründet"
ereignis.nato.text: "Zwölf Staaten Nordamerikas und Westeuropas schließen ein Verteidigungsbündnis."
ereignis.bundesrepublik: "Bundesrepublik Deutschland gegründet"
ereignis.bundesrepublik.text: "Das Grundgesetz tritt in Kraft; im Oktober folgt im Osten die Deutsche Demokratische Republik. Im Westen beginnt das Wirtschaftswunder."
ereignis.volksrepublik_china: "Volksrepublik China"
ereignis.volksrepublik_china.text: "Mao Zedong ruft die Volksrepublik aus; die Regierung der Republik China zieht sich nach Taiwan zurück. Banken, Industrie und Außenhandel kommen nach und nach unter staatliche Kontrolle."
ereignis.koreakrieg: "Koreakrieg"
ereignis.koreakrieg.text: "Nordkorea überfällt Südkorea. Die Nachfrage nach Stahl, Rüstung und Rohstoffen schnellt weltweit hoch (Korea-Boom)."
ereignis.montanunion: "Montanunion"
ereignis.montanunion.text: "Frankreich, Deutschland, Italien und die Benelux-Staaten stellen Kohle und Stahl unter eine gemeinsame Behörde und heben die Zölle dafür auf."
ereignis.waffenstillstand_korea: "Waffenstillstand in Korea"
ereignis.waffenstillstand_korea.text: "Der Koreakrieg endet mit einem Waffenstillstand; Korea bleibt geteilt."
ereignis.containerschiff: "Erstes Containerschiff"
ereignis.containerschiff.text: "Malcom McLean schickt die Ideal X mit 58 Containern von Newark nach Houston. Der Container macht den Seetransport in den folgenden Jahrzehnten viel billiger und schneller."
ereignis.ungarnaufstand: "Volksaufstand in Ungarn"
ereignis.ungarnaufstand.text: "Ungarn erhebt sich gegen die kommunistische Regierung; sowjetische Truppen schlagen den Aufstand nieder."
ereignis.suezkrise: "Suezkrise"
ereignis.suezkrise.text: "Ägypten hat den Suezkanal verstaatlicht; Israel, Großbritannien und Frankreich greifen an. Der Kanal ist monatelang gesperrt, Schiffe müssen um Afrika fahren."
ereignis.roemische_vertraege: "Römische Verträge"
ereignis.roemische_vertraege.text: "Die sechs Staaten der Montanunion gründen die Europäische Wirtschaftsgemeinschaft. Bis 1968 fallen die Zölle zwischen ihnen ganz weg."
ereignis.sputnik: "Sputnik"
ereignis.sputnik.text: "Die Sowjetunion bringt den ersten künstlichen Satelliten in eine Umlaufbahn. Der Westen steckt viel Geld in Raumfahrt, Forschung und Bildung."
ereignis.kubanische_revolution: "Revolution in Kuba"
ereignis.kubanische_revolution.text: "Fidel Castro stürzt den Diktator Batista. Zuckerplantagen, Raffinerien und ausländische Firmen werden verstaatlicht, die USA verhängen ein Handelsembargo."
ereignis.opec: "OPEC gegründet"
ereignis.opec.text: "Iran, Irak, Kuwait, Saudi-Arabien und Venezuela gründen die Organisation erdölexportierender Länder, um höhere Preise durchzusetzen."
ereignis.afrikanisches_jahr: "Afrikanisches Jahr"
ereignis.afrikanisches_jahr.text: "17 afrikanische Kolonien werden 1960 unabhängig, am 1. Oktober Nigeria, das bevölkerungsreichste Land Afrikas."
ereignis.gagarin: "Erster Mensch im All"
ereignis.gagarin.text: "Juri Gagarin umkreist als erster Mensch die Erde."
ereignis.berliner_mauer: "Bau der Berliner Mauer"
ereignis.berliner_mauer.text: "Die DDR riegelt West-Berlin ab, um die Abwanderung von Arbeitskräften in den Westen zu stoppen."
ereignis.kubakrise: "Kubakrise"
ereignis.kubakrise.text: "Die USA entdecken sowjetische Atomraketen auf Kuba und verhängen eine Seeblockade. Nach dreizehn Tagen am Rand eines Atomkriegs lenkt die Sowjetunion ein."
ereignis.shinkansen: "Shinkansen"
ereignis.shinkansen.text: "Zwischen Tokio und Osaka fährt der erste Hochgeschwindigkeitszug mit über 200 km/h."
ereignis.vietnamkrieg: "Vietnamkrieg"
ereignis.vietnamkrieg.text: "Die ersten amerikanischen Kampftruppen landen in Da Nang; bald kämpfen über eine halbe Million US-Soldaten in Vietnam. Die Kriegskosten treiben die Inflation in den USA."
ereignis.sechstagekrieg: "Sechstagekrieg"
ereignis.sechstagekrieg.text: "Israel besiegt Ägypten, Jordanien und Syrien. Der Suezkanal bleibt bis 1975 gesperrt; Reedereien bauen immer größere Tanker für den Weg um Afrika."
ereignis.prager_fruehling: "Ende des Prager Frühlings"
ereignis.prager_fruehling.text: "Truppen des Warschauer Pakts besetzen die Tschechoslowakei und beenden die Reformen unter Alexander Dubček."
ereignis.mondlandung: "Mondlandung"
ereignis.mondlandung.text: "Neil Armstrong und Buzz Aldrin betreten als erste Menschen den Mond."
ereignis.jumbojet: "Großraumflugzeuge im Liniendienst"
ereignis.jumbojet.text: "Der erste Großraumjet fliegt von New York nach London. Flugreisen und Luftfracht werden für viele erschwinglich."
ereignis.nixon_schock: "Ende der Goldbindung des Dollars"
ereignis.nixon_schock.text: "Die USA tauschen Dollar nicht mehr in Gold. Das System fester Wechselkurse von Bretton Woods zerbricht; ab 1973 schwanken die Kurse frei."
ereignis.eg_erweiterung_1973: "Erweiterung der EG"
ereignis.eg_erweiterung_1973.text: "Großbritannien, Irland und Dänemark treten der Europäischen Gemeinschaft bei."
ereignis.oelkrise_1973: "Ölkrise"
ereignis.oelkrise_1973.text: "Die arabischen Ölstaaten drosseln die Förderung und liefern nicht mehr an die USA und die Niederlande. Der Ölpreis vervierfacht sich, in mehreren Ländern bleiben sonntags die Autos stehen."
ereignis.fall_saigons: "Fall Saigons"
ereignis.fall_saigons.text: "Nordvietnamesische Truppen erobern Saigon; der Vietnamkrieg endet, Vietnam wird vereinigt."
ereignis.reform_china: "Reform und Öffnung in China"
ereignis.reform_china.text: "Unter Deng Xiaoping dürfen Bauern ihre Überschüsse selbst verkaufen; bald öffnen Sonderwirtschaftszonen für ausländische Firmen. China beginnt einen jahrzehntelangen Aufschwung."
ereignis.iranische_revolution: "Islamische Revolution im Iran"
ereignis.iranische_revolution.text: "Der Schah ist geflohen, Ajatollah Chomeini übernimmt die Macht. Die Ölförderung des Iran bricht ein, der Ölpreis verdoppelt sich (zweite Ölkrise)."
ereignis.iran_irak_krieg: "Iran-Irak-Krieg"
ereignis.iran_irak_krieg.text: "Der Irak greift den Iran an. Der Krieg dauert acht Jahre und trifft Ölanlagen und Tanker im Persischen Golf."
ereignis.personal_computer: "Der Personal Computer wird Standard"
ereignis.personal_computer.text: "Ein Personal Computer für das Büro kommt auf den Markt und setzt den Standard. Rechner ziehen in die Büros ein und bald auch in die Haushalte."
ereignis.schuldenkrise_lateinamerika: "Schuldenkrise in Lateinamerika"
ereignis.schuldenkrise_lateinamerika.text: "Mexiko kann seine Auslandsschulden nicht mehr bedienen, viele Länder Lateinamerikas folgen. Es beginnt ein verlorenes Jahrzehnt mit Sparprogrammen und hoher Inflation."
ereignis.plaza_abkommen: "Plaza-Abkommen"
ereignis.plaza_abkommen.text: "Die fünf größten Industrieländer vereinbaren, den Dollar abzuwerten. Yen und D-Mark steigen kräftig, Waren aus Japan und Deutschland werden im Ausland teurer."
ereignis.tschernobyl: "Reaktorunglück von Tschernobyl"
ereignis.tschernobyl.text: "Ein Kernreaktor explodiert; radioaktiver Niederschlag geht über weiten Teilen Europas nieder. Ein Gebiet von 30 Kilometern um das Kraftwerk wird geräumt."
ereignis.schwarzer_montag: "Schwarzer Montag"
ereignis.schwarzer_montag.text: "Der Dow-Jones-Index fällt an einem Tag um fast 23 Prozent, die Börsen der Welt folgen."
ereignis.mauerfall: "Fall der Berliner Mauer"
ereignis.mauerfall.text: "Die DDR öffnet ihre Grenzen. In ganz Osteuropa enden die kommunistischen Regierungen, Planwirtschaften werden zu Marktwirtschaften."
ereignis.deutsche_einheit: "Deutsche Einheit"
ereignis.deutsche_einheit.text: "Die DDR tritt der Bundesrepublik bei. Schon im Juli hat die D-Mark die Mark der DDR ersetzt; viele ostdeutsche Betriebe können im Wettbewerb nicht bestehen."
ereignis.zweiter_golfkrieg: "Zweiter Golfkrieg"
ereignis.zweiter_golfkrieg.text: "Eine Koalition unter Führung der USA befreit Kuwait, das der Irak im August 1990 besetzt hat. Beim Rückzug setzen irakische Truppen Hunderte Ölquellen in Brand."
ereignis.ende_sowjetunion: "Ende der Sowjetunion"
ereignis.ende_sowjetunion.text: "Die Sowjetunion löst sich auf, fünfzehn Republiken werden unabhängige Staaten. Preise werden freigegeben, Staatsbetriebe privatisiert; die Wirtschaft schrumpft über Jahre."
ereignis.maastricht: "Vertrag von Maastricht"
ereignis.maastricht.text: "Die zwölf Staaten der EG gründen die Europäische Union und beschließen eine gemeinsame Währung bis spätestens 1999."
ereignis.nafta: "Nordamerikanisches Freihandelsabkommen"
ereignis.nafta.text: "Die USA, Kanada und Mexiko bauen die Zölle untereinander ab. Autowerke und Zulieferer verlagern Fertigung nach Mexiko."
ereignis.wto: "Welthandelsorganisation (WTO)"
ereignis.wto.text: "Die WTO löst das GATT ab. Ihre Regeln gelten nun auch für Dienstleistungen und Patente, Handelsstreit entscheidet ein Schiedsverfahren."
ereignis.asienkrise: "Asienkrise"
ereignis.asienkrise.text: "Thailand gibt den festen Kurs des Baht auf. Währungen und Börsen in Südostasien und Korea stürzen ab, viele Firmen gehen pleite."
ereignis.russlandkrise: "Russlandkrise"
ereignis.russlandkrise.text: "Russland stellt Zahlungen auf seine Staatsschulden ein und wertet den Rubel ab; Banken brechen zusammen."
ereignis.euro: "Einführung des Euro"
ereignis.euro.text: "Elf Länder der EU führen den Euro als gemeinsame Währung ein, zunächst nur für Überweisungen; Münzen und Scheine folgen 2002. Die Wechselkurse zwischen ihnen sind damit fest."
ereignis.dotcom_blase: "Platzen der Dotcom-Blase"
ereignis.dotcom_blase.text: "Der Nasdaq-Index erreicht seinen Höchststand und verliert in den folgenden zwei Jahren fast vier Fünftel. Viele junge Internetfirmen verschwinden."
ereignis.anschlaege_11_september: "Anschläge vom 11. September"
ereignis.anschlaege_11_september.text: "Terroristen steuern entführte Flugzeuge in das World Trade Center und das Pentagon. Der Luftverkehr bricht ein, Sicherheitskosten steigen weltweit."
ereignis.china_wto: "China tritt der WTO bei"
ereignis.china_wto.text: "China senkt seine Zölle und öffnet seine Märkte. In den folgenden Jahren wird das Land zur Werkbank der Welt."
ereignis.irakkrieg: "Irakkrieg"
ereignis.irakkrieg.text: "Truppen der USA und Großbritanniens stürzen Saddam Hussein. Der Ölpreis steigt in den folgenden Jahren stark."
ereignis.eu_osterweiterung: "Osterweiterung der EU"
ereignis.eu_osterweiterung.text: "Zehn Länder, die meisten aus Mittel- und Osteuropa, treten der Europäischen Union bei. Viele Werke ziehen wegen niedrigerer Löhne nach Osten."
ereignis.tsunami_2004: "Tsunami im Indischen Ozean"
ereignis.tsunami_2004.text: "Ein Seebeben vor Sumatra löst Flutwellen aus, die an den Küsten rund um den Indischen Ozean über 200 000 Menschen töten."
ereignis.smartphone: "Das Smartphone"
ereignis.smartphone.text: "Ein Telefon mit berührungsempfindlichem Bildschirm und Internetzugang wird vorgestellt. Smartphones verdrängen in wenigen Jahren Handys, Kameras und Navigationsgeräte."
ereignis.lehman: "Zusammenbruch von Lehman Brothers"
ereignis.lehman.text: "Die Investmentbank geht pleite, die Finanzkrise erfasst die ganze Welt. Kredite werden knapp, Industrieproduktion und Welthandel brechen ein."
ereignis.eurokrise: "Eurokrise"
ereignis.eurokrise.text: "Griechenland erhält als erstes Euroland Notkredite der anderen Euroländer und des Internationalen Währungsfonds; Irland, Portugal, Spanien und Zypern folgen."
ereignis.arabischer_fruehling: "Arabischer Frühling"
ereignis.arabischer_fruehling.text: "In Tunesien flieht Präsident Ben Ali; Proteste breiten sich nach Ägypten, Libyen, Syrien und Jemen aus. In Libyen und Syrien folgen Bürgerkriege."
ereignis.fukushima: "Erdbeben und Reaktorkatastrophe in Japan"
ereignis.fukushima.text: "Ein Seebeben und ein Tsunami verwüsten die Nordostküste Japans, im Kraftwerk Fukushima schmelzen Reaktorkerne. Lieferketten der Auto- und Elektronikindustrie reißen; Deutschland beschließt den Atomausstieg."
ereignis.krim: "Annexion der Krim"
ereignis.krim.text: "Russland gliedert die ukrainische Halbinsel Krim ein; die EU und die USA verhängen Wirtschaftssanktionen."
ereignis.pariser_abkommen: "Pariser Klimaabkommen"
ereignis.pariser_abkommen.text: "Fast alle Staaten der Welt vereinbaren, die Erderwärmung auf deutlich unter zwei Grad zu begrenzen. In der zweiten Hälfte des Jahrhunderts soll der Ausstoß von Treibhausgasen unter dem Strich auf null sinken."
ereignis.brexit: "Brexit-Referendum"
ereignis.brexit.text: "Eine knappe Mehrheit der Briten stimmt für den Austritt aus der EU, das Pfund fällt stark. Der Austritt folgt am 31. Januar 2020."
ereignis.handelskonflikt_usa_china: "Handelskonflikt zwischen den USA und China"
ereignis.handelskonflikt_usa_china.text: "Die USA erheben Strafzölle auf chinesische Waren, China antwortet mit Gegenzöllen. Der Streit weitet sich auf Waren im Wert von Hunderten Milliarden Dollar aus."
ereignis.pandemie: "Corona-Pandemie"
ereignis.pandemie.text: "Die Weltgesundheitsorganisation erklärt die Ausbreitung von COVID-19 zur Pandemie. Läden, Fabriken und Grenzen schließen; Lieferketten reißen, später fehlen Chips und Container."
ereignis.suezkanal_blockiert: "Suezkanal blockiert"
ereignis.suezkanal_blockiert.text: "Das Containerschiff Ever Given läuft im Suezkanal auf Grund und sperrt ihn sechs Tage lang; Hunderte Schiffe stauen sich."
ereignis.krieg_ukraine: "Krieg gegen die Ukraine"
ereignis.krieg_ukraine.text: "Russland greift die Ukraine an. Westliche Staaten verhängen weitreichende Sanktionen; die Preise für Gas, Öl und Getreide steigen stark."
ereignis.sprachmodelle: "Durchbruch der Sprachmodelle"
ereignis.sprachmodelle.text: "Ein großes Sprachmodell wird als Chatdienst für alle zugänglich. Künstliche Intelligenz zieht schnell in Büros und Software ein."
ereignis.krieg_gaza: "Krieg in Nahost"
ereignis.krieg_gaza.text: "Nach dem Überfall der Hamas auf Israel beginnt ein Krieg im Gazastreifen. Angriffe auf Schiffe im Roten Meer zwingen viele Reedereien zum Umweg um Afrika."
ereignis.us_zoelle_2025: "Zollerhöhungen der USA"
ereignis.us_zoelle_2025.text: "Die USA erheben Zölle auf Einfuhren aus fast allen Ländern; Handelspartner antworten mit Gegenzöllen oder verhandeln."

