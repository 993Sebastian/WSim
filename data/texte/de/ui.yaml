werk.lagerplatz.titel: Lagerplatz
werk.lagerplatz.erklaerung: "Das Lager fasst rund 60 Tage Durchsatz der Anlagen, gemessen im Lagervolumen der Güter (m³: Gewicht je Einheit durch die Stapeldichte – Schüttgut liegt dicht, Stückgut braucht Platz), mindestens einen Grundwert je Standorttyp. Die Lagerkosten richten sich nach dem Warenwert. Lagern kostet laufend, Lebensmittel und Agrarrohstoffe verderben teilweise. Ist das Lager voll, kaufen Einkaufsaufträge nicht; belegen die eigenen Erzeugnisse mindestens die Hälfte, stehen auch die Anlagen."
