# Parameter der Forschung (Lastenheft §7.1). Formeln: docs/FORMELN.md, Abschnitt M9.
# Forschungspunkte: 1 Punkt = 1 Forschertag bei Forschungseffizienz 1.

forschungsmodell:
  # Kosten × 1,25 je Jahr vor dem historischen Erfindungsjahr: 10 Jahre ≈ × 9,
  # 30 Jahre ≈ × 800, 50 Jahre ≈ × 70 000 – extreme Vorgriffe führen in die Pleite.
  vorgriff_faktor: 1.25
  # Nach der Erfindung (historisch oder im Spiel) wird es für Nachzügler billiger.
  nachzuegler:
    rabatt_je_jahr: 0.1
    minimum: 0.2
  # So viele Jahre nach dem historischen Erfindungsjahr kennt jede Firma die Technologie
  # (Wissen hat sich verbreitet); ein Patent kann die Nutzung länger sperren.
  gemeingut_nach_jahren: 25
  # Patente (P7, docs/FORMELN.md): Wer eine Technologie als erste Firma erforscht, darf sie
  # binnen der Frist je Land anmelden; dort braucht jede andere Firma eine Lizenz.
  patente:
    laufzeit_jahre: 20              # übliche Laufzeit seit den 1990er Jahren (TRIPS)
    anmeldefrist_tage: 365          # Prioritätsjahr (Pariser Verbandsübereinkunft)
    # Anmeldung, Anwalt und Jahresgebühren über die ganze Laufzeit je Land, USD bei
    # Preisniveau 1 (Europa und USA heute grob 20 000–60 000 USD)
    kosten_je_land_usd: 30_000
    # KI-Firmen melden in ihren Standortländern und in so vielen größten Märkten an.
    ki_groesste_maerkte: 5
    annaeherung: true
  # Personal im Labor (PD1, docs/PRODUKTENTWICKLUNG.md §1): Der Spieler stellt je Rolle ein; die
  # Arbeitsplätze begrenzt die Laborgröße. „forschung“ ist das Gewicht einer Person in der
  # Forschung bis zu den Entwicklungsprojekten (PD2); Rollen ohne Gewicht kosten Lohn, forschen
  # aber noch nicht. Die Projektleiter kommen mit den Projekten (PD2).
  labor:
    rollen:
      - {id: entwickler, forschung: 1}
      - {id: laborpersonal, forschung: 0.5}
      - {id: produktmanager, forschung: 0}
      - {id: fertigungsplaner, forschung: 0}
  # Entwicklungsprojekte PM0–PM7 (PD2, docs/PRODUKTENTWICKLUNG.md §2–§3, Formeln FORMELN.md PD2). Alle
  # Werte vorläufig (OFFENE_PUNKTE PD). Der Projektumfang W stammt aus den Forschungspunkten der
  # fehlenden Technologien; Kosten = W · punktekosten_usd, Dauer = W / referenzrate Tage.
  projekte:
    punktekosten_usd: 120          # Lohn + Sachkosten je Forschungspunkt (Näherung)
    referenzrate: 20               # Punkte je Tag bei Referenzbesetzung
    referenzaufwand: 10000         # W, für das der Bedarf je Rolle unten gilt
    bedarf_exponent: 0.5           # Bedarf wächst mit (W / referenzaufwand)^exponent
    ueberbesetzung: {maximum: 0.30, tau: 0.5}   # höchstens 30 % schneller, abnehmender Ertrag
    restanteil: 0.1                # Tempo einer Phase ohne jede Person in einer Rolle
    unterbesetzung: {abschlag: 0.5, hoechstens: 0.25}   # Abschlag auf die Kennzahlen der Rolle
    streuung: 0.10                 # Endkennzahlen bei PM6 um höchstens ±10 %
    gate_kosten: 0.05              # Gate PM3→PM4: Vorbereitung der Freigabe, ohne Dauer (Annahme: Rest auf 100 %)
    # Phasen zwischen den Meilensteinen (PM3→PM4 ist das Gate). Je Rolle: Bedarf (Personen bei
    # referenzaufwand) und Wirkung (Anteil am Tempo der Phase; Summe 1).
    phasen:
      - id: pm0_pm1
        kosten: 0.05
        dauer: 0.10
        rollen:
          - {id: produktmanager, bedarf: 3, wirkung: 0.60}
          - {id: entwickler, bedarf: 1, wirkung: 0.30}
          - {id: fertigungsplaner, bedarf: 0.5, wirkung: 0.05}
          - {id: laborpersonal, bedarf: 0.5, wirkung: 0.05}
      - id: pm1_pm2
        kosten: 0.10
        dauer: 0.10
        rollen:
          - {id: produktmanager, bedarf: 3, wirkung: 0.50}
          - {id: entwickler, bedarf: 2, wirkung: 0.40}
          - {id: fertigungsplaner, bedarf: 0.5, wirkung: 0.05}
          - {id: laborpersonal, bedarf: 0.5, wirkung: 0.05}
      - id: pm2_pm3
        kosten: 0.10
        dauer: 0.10
        rollen:
          - {id: produktmanager, bedarf: 1, wirkung: 0.10}
          - {id: entwickler, bedarf: 6, wirkung: 0.60}
          - {id: fertigungsplaner, bedarf: 1, wirkung: 0.10}
          - {id: laborpersonal, bedarf: 3, wirkung: 0.20}
      - id: pm4_pm5
        kosten: 0.30
        dauer: 0.30
        rollen:
          - {id: produktmanager, bedarf: 1, wirkung: 0.05}
          - {id: entwickler, bedarf: 8, wirkung: 0.60}
          - {id: fertigungsplaner, bedarf: 2, wirkung: 0.20}
          - {id: laborpersonal, bedarf: 2, wirkung: 0.15}
      - id: pm5_pm6
        kosten: 0.25
        dauer: 0.25
        rollen:
          - {id: produktmanager, bedarf: 1, wirkung: 0.05}
          - {id: entwickler, bedarf: 6, wirkung: 0.45}
          - {id: fertigungsplaner, bedarf: 4, wirkung: 0.30}
          - {id: laborpersonal, bedarf: 4, wirkung: 0.20}
      - id: pm6_pm7
        kosten: 0.15
        dauer: 0.15
        rollen:
          - {id: produktmanager, bedarf: 3, wirkung: 0.40}
          - {id: entwickler, bedarf: 1, wirkung: 0.05}
          - {id: fertigungsplaner, bedarf: 4, wirkung: 0.40}
          - {id: laborpersonal, bedarf: 2, wirkung: 0.15}
    # Tempo (PM0): Faktoren auf Dauer, Kosten und Basisrisiko.
    tempo:
      - {id: gruendlich, dauer: 1.25, kosten: 1.10, risiko: 0.70}
      - {id: normal, dauer: 1.00, kosten: 1.00, risiko: 1.00}
      - {id: beschleunigt, dauer: 0.80, kosten: 1.15, risiko: 1.50}
    # Zielausstattung (PM0): Faktor auf die Kosten und Änderung der Zielqualität.
    ausstattung:
      - {id: basis, kosten: 0.80, qualitaet: -0.10}
      - {id: standard, kosten: 1.00, qualitaet: 0.0}
      - {id: premium, kosten: 1.35, qualitaet: 0.10}
    projektleiter:
      gehalt_usd_jahr: 90_000      # Preisniveau 1
      kapazitaet_neu: 1            # eine Neuentwicklung ...
      kapazitaet_weiter: 2         # ... oder bis zu zwei Weiterentwicklungen
      kandidaten: 6                # auf dem Markt je Kontinent
      erfahrung_je_projekt: 0.1    # Erfahrung (0–1) je abgeschlossenem Projekt
      alter_min: 32
      alter_max: 58
      charaktere: [optimistisch, vorsichtig, sachlich]
    # Meilensteinberichte und Entscheidungen (PD3, docs/FORMELN.md PD3); alle Werte vorläufig.
    berichte:
      lebenszyklus_jahre: 10
      absatzanteil: 0.15             # Anteil der offenen Nachfrage, den ein Neueinsteiger erreicht
      anlagen_ohne_nachfrage: 1      # ohne offene Nachfrage: so viele Anlagen ausgelastet verkaufen
      auslastung: 0.85
      unschaerfe: 0.30               # größte Streuung der Prognose (ohne Produktmanager)
      genauigkeit_je_pm: 0.60        # so viel der Unschärfe nimmt volle Besetzung der Produktmanager
      charaktere:                    # Optimismus der Prognose und bevorzugter Lösungsweg des PL
        # gegenmeinung: Chance, dass eine Stimme des Gate-Gremiums gegen die anderen steht (PD7);
        # fast_track / pilot: Chance, beides ohne Anlass vorzuschlagen (PD7).
        optimistisch: {optimismus: 0.20, weg: innovativ, gegenmeinung: 0.25, fast_track: 0.20, pilot: 0.05}
        vorsichtig: {optimismus: -0.10, weg: bewaehrt, gegenmeinung: 0.15, fast_track: 0.0, pilot: 0.25}
        sachlich: {optimismus: 0.0, weg: standard, gegenmeinung: 0.10, fast_track: 0.05, pilot: 0.10}
      ampel:
        termin: {gelb: 0.10, rot: 0.25}
        budget: {gelb: 0.10, rot: 0.25}
        qualitaet: {gelb: 0.05, rot: 0.15}
        risiko: {gelb: 0.15, rot: 0.30}
      amortisation_max_jahre: 12     # darüber empfiehlt der PL bei roter Ampel den Abbruch
      auflagen_risiko: 0.15          # Zuschlag auf das Risiko der Phasen je Auflage
    entscheidung:
      spieler_bei: [2, 4, 6, 7]      # Standard-Delegation: hier entscheidet der Spieler
      frist_tage: 7                  # danach entscheidet der PL mit seiner Empfehlung
    profile:                         # PM1 Zielprofil
      - {id: kosten, kosten: 0.90, dauer: 1.00, risiko: 1.00, qualitaet: -0.05}
      - {id: ausgewogen, kosten: 1.00, dauer: 1.00, risiko: 1.00, qualitaet: 0.0}
      - {id: qualitaet, kosten: 1.15, dauer: 1.10, risiko: 1.00, qualitaet: 0.08}
    loesungswege:                    # PM2 Lösungsweg
      - {id: bewaehrt, kosten: 0.95, dauer: 0.95, risiko: 0.70, qualitaet: -0.03}
      - {id: standard, kosten: 1.00, dauer: 1.00, risiko: 1.00, qualitaet: 0.0}
      - {id: innovativ, kosten: 1.20, dauer: 1.10, risiko: 1.50, qualitaet: 0.10}
    # Risiko je Phase (Zähler; die Ereignisse folgen mit PD4).
    risiko:
      basis: 0.02
      unterbesetzung: 1.5
      erfahrung: 0.4
      branche: 0.3
      puffer: 0.5
      fast_track: 1.0
      branche_anlagen_ref: 4        # Anlagen der Firma in der Branche für volle Branchenstärke (PD7)
      puffer_ref: 1.0               # Kasse über offenen Projektkosten für vollen Puffer (PD7)
    # Ereignisse in den Phasen, versteckte Mängel und Rückrufe (PD4, docs/FORMELN.md).
    # Kosten: Anteil der Phasenkosten; Verzug: Anteil der Phase (negativ: Gewinn);
    # Qualität: Änderung der Zielqualität; Mangel: Zuschlag auf das versteckte Mängelrisiko.
    ereignisse:
      frist_tage: 7                  # danach wählt der PL seine Empfehlung
      mangel:
        obergrenze: 0.60
        je_auflage: 0.08             # je Meilenstein mit Auflagen
        je_unterbesetzung: 0.20      # mal Unterdeckung der Phase (0–1)
        je_tempo: [0.0, 0.0, 0.06]   # gründlich, normal, beschleunigt
      rueckruf:
        verzug_tage: [120, 400]      # nach der Freigabe
        kosten_anteil: 0.60          # der Projektkosten
        bekanntheit_verlust: 0.25    # Anteil der Bekanntheit in der Warengruppe
      katalog:
        - id: technisches_problem
          phasen: [1, 2, 3, 4]
          gewicht: 4
          empfehlung: 0
          optionen:
            - {id: budget, kosten: 0.20, verzug: 0.00, qualitaet: 0.00, mangel: 0.00}
            - {id: abstriche, kosten: 0.00, verzug: 0.00, qualitaet: -0.04, mangel: 0.05}
            - {id: verzug, kosten: 0.00, verzug: 0.25, qualitaet: 0.00, mangel: 0.00}
        - id: kostenueberschreitung
          phasen: [2, 3, 4, 5]
          gewicht: 3
          empfehlung: 1
          optionen:
            - {id: bezahlen, kosten: 0.15, verzug: 0.00, qualitaet: 0.00, mangel: 0.00}
            - {id: sparen, kosten: 0.05, verzug: 0.10, qualitaet: -0.02, mangel: 0.02}
        - id: lieferantenausfall
          phasen: [3, 4, 5]
          gewicht: 2
          empfehlung: 0
          optionen:
            - {id: ersatz, kosten: 0.10, verzug: 0.05, qualitaet: 0.00, mangel: 0.00}
            - {id: warten, kosten: 0.00, verzug: 0.30, qualitaet: 0.00, mangel: 0.00}
            - {id: umbauen, kosten: 0.05, verzug: 0.10, qualitaet: -0.03, mangel: 0.04}
        - id: entwickler_abgeworben
          phasen: [1, 2, 3, 4, 5]
          gewicht: 2
          empfehlung: 0
          optionen:
            - {id: halten, kosten: 0.12, verzug: 0.00, qualitaet: 0.00, mangel: 0.00}
            - {id: ersetzen, kosten: 0.04, verzug: 0.20, qualitaet: 0.00, mangel: 0.02}
        - id: konkurrenz
          phasen: [0, 1, 2]
          gewicht: 2
          empfehlung: 1
          optionen:
            - {id: beschleunigen, kosten: 0.15, verzug: -0.15, qualitaet: 0.00, mangel: 0.06}
            - {id: abwarten, kosten: 0.00, verzug: 0.00, qualitaet: 0.00, mangel: 0.00}
        - id: durchbruch
          phasen: [1, 2, 3, 4]
          gewicht: 1
          empfehlung: 0
          optionen:
            - {id: schneller, kosten: 0.00, verzug: -0.30, qualitaet: 0.00, mangel: 0.00}
            - {id: besser, kosten: 0.00, verzug: 0.00, qualitaet: 0.04, mangel: 0.00}
    # Weiterentwicklungsprojekte WM0–WM3 (PD5, docs/FORMELN.md): eine zweite Schicht über der
    # Weiterentwicklung nach Punkten (M37). Alle Werte vorläufig.
    weiterentwicklung:
      stufen: 3                      # deutliche Stufen je Ziel
      restanteil: 0.20               # Wirkung jeder weiteren Stufe, Anteil der dritten
      aufwand: {anteil: 0.15, wachstum: 1.5}   # Punkte der Stufe n = Basis · anteil · wachstum^(n−1)
      umruestung_tage: 90            # gestaffelte Freigabe: so lange steigt die Wirkung an
      sofort_kosten_anteil: 0.20     # Freigabe „alle sofort“: Anteil der Projektkosten
      frist_tage: 7
      ansaetze: {min: 2, max: 4, streuung: 0.35, kosten_steigung: 0.8}
      ergebnis: {streuung: 0.30, erfahrung: 0.50, unterbesetzung: 1.5}
      phasen:
        - id: wm0_wm1
          kosten: 0.2
          dauer: 0.25
          rollen:
            - {id: produktmanager, bedarf: 1, wirkung: 0.2}
            - {id: entwickler, bedarf: 2, wirkung: 0.5}
            - {id: fertigungsplaner, bedarf: 1, wirkung: 0.2}
            - {id: laborpersonal, bedarf: 1, wirkung: 0.1}
        - id: wm1_wm2
          kosten: 0.55
          dauer: 0.5
          rollen:
            - {id: produktmanager, bedarf: 0, wirkung: 0.05}
            - {id: entwickler, bedarf: 3, wirkung: 0.55}
            - {id: fertigungsplaner, bedarf: 2, wirkung: 0.25}
            - {id: laborpersonal, bedarf: 2, wirkung: 0.15}
        - id: wm2_wm3
          kosten: 0.25
          dauer: 0.25
          rollen:
            - {id: produktmanager, bedarf: 1, wirkung: 0.15}
            - {id: entwickler, bedarf: 1, wirkung: 0.25}
            - {id: fertigungsplaner, bedarf: 2, wirkung: 0.5}
            - {id: laborpersonal, bedarf: 1, wirkung: 0.1}
      ziele:
        - id: kosten
          je_stufe: 1.0
          obergrenze: 0.45
          wirkung: {arbeit: 0.06, vorprodukte: 0.03}
        - id: qualitaet
          je_stufe: 1.0
          obergrenze: 0.8
          wirkung: {qualitaet: 4.0}
        - id: ausschuss
          je_stufe: 1.0
          obergrenze: 0.8
          wirkung: {ausschuss: 0.15}
        - id: rate
          je_stufe: 1.0
          obergrenze: 0.6
          wirkung: {menge: 0.05}
        - id: vorprodukte
          je_stufe: 1.0
          obergrenze: 0.6
          wirkung: {vorprodukte: 0.06}
        - id: ausstattung
          je_stufe: 1.0
          obergrenze: 0.6
          wirkung: {qualitaet: 2.0, menge: 0.025}
    # Produktvorschläge der Strategie und Nachkalkulation (PD6, docs/FORMELN.md). Vorläufig.
    vorschlaege:
      offen_max: 3                   # offene Vorschläge je Firma
      gueltig_tage: 180
      branchenbonus: 0.5             # Aufschlag auf den Wert für Produkte der eigenen Branchen
      unschaerfe: 0.35               # Streuung der Prognose ohne Strategieabteilung
      genauigkeit: 0.6               # Anteil, den eine voll besetzte Abteilung abbaut
      nachkalkulation_jahre: 2
      toleranz: 0.5                  # relative Abweichung, bei der der Wert 0 ist
      treffer_ab: 0.6
      gewichte: {termin: 0.25, budget: 0.25, kennzahlen: 0.5}
    # Gate-Gremium bei PM3, PM4, PM7 (PD7, docs/FORMELN.md). Vorläufig.
    gremium:
      unschaerfe: 0.5                # Streuung der Wahrnehmung ohne Strategieabteilung
      genauigkeit: 0.6               # Anteil, den eine voll besetzte Abteilung abbaut
      schwelle: 0.25                 # ab hier dafür bzw. dagegen
      pause_mehrheit: 3              # bei PM7 pausiert das Projekt, wenn so viele dagegen sind
      schleifen_max: 2               # das Gremium stuft nur in eine Schleife zurück, solange weniger Schleifen liefen
    # Fast-Track auf Vorschlag des Projektleiters (PD7): Phasen 3 und 4 überlappen.
    fast_track:
      erfahrung_min: 0.3
      ueberlappung: 0.25             # Anteil der Dauer von Phase 3 und 4, der entfällt
      kosten_faktor: 1.10
      mangel: 0.12                   # Zuschlag auf das versteckte Mängelrisiko
    # Teilwissen, Plattform, Projektlizenz und Entwicklungspartnerschaft (PD8). Vorläufig.
    teilwissen:
      anteil: 0.6                    # Anteil des Fortschritts, den ein abgebrochenes Projekt hinterlässt
      wirkung: 0.5                   # größte Verkürzung von Dauer und Kosten eines neuen Projekts
    plattform:
      wirkung: 0.4                   # Verkürzung von PM4→PM6, wenn alle Vorprodukte bekannt sind
    lizenz:
      preis_anteil: 0.5              # Preis als Anteil der Kosten des Verkäuferprojekts
      ab_phase: 4                    # Phase, in der das lizenzierte Projekt startet (4 = PM5→PM6)
      gebuehr_anteil: 0.10           # Gebühren insgesamt als Anteil der Kosten des Verkäuferprojekts
      gebuehr_jahre: 5
    partnerschaft:
      kosten_anteil: 0.5             # Anteil der Kosten, den der Partner trägt
      ki_annahme: 0.5                # Chance, dass eine KI-Firma annimmt
    # Bonus für die erste Firma, die ein Produkt freigibt, im Land des Labors (PD9). Vorläufig.
    erstankunft:
      bekanntheit: 0.25              # Anteil der fehlenden Bekanntheit der Warengruppe
      ruf: 0.05
    # Staatliche Förderprogramme für Entwicklungsprojekte nach Epoche (PD9). Vorläufig, geschätzt.
    foerderung:
      - {id: industrieforschung, von: 1900, bis: 1939, anteil: 0.05, deckel_usd: 150000, annaeherung: true}
      - {id: wiederaufbau, von: 1945, bis: 1964, anteil: 0.15, deckel_usd: 400000, annaeherung: true}
      - {id: technologiefoerderung, von: 1965, bis: 1999, anteil: 0.20, deckel_usd: 1000000, annaeherung: true}
      - {id: innovationsprogramm, von: 2000, bis: 2100, anteil: 0.25, deckel_usd: 5000000, annaeherung: true}
    # Entwicklungsleitung (PD11, docs/FORMELN.md): Einstellen mit Vorlauf, Abfindung, Einarbeitung,
    # Reserve und Budgetkaskade vom Vorstand Entwicklung bis zum Laborleiter.
    leitung:
      vorlauf_monate: 2              # von der Entscheidung bis die Leute da sind
      einarbeitung_monate: 1         # Versetzte arbeiten so lange ohne Wirkung
      abfindung_monate: 3            # Monatsgehälter bei Entlassung
      vorausschau_monate: 3          # so weit im Voraus wird der Bedarf der Phasen geplant
      geduld_monate: 2               # so lange muss ein Überhang bestehen, bevor verschoben/entlassen wird
      reserve: 0.10                  # Reserve auf den Bedarf
      reserve_sparsam: 0.3           # Faktor auf die Reserve bei sparsamem Leiter
      reserve_grosszuegig: 1.8       # Faktor bei großzügigem Leiter
      budget_anteil: 0.04            # Entwicklungsbudget als Anteil am Umsatz der nächsten zwölf Monate
      grundausstattung: 0.5          # Anteil der Arbeitsplätze eines Labors, den das Budget mindestens trägt
      annaeherung: true
    # Pilotserie zwischen PM6 und PM7 auf Vorschlag des Projektleiters (PD7).
    pilot:
      risiko_ab: 0.15                # Mängelrisiko, ab dem der Projektleiter sie vorschlägt
      dauer_anteil: 0.30             # Anteil der Dauer von PM6→PM7
      kosten_anteil: 0.25            # Anteil der Kosten von PM6→PM7
      aufdeckung_faktor: 2.5         # Chance, einen Mangel zu finden = Mängelrisiko · Faktor
      behebung: 0.70                 # Anteil des Mängelrisikos, den ein gefundener Mangel nimmt
      nacharbeit: 0.15               # Verzug als Anteil der Dauer von PM6→PM7
      qualitaet_bonus: 0.03          # Zielqualität bei Pilot ohne Befund
      beruhigung: 0.40               # Anteil des Mängelrisikos, den ein Pilot ohne Befund nimmt
  # Qualifikation der Forscher; die Fachrichtung ist das Fachgebiet der Technologie.
  forscher: akademiker
  # Geräte und Material je Forscher und Tag (USD bei Preisniveau 1)
  sachkosten_usd_je_forschertag: 40

  # Weiterentwicklung erforschter Produkte (M37, docs/FORMELN.md): Jede Firma kann jedes
  # Produkt, das sie herstellen darf, Stufe für Stufe verbessern.
  weiterentwicklung:
    # Generationen (Q1): Punkteschwellen für Nachfolgemodelle und Start-ups; die Forschung
    # geht darüber hinaus weiter, die Wirkung folgt allein dem Niveau.
    stufen: 5
    # Wirkung beim Führenden (Niveau 100 %) in allen Rezepten der Firma für das Produkt
    # (Q1): Qualitätspunkte · Niveau, eingesparter Anteil der Arbeitsstunden und der
    # Vorprodukte je Durchlauf · Niveau · Reife.
    # Die Vorprodukte spart seit Q6 die Fertigungsforschung (fertigung).
    wirkung_max: {qualitaet: 30, arbeit: 0.2, vorprodukte: 0}
    # Fertigungsforschung (Q6, Wunsch vom 11.10.2026): beim Führenden mehr Ausstoß je
    # Durchlauf und weniger Vorprodukte, je · Niveau · Reife.
    fertigung: {ausstoss: 0.25, vorprodukte: 0.15}
    # Generation n kostet B · anteil · wachstum^(n − 1) Forschungspunkte; B ist der größte
    # Forschungsaufwand der Technologien des Produkts, mindestens grundaufwand. B ist auch
    # das Maß der Reife: S = 1 − e^(−Punkte des Führenden / B).
    aufwand:
      anteil: 1.0
      wachstum: 1.7
      grundaufwand: 10_000
