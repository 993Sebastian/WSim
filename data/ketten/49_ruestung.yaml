      fachkraft.elektro: 400
      akademiker.elektro: 40
    qualitaet_basis: 55
    annaeherung: true

technologien:
  - id: panzer                    # Mark I an der Somme
    fachgebiet: maschinenbau
    erfindungsjahr: 1916
    voraussetzungen: [ottomotor]
    forschungsaufwand: 15000
    annaeherung: true

  - id: jagdflugzeug              # Fokker E.I mit synchronisiertem MG
    fachgebiet: maschinenbau
    erfindungsjahr: 1915
    voraussetzungen: [flugmotor]
    forschungsaufwand: 10000
    annaeherung: true

  - id: duesenjaeger              # Me 262, Gloster Meteor; Großserie ab 1949
    fachgebiet: maschinenbau
    erfindungsjahr: 1944
    voraussetzungen: [strahltriebwerk, jagdflugzeug]
    forschungsaufwand: 50000
    annaeherung: true

  - id: lenkflugkoerper           # AIM-9 Sidewinder, Nike Ajax
    fachgebiet: elektro
    erfindungsjahr: 1956
    voraussetzungen: [transistor, strahltriebwerk]
    forschungsaufwand: 40000
    annaeherung: true
