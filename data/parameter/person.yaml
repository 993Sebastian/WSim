# Spielerfigur als Person (PE2, docs/PERSON.md §5; Formeln: docs/FORMELN.md, Abschnitt PE2).
# Alle Werte geschätzt.

person:
  # Alter der Person beim Spielbeginn: Vorgabe und erlaubte Spanne (Jahre).
  alter_start: {standard: 30, von: 18, bis: 60}
  # Kinder kommen, solange die Person verheiratet und kinder_ab bis unter kinder_bis Jahre
  # alt ist, mit dieser Chance je Jahr, höchstens so viele; ab managerkarte_ab Jahren hat
  # ein Kind eine Managerkarte.
  familie: {kinder_ab: 22, kinder_bis: 45, kinder_hoechstens: 4, kinder_chance_jahr: 0.15,
            managerkarte_ab: 25}
  # Privatkonto und Firmengründung (PE3, docs/PERSON.md §6–8; Formeln: docs/FORMELN.md,
  # Abschnitt PE3). Maß ist der Akademiker-Monatslohn: ein Zwölftel des Jahreslohns der
  # Gehaltsgruppe der Manager (management.yaml, gehalt_lohngruppe) im Land.
  # Gründungskosten (Register, Notar): Anteil der Einlage, mindestens so viele
  # Akademiker-Monatslöhne im Sitzland; die Oberfläche schlägt diesen Anteil des Kontos als
  # Einlage vor.
  gruendung: {kosten_anteil: 0.005, kosten_mindestens_monatsloehne: 1, einlage_vorschlag: 0.9}
  # Gehalt als CEO: mit Mitgesellschaftern höchstens dieses Vielfache des Vorschlags.
  gehalt: {hoechstens_mitgesellschafter: 2}
  # Gesellschafterdarlehen: höchster Zins je Jahr und längste Laufzeit in Jahren.
  darlehen: {zins_hoechstens: 0.15, jahre_hoechstens: 30}
  # Lebensstil je Stufe: Kosten je Monat in Akademiker-Monatslöhnen des Wohnsitzlandes,
  # Auf- oder Abschlag auf den Zins neuer Bankkredite der kontrollierten Firmen, Anteil mehr
  # oder weniger Gehaltsforderung für den Vorstand, Ausbildung der Kinder (Punkte auf jede
  # Fähigkeit), Faktor auf die Sterbechance der Person. Wechsel höchstens einmal in so
  # vielen Monaten.
  lebensstil:
    # Gründer beginnen bescheiden; ein Gehalt für „bürgerlich“ trägt eine Werkstatt von 1900
    # noch nicht (Weltlauf PE3).
    standard: bescheiden
    wechsel_monate: 12
    stufen:
      bescheiden: {kosten: 0.5, zins: 0.005, gehaltsforderung: 0.05, ausbildung: 0,
                   sterblichkeit: 1.1}
      buergerlich: {kosten: 1, zins: 0, gehaltsforderung: 0, ausbildung: 5, sterblichkeit: 1}
      gehoben: {kosten: 3, zins: -0.0025, gehaltsforderung: -0.05, ausbildung: 10,
                sterblichkeit: 0.95}
      luxurioes: {kosten: 8, zins: -0.005, gehaltsforderung: -0.1, ausbildung: 15,
                  sterblichkeit: 0.95}
  # Privatleben (Wunsch vom 10.10.2026): Kosten je Monat in Akademiker-Monatslöhnen des
  # Wohnsitzlandes. Partnersuche mit dieser Chance je Monat; Privatschule je Kind bis zur
  # Managerkarte mit so vielen Punkten auf jede Fähigkeit für eine ganze Kindheit
  # (anteilig); Gesundheitsvorsorge als Faktor auf die Sterbechance.
  privatleben:
    partnersuche: {kosten_monat: 0.3, chance_monat: 0.12}
    privatschule: {kosten_monat: 0.8, ausbildung: 12}
    vorsorge: {kosten_monat: 0.5, sterblichkeit: 0.8}
  # Einkommensteuer je Land und Jahr: ein Satz für das Einkommen eines Unternehmers (Gehalt,
  # Zinsen), grob der mittlere Satz hoher Einkommen.
  einkommensteuer:
    standard: {1900: 0.04, 1914: 0.06, 1920: 0.15, 1945: 0.35, 1980: 0.35, 2000: 0.32,
               2026: 0.3}
    laender:
      USA: {1900: 0, 1913: 0.02, 1918: 0.15, 1930: 0.1, 1944: 0.4, 1970: 0.35, 1990: 0.28,
            2026: 0.3}
      GBR: {1900: 0.05, 1918: 0.2, 1945: 0.45, 1980: 0.4, 2000: 0.33, 2026: 0.35}
      DEU: {1900: 0.04, 1920: 0.15, 1946: 0.4, 1960: 0.35, 2000: 0.38, 2026: 0.38}
      FRA: {1900: 0, 1916: 0.05, 1946: 0.3, 1980: 0.35, 2026: 0.35}
      XNO: {1900: 0.03, 1920: 0.15, 1950: 0.45, 1980: 0.55, 2000: 0.45, 2026: 0.4}
      JPN: {1900: 0.03, 1940: 0.2, 1950: 0.4, 1990: 0.35, 2026: 0.33}
  # Stufen der Einkommensteuer (PV1, FORMELN PV1): Einkommen in Akademiker-Jahreslöhnen des
  # Wohnsitzlandes ab `ab` wird mit `faktor` mal dem Satz der Reihe oben besteuert (Grenzsatz,
  # höchstens 90 %). Ohne Stufen gilt der Satz für das ganze Einkommen.
  einkommensteuer_stufen:
    - {ab: 0, faktor: 0.2}
    - {ab: 1, faktor: 0.6}
    - {ab: 3, faktor: 1.0}
    - {ab: 10, faktor: 1.3}
  # Pauschale Kapitalertragsteuer auf Zinsen (Dividenden: Quellensteuer der Länder).
  kapitalertragsteuer:
    standard: {1900: 0, 1920: 0.05, 1950: 0.15, 2000: 0.25, 2026: 0.25}
  # Guthabenzins des Privatkontos je Land und Jahr (real, Kaufkraft 2026).
  sparzins:
    standard: {1900: 0.02}
  # Hintergrund, Zeit und Gesundheit (PV1b). Hintergründe: Startwerte der Wirkung; Anteile
  # (forschung, loyalitaet) werden mit Erfahrung skaliert und bei `deckel` gekappt.
  wohlbefinden:
    hintergruende:
      tueftler: {forschung: 0.05}
      kaufmann: {kreditzins: -0.005, ordergebuehr: -0.2}
      charismatiker: {loyalitaet: 0.1}
      erbe: {ansehen: 20, netzwerk: 10}
    deckel: 0.1
    erfahrung_je_jahr: 0.1
    zeit:
      standard: {firma: 60, familie: 15, netzwerk: 10, erholung: 15}
      # Mindestanteil Firma: basis + je_firma * geleitete Firmen, höchstens.
      mindest_firma: {basis: 20, je_firma: 10, hoechstens: 80}
      # Tage, um die Anliegen früher verfallen, je 100 % fehlender Anteil.
      verzoegerung_tage: 30
    gesundheit:
      start: 85
      altern_ab: 40
      altern_je_jahr: 0.01
      ueberlastung_ab: 70
      ueberlastung_verlust: 2
      erholung_gewinn: 2
      lebensstil_gewinn: [-0.2, 0, 0.2, 0.3]
      vorsorge_gewinn: 0.2
      gesund_ab: 80
      sterblichkeit_null: 3
      krank_unter: 35
      krank_chance: 0.3
      krank_monate: 3
  # Erbe (PE6): Ohne Kind erbt ein Neffe oder eine Nichte im Alter von–bis Jahren; ab
  # hinweis_ab Jahren jeden Januar der Hinweis „Nachfolge bedenken“, solange kein Erbe
  # bestimmt ist.
  erbe: {neffe_alter: {von: 25, bis: 40}, hinweis_ab: 70}
  # Erbschaft- und Schenkungsteuer je Land und Jahr: ein Satz auf den ganzen Nachlass,
  # grob der wirksame Satz großer Unternehmervermögen (Betriebsvermögen ist in vielen
  # Ländern begünstigt, daher deutlich unter den Spitzensätzen).
  erbschaftsteuer:
    standard: {1900: 0.03, 1920: 0.1, 1950: 0.2, 2026: 0.15}
    laender:
      USA: {1900: 0, 1916: 0.05, 1935: 0.3, 1980: 0.3, 2001: 0.25, 2026: 0.2}
      GBR: {1900: 0.05, 1919: 0.2, 1949: 0.4, 1975: 0.3, 1988: 0.2, 2026: 0.2}
      DEU: {1900: 0.02, 1920: 0.1, 1950: 0.15, 2026: 0.1}
      FRA: {1900: 0.03, 1950: 0.2, 2026: 0.25}
      XNO: {1900: 0.03, 1950: 0.3, 2003: 0.3, 2004: 0}
      JPN: {1900: 0.03, 1950: 0.4, 2026: 0.3}
  annaeherung: true
