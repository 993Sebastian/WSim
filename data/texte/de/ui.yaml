# Einführung (Lastenheft §14.4): Schritte in ui/src/ansichten/Einfuehrung.tsx
einfuehrung.titel: Einführung
einfuehrung.schritt: "Schritt {nummer} von {anzahl}"
einfuehrung.beenden: Einführung beenden
einfuehrung.zuklappen: Einführung verkleinern
einfuehrung.aufklappen: Einführung aufklappen
einfuehrung.zurueck: Zurück
einfuehrung.weiter: Weiter
einfuehrung.ueberspringen: Überspringen
einfuehrung.fertig: Fertig
einfuehrung.starten: Einführung starten
einfuehrung.tipp_klick: Klicke auf das hervorgehobene Feld – dann geht es von selbst weiter.
einfuehrung.tipp_weg: Erst dorthin – das hervorgehobene Feld führt dich hin.
einfuehrung.willkommen.titel: "Willkommen bei {firma}"
einfuehrung.willkommen.text: "Du führst eine kleine Nagelwerkstatt in {land}. Diese Einführung bringt dich bis zu deinen ersten verkauften Nägeln; was du anklicken sollst, ist jeweils hervorgehoben. Die Märkte sind schon verteilt: Etablierte Firmen versorgen jedes Land. Verkaufen wirst du, was du ihnen abnimmst – über den Preis, eine bekannte Marke und genug Ware im Handel."
einfuehrung.willkommen_handel.titel: "Willkommen bei {firma}"
einfuehrung.willkommen_handel.text: "Du führst eine Handelsniederlassung in {land}: Sie stellt nichts her, sondern kauft Ware ein und verkauft sie weiter. Diese Einführung bringt dich bis zu deinem ersten Verkauf; was du anklicken sollst, ist jeweils hervorgehoben."
einfuehrung.standorte.titel: Deine Standorte
einfuehrung.standorte.text: Öffne oben den Reiter „Standorte“. Dort steht jeder deiner Standorte mit Umsatz, Ergebnis, Beschäftigten und Engpässen.
einfuehrung.werk_oeffnen.titel: Die Werkstatt öffnen
einfuehrung.werk_oeffnen.text: Das ist deine Werkstatt. Mit „Öffnen“ kommst du in die Werksansicht – dort steuerst du Anlagen, Einkauf, Verkauf und Personal.
einfuehrung.niederlassung_oeffnen.titel: Die Niederlassung öffnen
einfuehrung.niederlassung_oeffnen.text: Das ist deine Niederlassung. Mit „Öffnen“ kommst du in ihre Ansicht – dort steuerst du Einkauf und Verkauf.
einfuehrung.anlage.titel: Die Anlage
einfuehrung.anlage.text: "Die Nagelmaschine macht aus Draht Nägel. Die Karte zeigt, ob sie läuft, was sie je Tag braucht und herstellt und was sie bremst; Verfahren und Auslastung kannst du hier ändern. Für den Anfang passt alles – weiter mit „Weiter“."
einfuehrung.einkauf_oeffnen.titel: Einkauf
einfuehrung.einkauf_oeffnen.text: Ohne Vorprodukte keine Erzeugung. Öffne den Bereich „Einkauf“.
einfuehrung.einkauf.titel: Draht einkaufen
einfuehrung.einkauf.text: "Dein Einkauf hält ein Ziellager an Draht und zahlt höchstens den Höchstpreis. „Reicht für“ zeigt, wie lange der Vorrat hält. Steigt der Marktpreis über deinen Höchstpreis, kaufst du nichts mehr – dann steht die Maschine still."
einfuehrung.einkauf_handel.titel: Ware einkaufen
einfuehrung.einkauf_handel.text: "Wähle unter „Weiteres Produkt einkaufen“ eine Ware, zum Beispiel Nägel. Trage ein Ziellager ein (so viel hältst du vorrätig, für den Anfang etwa 5 t) und als Höchstpreis etwas mehr als den Marktpreis – vorgeschlagen sind 10 % mehr. Dann klicke „Einkauf starten“."
einfuehrung.verkauf_oeffnen.titel: Verkauf
einfuehrung.verkauf_oeffnen.text: Jetzt zum Wichtigsten. Öffne den Bereich „Verkauf“.
einfuehrung.preis.titel: Dein Preis
einfuehrung.preis.text: "Hier legst du fest, zu welchem Preis du anbietest; daneben stehen Marktpreis, Richtpreis und deine Stückkosten. Als Neuling nimmst du etablierten Firmen Kunden ab: Etwas unter dem Marktpreis verkaufst du mehr, über den Stückkosten verdienst du daran. Probiere „−5 %“ oder gib einen Preis ein und klicke „Übernehmen“ – oder lass ihn, wie er ist, mit „Überspringen“."
einfuehrung.angebot_handel.titel: Ware anbieten
einfuehrung.angebot_handel.text: "Biete die Ware jetzt an: Wähle sie unter „Weiteres Produkt anbieten“, setze einen Preis über deinem Einkaufspreis, aber nicht weit über dem Marktpreis, und klicke „Anbieten“."
einfuehrung.personal.titel: Personal
einfuehrung.personal.text: Arbeitskräfte werden zu Monatsbeginn eingestellt; fehlen welche, steht die Anlage. Im Bereich „Personal“ siehst du Bedarf und Besetzung und kannst mit einem Lohnaufschlag Leute anwerben. Öffne ihn.
einfuehrung.runde.titel: Runde beenden
einfuehrung.runde.text: "Alles bereit. Wähle oben als Rundenlänge „Woche“ und klicke „Runde beenden“. Die Welt rechnet Tag für Tag: Draht wird geliefert, die Maschine läuft, Kunden kaufen."
einfuehrung.runde_handel.titel: Runde beenden
einfuehrung.runde_handel.text: "Alles bereit. Wähle oben als Rundenlänge „Monat“ und klicke „Runde beenden“: Erst kommt die Ware an, dann verkaufst du sie."
einfuehrung.runde_nochmal.titel: Noch eine Runde
einfuehrung.runde_nochmal.text: "Noch kein Verkauf – das kommt vor. Die Übersicht nennt unter „Zu erledigen“ die Ursachen (Preis zu hoch, Ware oder Vorprodukt fehlt, Personal fehlt). Ändere bei Bedarf deinen Preis und beende dann eine weitere Runde."
einfuehrung.bericht_verkauft.titel: Dein erster Umsatz
einfuehrung.bericht_verkauft.text: "Geschafft: Du hast in dieser Runde für {umsatz} verkauft! Unter „Was lief“ stehen Umsatz und Rohertrag je Produkt, oben die Kasse vorher und nachher. Schließe den Bericht mit „Weiter“."
einfuehrung.bericht_nichts.titel: Der Rundenbericht
einfuehrung.bericht_nichts.text: Nach jeder Runde fasst der Rundenbericht zusammen, was geschehen ist (vorher kommen Nachrichten aus aller Welt). Diesmal wurde noch nichts verkauft; „Jetzt zu tun“ nennt die Ursachen. Schließe den Bericht mit „Weiter“.
einfuehrung.geschafft.titel: Deine Firma läuft
einfuehrung.geschafft.text: "Ab jetzt zeigt dir die Übersicht unter „Zu erledigen“, wo es hakt – ein Klick führt direkt an die Stelle. Neue Märkte und Produkte findest du im Markt, neue Werke gründest du unter „Standorte“, neue Verfahren erforschst du in der Forschung. Ein kurzer Rundgang zeigt dir diese Ansichten – oder beende die Einführung."
einfuehrung.etappen.titel: Etappen
einfuehrung.etappen.text: "Wie geht es weiter? Die Etappen in der Übersicht nennen dir das nächste lohnende Ziel – vom ersten Monat mit Gewinn bis zum verdoppelten Eigenkapital – und wie du es erreichst. Erreichte Etappen stehen im Rundenbericht. Im Menü ☰ kannst du sie ausblenden."
einfuehrung.grundstuecke.titel: Standorte und Grundstücke
einfuehrung.grundstuecke.text: "Neue Werke, Kraftwerke und Lager gründest du hier unter „Neuer Standort“. Jeder Standort steht auf einem Grundstück: In der Stadt klein und teuer, aber Arbeitskräfte kommen lieber; am Hafen wird Fracht über See billiger; auf dem Land groß und billig, dafür mit Lieferkosten zu den Kunden. Kaufen bindet Geld, Pachten kostet jeden Monat. Ist ein Grundstück voll, passt keine weitere Anlage darauf – dann gründest du im Land einen weiteren Standort. Neue Grundstücke kommen jedes Jahr hinzu, die guten sind schnell vergeben."
einfuehrung.markt.titel: Markt
einfuehrung.markt.text: "Preise, Nachfrage und Anbieter jedes Landes im Vormonat; „Chancen“ zeigt Märkte mit Mangel, hohen Preisen oder wenigen Anbietern, ein Klick auf ein Produkt seine Anbieter und Käufer. Wer mehr Ware in die Läden bringt, wird öfter gekauft; ein kleiner Neuling mit hohem Preis bleibt auf seiner Ware sitzen. Endprodukte verkauft jede Firma unter eigenem Namen – deinen gibst du dort unter „Dein Produktname“."
einfuehrung.werbung.titel: Marke und Werbung
einfuehrung.werbung.text: "Unter „Marke und Werbung“ steht deine Bekanntheit je Warengruppe neben der bekanntesten Konkurrenz. Ein monatliches Werbebudget macht dich bekannt, Verkäufe an Verbraucher ebenso; ohne beides verblasst die Marke. Industriekunden und Staaten kaufen allein nach dem Preis."
einfuehrung.wettbewerb.titel: Wettbewerb
einfuehrung.wettbewerb.text: "Unter „Firmen“ stehen alle Firmen mit Rang, Umsatz und Standorten; dort kaufst du Wettbewerbern Standorte, ganze Bereiche mit ihrer Marke oder Lizenzen auf Technologien ab. Unter „Angebote“ landen ihre Angebote an dich – annehmen, ablehnen oder mit einem Gegenangebot antworten. Geht eine Firma pleite, werden ihre Standorte einige Wochen lang versteigert: Das höchste Gebot gewinnt und zahlt das zweithöchste."
einfuehrung.forschung.titel: Forschung
einfuehrung.forschung.text: Unter „Produkte erforschen“ siehst du, welche Produkte du schon herstellen darfst, welche du erforschen kannst und was das kostet. Geforscht wird in Forschungszentren mit Laboren – auch vor der historischen Zeit, dann aber teurer.
einfuehrung.weiterentwicklung.titel: Produkte weiterentwickeln
einfuehrung.weiterentwicklung.text: "Was du herstellst, kannst du hier Stufe für Stufe verbessern – auch Rohstoffe und Vorprodukte. Jede Stufe bringt mehr Qualität und spart Arbeit und Vorprodukte; die Karte zeigt, wo deine Wettbewerber stehen und was die nächste Stufe kostet. Ein Forschungszentrum mit Labor arbeitet daran, bis das Produkt ausgereizt ist."
einfuehrung.finanzen.titel: Finanzen
einfuehrung.finanzen.text: "Bilanz, Erfolgsrechnung, Kapitalfluss und Kredite, dazu „Womit verdienst du Geld?“ je Standort und Produkt. Behalte die Kasse im Blick: Ohne Geld kannst du nicht einkaufen, und wer zahlungsunfähig wird, scheidet aus."
einfuehrung.organisation.titel: Organisation
einfuehrung.organisation.text: "Jeder Standort hat eine Leitung und Fachstellen für Produktion, Einkauf, Vertrieb und mehr. Besetzt du sie mit Managern vom Managermarkt, prüfen sie ihren Standort jede Woche und erledigen die Routine selbst – Auslastung, Einkauf, Lieferungen, Verkauf. Was ihr Budget übersteigt, legen sie dir unter „Anliegen“ mit Empfehlung und Frist vor. Sie kosten ein Gehalt und beim Entlassen eine Abfindung; ihre Fähigkeiten siehst du nur als Einschätzung. Was niemand erledigt, entscheidest du. Über allen steht der Vorstand: Ein CEO bespricht mit dir unter „Rücksprache“ regelmäßig Bericht und Anträge nach deinem Strategieauftrag – er ist aber teuer, erst für eine größere Firma. Unter „Hauptsitz und Zentrale“ verlegst du den Firmensitz und richtest Zentralabteilungen ein; sie arbeiten für die ganze Firma, kosten aber jeden Monat – zu früh ruinieren sie dich."
einfuehrung.beteiligungen.titel: Beteiligungen
einfuehrung.beteiligungen.text: "Erfinder und junge Firmen arbeiten an neuen Technologien und verbessern Produkte – in jeder Phase brauchen sie Geld von Investoren, und die meisten scheitern. Wer es schafft, bringt eine Technologie Jahre früher in die Welt: Dann wird Nachforschen für alle günstiger, auch für dich. Mit „Handeln“ steigst du ein: Geld in einer offenen Runde zusagen, Anteile kaufen oder Fördergeld geben. Mit mehr als der Hälfte lenkst du ein Start-up und machst es zur Tochterfirma – gelingt sie, gehört die Technologie dir. Unter „Ausgründen“ wird ein eigenes Forschungsprojekt zum Start-up, das Investoren mitbezahlen. Genaue Chancen schätzt eine Strategieabteilung."
einfuehrung.weltkarte.titel: Weltkarte
einfuehrung.weltkarte.text: "Einwohner, Einkommen, Rohstoffe und Absatzchancen der Länder; ein Klick zeigt ein Land mit seinen Firmen, dort gründest du auch Standorte. Mit „?“ siehst du alle Tastaturkürzel und startest diese Einführung erneut. Viel Erfolg!"

