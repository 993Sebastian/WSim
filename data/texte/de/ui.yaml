werk.erzeugung_tag: "{menge} {einheit} je Tag"
werk.variable_kosten: Ohne Anlage (jedes weitere Stück)
werk.erfahrung: Erfahrung
werk.instandhaltung: Instandhaltung
werk.instandhaltung_erklaerung: "Mehr Instandhaltung kostet mehr Wartung, hält die Anlagen aber länger in gutem Zustand: weniger Ausfälle, mehr Kapazität, bessere Qualität. 100 % entspricht der üblichen Wartung."
werk.instandhaltung_stufe: Stufe
