# Baumwollanbau (erneuerbar). Höchstförderung in t Baumwolle je Jahr.
# Länder in heutigen Grenzen. Alle Werte sind grobe Annäherungen.

# Stufe 1: Baumwolle steht für alle Textilfasern (auch Wolle, Leinen, Seide); die
# Förderung liegt deshalb um die Hälfte über der historischen Baumwollernte (M15).
lagerstaetten:
  - id: baumwollguertel   # Südstaaten
    land: USA
    rohstoff: baumwolle
    erneuerbar: true
    erschliessung: {investition_usd: 25_000_000, dauer_tage: 180}
    foerderung_max_je_jahr: 3_750_000
    annaeherung: true

