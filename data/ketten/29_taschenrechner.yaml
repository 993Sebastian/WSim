# Kette 29 – Taschenrechner (M39, Epoche 1965–1989)
# Mikrochips, Kunststoff, Kupfer, Glas → elektronischer Taschenrechner (erste Taschen-
# geräte 1971/72, mit Flüssigkristallanzeige ab 1973). Der Preis fiel
# von 400 USD (1971) auf unter 20 USD (1980).
# Alle Zahlen sind Annäherungen für etwa 1978.

produkte:
  - id: taschenrechner
    art: endprodukt
    branche: elektro
    einheit: stueck
    gewicht_kg: 0.2
    verwendung: konsum
    warengruppe: elektro
    transportklasse: stueckgut
    richtpreis_usd: 35            # 1975 etwa 25 USD, 1980 unter 20 USD
    nachfrage:
      bedarfsklasse: gebrauchsgut
      gebrauch: {nutzungsdauer_jahre: 7, max_besitzquote: 0.3}
      kaufschwelle: 200
      preisempfindlichkeit: 1.5
      einkommensempfindlichkeit: 1.2
    annaeherung: true

anlagen:
  - id: rechnerwerk               # Bestücken, Löten, Gehäuse (große Werke um 1975: 200 000 je Monat)
    standorttyp: werk
    investition_usd: 30_000_000
    bauzeit_tage: 240
    kapazitaet_je_tag: 5000
    lebensdauer_jahre: 12
    wartung_je_jahr: 0.05
    automatisierung_max: 0.6
    technologie: taschenrechner
    annaeherung: true

rezepte:
  - id: taschenrechner_bauen
    produkt: taschenrechner
    menge: 1
    dauer_tage: 1
    anlage: rechnerwerk
    technologie: taschenrechner
    eingang:
      mikrochip: 2                # Rechenchip und Anzeigetreiber
      polyethylen: 0.00012        # Gehäuse und Tasten
      kupfer: 0.000005            # Leiterplatte
      glas: 0.00001               # Anzeigefenster
    arbeit_stunden:
      angelernt: 0.8
      fachkraft.elektro: 0.12
    energie_mwh: 0.0005
    qualitaet_basis: 55
    annaeherung: true

technologien:
  - id: taschenrechner            # Prototyp 1967, erste Geräte 1971
    fachgebiet: elektro
    erfindungsjahr: 1971
    voraussetzungen: [integrierte_schaltung]
    forschungsaufwand: 15000
    annaeherung: true
