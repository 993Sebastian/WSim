# Lithium-Lagerstätten (M40): Salzseen (Sole, durch Verdunsten angereichert) und Pegmatite
# (Spodumen, Petalit). Vorrat und Förderung in t Lithiumcarbonat-Äquivalent (LCE), Förderung
# etwa nach dem Stand um 2008. Länder in heutigen Grenzen. Alle Werte sind grobe
# Annäherungen.

lagerstaetten:
