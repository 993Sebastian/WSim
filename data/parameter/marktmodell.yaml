# Parameter der Märkte. Formeln: docs/FORMELN.md, Abschnitt M7.

marktmodell:
  # Gewichte bei der Wahl des Anbieters, je Einkommensfünftel (ärmstes zuerst):
  # Untere Schichten achten stärker auf den Preis, obere stärker auf die Qualität.
  preisgewicht: [7.0, 6.0, 5.0, 4.0, 3.0]  # M16: Massenware ist preisempfindlich; doppelter Preis ≈ 1/30 der Kunden
  qualitaetsgewicht: [0.3, 0.5, 0.8, 1.1, 1.5]
  aneignung_je_jahr: 0.25         # Anteil der Lücke zur Ziel-Besitzquote, der je Jahr gekauft wird
  preisanpassung:                 # automatische Preise der Anbieter, je Tag
    # Nacharbeit M16: vorher 0,02 und 0,01 – die Preise schaukelten sich in Wochen auf das
    # Vierfache und zurück (Getreide, Mehl, Nägel im ersten Jahr); die Erzeugung kann so
    # schnell nicht folgen. Jetzt etwa 8 % im Monat hinauf, 4 % hinunter.
    hoch: 0.0025                  # ausverkauft und ein Käufer zahlte mehr
    runter: 0.00125               # Lager reicht länger als „lagertage“
    lagertage: 30
    auslastung_normal: 0.85       # darunter sinkt der Preis auch: freie Anlagen werben um Kunden (M16)
    hoechstfaktor: 4              # nie über dem 4-Fachen des Richtpreises im Land (M15)
    # Ist eine Ware knapp, liegt ihr Preis aber weit unter dem Richtpreis (nach einer
    # Schwemme, z. B. Benzin um 1910), steigt er um „hoch“ · (Richtpreis / Preis), höchstens
    # um das Vielfache „aufholen_max“ (M22). Sonst bräuchte er Jahre, um aufzuholen.
    aufholen_max: 20
  staat_hoechstpreis: 1.5         # Staaten zahlen höchstens das 1,5-Fache des Richtpreises
  # Verläufe und Wettbewerbsmeldungen im Rundenbericht (M24): Monate der Preis- und
  # Absatzreihe je Markt; Preissenkung eines Wettbewerbers seit seinem letzten Höchststand
  # oder der letzten Meldung, ab der der Bericht sie nennt.
  verlauf_monate: 24
  meldung_preissenkung: 0.1
  # Wie weit das Preisniveau eines Landes die Preise der Waren bestimmt (0: Weltpreis, 1: voll),
  # je Produktart (M16). Waren werden gehandelt und kosten überall ähnlich viel; nur der Anteil
  # von Löhnen, Handel und Vertrieb im Land folgt dem Preisniveau (Balassa-Samuelson).
  # Strom kommt aus dem Netz im eigenen Land.
  preisniveau_anteil: {rohstoff: 0.2, halbzeug: 0.1, komponente: 0.1, endprodukt: 0.4, energie: 1}
  index_glaettung: 0.1            # Gewicht des Tagesdurchschnitts im Marktpreis
  # KI-Händler verbinden die Märkte der Länder (Formeln: docs/FORMELN.md, Abschnitt M8).
  haendler:
    marge: 0.05                   # Aufschlag auf Einkauf und Transport
    vorrat_tage: 30               # Lager für so viele Tage offener Nachfrage
    glaettung_tage: 30            # Mittelungszeitraum der offenen Nachfrage
  # Marke und Werbung (Formeln: docs/FORMELN.md, Abschnitt M16). Bekanntheit 0–1 je Firma,
  # Land und Warengruppe.
  marke:
    markengewicht: [0.4, 0.6, 0.9, 1.2, 1.5]  # je Einkommensfünftel, ärmstes zuerst
    vergessen_je_monat: 0.03       # ohne Werbung und Verkäufe verblasst die Marke langsam
    mundpropaganda: 0.08           # Anteil der Lücke je Monat bei 100 % Marktanteil
    kosten_je_einwohner_usd: 0.05  # Werbung, die ein Land einmal erreicht (Preisniveau 1)
    bekanntheit_start: 0.5         # etablierte Firmen, wo sie zum Start verkaufen
    bekanntheit_start_real: 0.7    # historische Firmen (Krupp, Singer …)
    bekanntheit_handel: 0.2        # eingeführte Ware ohne eigene Marke im Land
    bekanntheit_staatsmarkt: 0.3
    werbemittel:                   # es wirkt das beste verfügbare
      - {id: zeitung, ab: 1800, wirkung: 1.0}
      - {id: radio, ab: 1923, wirkung: 1.4}
      - {id: fernsehen, ab: 1950, wirkung: 2.0}
      - {id: internet, ab: 1995, wirkung: 2.6}
