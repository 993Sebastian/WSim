strategie.feldhilfe.preis: "Untergrenze der Preise im Marktpreis-Modus und Startpreis neuer Angebote. Über der Untergrenze bestimmt der Markt den Preis; feste Preise bleiben, wie du sie setzt."
strategie.feldhilfe.lager: "Vorprodukte: Unter der Mindestreichweite bietet der Einkauf mehr, bis zur Höchstreichweite kauft er ein. Fertigwaren: Die Produktion hält so viele Tage Absatz auf Lager."
strategie.feldhilfe.personal: "Spanne des Lohnaufschlags auf den Marktlohn. Fehlen Arbeitskräfte, steigt er Schritt für Schritt bis zum Höchstwert, sonst sinkt er bis zum Mindestwert."
strategie.feldhilfe.eigenfertigung: "Ob sich deine Standorte gegenseitig beliefern oder am Markt kaufen. „Nach Preis“: nur, wenn die eigene Ware samt Fracht nicht teurer ist als der Markt beim Empfänger."
strategie.feldhilfe.investition: "So viel dürfen deine Manager im Kalenderjahr für Orte dieser Ebene höchstens investieren (Bauen, Erschließen, Gründen, Grundstücke, Wiederanfahren). Es gelten alle Budgets der Ebenen darüber zugleich; was nicht hineinpasst, legen sie dir als Anliegen vor."
strategie.feldhilfe.reserve: "Deine Manager investieren nur, solange die Kasse danach über dieser Reserve bleibt – gemessen in Monaten laufender Kosten aller Standorte."
