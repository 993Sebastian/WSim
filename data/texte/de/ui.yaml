beteiligungen.an_firmen_hilfe: "Biete deinen ganzen Anteil ({anteil}, heute {wert} wert) allen Firmen an. Am {datum} kauft das beste Gebot ab deinem Mindestpreis. Firmen bieten bis zu {aufschlag} über dem Wert – je nachdem, wie sie die Chancen sehen und was sie in der Kasse haben. Bietet keine genug, bleibt der Anteil bei dir, und du erfährst das beste Gebot."
