# Vertriebswege (MN3, docs/FORMELN.md): Wege zum Endkunden je Epoche. Ohne eigene Wege
# erreicht eine Firma die Haushalte über den allgemeinen Handel
# (marktmodell.vertrieb.grundreichweite); jeder gewählte Weg erreicht zusätzliche
# Haushalte – je Einkommensfünftel unterschiedlich (schichtfaktor, ärmstes zuerst) – und
# kostet einen Anteil am Erlös sowie Fixkosten je Land (USD Kaufkraft 2026 je Jahr bei
# Preisniveau 1). Warengruppen leer = alle mit Endkundennachfrage.
# Reichweiten und Kosten sind Schätzungen aus Marktanteilen der Handelsformen (Kaufhäuser
# um 1930 rund 10–15 % des Einzelhandels in Großstädten, Versandhandel in ländlichen
# USA bis 1950 stark, Discounter ab 1960, Online-Handel ab 1995 auf über 20 % im Jahr 2026).

vertriebswege:
  - id: handelsvertreter
    verfuegbar_ab: 1800
    warengruppen: []
    reichweite: {1800: 0.15, 1950: 0.1, 2000: 0.05}
    schichtfaktor: [1.2, 1.1, 1.0, 0.9, 0.8]
    fixkosten_je_land_usd: {1800: 20000}
    kosten_je_verkauf: 0.08
    ruf_faktor: 1.0
    annaeherung: true

  - id: kaufhaus
    verfuegbar_ab: 1870
    warengruppen: [bekleidung, textilien, moebel_hausrat, metallwaren, elektro, chemie]
