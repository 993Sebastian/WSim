# Quarz-Lagerstätten (Stückquarz und Quarzit für Silizium). Vorrat praktisch unbegrenzt;
# begrenzend sind Reinheit und billiger Strom. Förderung in t je Jahr.
# Länder in heutigen Grenzen. Alle Werte sind grobe Annäherungen.

lagerstaetten:
  - id: spruce_pine   # North Carolina, hochreiner Pegmatitquarz
    land: USA
    rohstoff: quarz
    vorrat: 100_000_000
    erschliessung: {investition_usd: 20_000_000, dauer_tage: 360}
    foerderung_max_je_jahr: 1_000_000
    annaeherung: true

  - id: tana   # Finnmark, größter Quarzitbruch der Welt
