werk.je_produkt: Je Produkt
werk.rohertrag: Rohertrag
werk.rohertrag_hilfe: Rohertrag = Umsatz − Herstellkosten der verkauften Menge (ohne Anlagen, Gebäude und ungenutzte Arbeitsstunden).
