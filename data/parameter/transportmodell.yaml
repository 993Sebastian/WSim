# Parameter des Frachtdienstes zwischen Ländern (Stufe 1, vereinfacht).
# Formeln: docs/FORMELN.md, Abschnitt M8. Die Verkehrsmittel stehen in verkehrsmittel.yaml.

transportmodell:
  # Weglänge im Verhältnis zur Luftlinie zwischen den Hauptstädten
  umweg:
    land: 1.3
    see: 1.4                      # Mittel über Küstenwege, Kanäle und Kaps
    luft: 1.05
  # Be- oder Entladen in einem Hafen oder Flughafen (bei voll ausgebauter Infrastruktur)
  umschlag:
    kosten_usd_je_t: 5
    tage: 2
  # Unter diesem Ausbaugrad lässt sich ein Verkehrsweg nicht nutzen
  mindestinfrastruktur: 0.05
