[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
# The desktop shell needs the built UI and WebKit; plain `cargo test` covers the core crates.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
wsim-core = { path = "crates/wsim-core" }
wsim-data = { path = "crates/wsim-data" }
wsim-session = { path = "crates/wsim-session" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# The simulation core is optimized in debug and test builds too, so that tests over
# several game years stay fast (IEEE floating point gives the same results).
[profile.dev.package.wsim-core]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
