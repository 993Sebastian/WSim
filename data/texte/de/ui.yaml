werk.lohnaufschlag: Lohnaufschlag
werk.lohnaufschlag_erklaerung: Ein Aufschlag auf die Löhne des Landes macht den Standort zum begehrten Arbeitgeber. Sind Arbeitskräfte knapp, bekommt der Standort mit dem höheren Aufschlag sie zuerst und wirbt sie bei Standorten mit niedrigerem Aufschlag im selben Land ab. Der Aufschlag erhöht die Lohnkosten und damit die Stückkosten.
werk.schulung: Schulung
werk.schulung_erklaerung: Schulung macht die Belegschaft geübter. Je höher das erreichte Niveau, desto weniger Arbeitsstunden braucht der Standort und desto besser werden seine Erzeugnisse. Das Niveau steigt Monat für Monat zum Ziel; ohne Schulung sinkt es langsam, weil Leute gehen. Die Kosten richten sich nach dem Ziel, die Wirkung nach dem erreichten Niveau.
werk.schulung_niveau: Erreichtes Niveau
