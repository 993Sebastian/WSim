# Kette 12 – Automobil (Lastenheft §17.1)
# Motor, Fahrgestell, Karosserie, Reifen → Automobil; Rohöl → Benzin. Erste komplexe
# Kette mit Forschung (Fließband, Ganzstahlkarosserie, thermisches Cracken).
# Verdrängung: Das Automobil ersetzt die Pferdekutsche (Staatsmarkt).
# Alle Zahlen sind Annäherungen für etwa 1900–1915.

produkte:
  - id: benzin
    art: halbzeug
    branche: chemie
    einheit: t
    verwendung: beides
    warengruppe: mineraloel
    transportklasse: fluessig
    richtpreis_usd: 900
    heizwert_mwh: 12.2
    nachfrage:                    # Verbrauch je Auto (um 1910 rund 15 l je 100 km)
      bedarfsklasse: grundbedarf
      ergaenzung: {zu: automobil, je_besitz_und_jahr: 1.2}
      kaufschwelle: 0.05
      preisempfindlichkeit: 0.3
      einkommensempfindlichkeit: 0.2
    # Übrige Verwendung (M22): Lösungsmittel, Gaskocher und Gasmaschinen, Stationär- und
    # Bootsmotoren, Heer und Marine. Um 1900 verbrauchten sie den größten Teil des Benzins
    # (USA 1899 rund 0,8 Mio. t); ohne sie fand das Benzin der Raffinerien keine Käufer.
    staatsnachfrage:
      je_mio_usd_bip: 0.15
      kriegsfaktor: 2.0
    annaeherung: true

  - id: motor
    art: komponente
    branche: fahrzeuge
    einheit: stueck               # Vierzylinder-Ottomotor
    gewicht_kg: 200
    verwendung: industrie
    warengruppe: fahrzeuge
    transportklasse: stueckgut
    richtpreis_usd: 3000

  - id: fahrgestell
    art: komponente
    branche: fahrzeuge
    einheit: stueck
    gewicht_kg: 400
    verwendung: industrie
    warengruppe: fahrzeuge
    transportklasse: stueckgut
    richtpreis_usd: 3000

  - id: karosserie
    art: komponente
    branche: fahrzeuge
    einheit: stueck
    gewicht_kg: 250
    verwendung: industrie
    warengruppe: fahrzeuge
    transportklasse: stueckgut
    richtpreis_usd: 2500

  - id: automobil
    art: endprodukt
    branche: fahrzeuge
    einheit: stueck
    gewicht_kg: 1000
    verwendung: konsum
    warengruppe: fahrzeuge
    transportklasse: stueckgut
    richtpreis_usd: 30_000        # Ford Modell T 1909: 850 USD
    nachfrage:
      bedarfsklasse: luxus
      gebrauch: {nutzungsdauer_jahre: 10, max_besitzquote: 0.3}
      kaufschwelle: 80            # zum Richtpreis kauft fast niemand; erst billige Autos
      preisempfindlichkeit: 4     # schaffen den Massenmarkt (Ford Modell T)
      einkommensempfindlichkeit: 1.5
    staatsnachfrage:              # Post, Heer, Verwaltung
      je_mio_usd_bip: 0.005
      kriegsfaktor: 10
    ersetzt: [pferdekutsche]
    annaeherung: true

  - id: pferdekutsche
    art: endprodukt
    branche: fahrzeuge
    einheit: stueck
    gewicht_kg: 500
    verwendung: konsum
    warengruppe: fahrzeuge
    transportklasse: stueckgut
    richtpreis_usd: 8000
    staatsmarkt:
      preis_usd: 8000
    nachfrage:
      bedarfsklasse: luxus
      gebrauch: {nutzungsdauer_jahre: 15, max_besitzquote: 0.03}
      kaufschwelle: 2.5           # die Hälfte kauft ab etwa 20 000 USD Einkommen
      preisempfindlichkeit: 1.2
      einkommensempfindlichkeit: 1.5
    annaeherung: true

anlagen:
