# Strategieauftrag und Strategierücksprache (MA5)
auftrag.titel: Strategieauftrag an den Vorstand
auftrag.erklaerung: "Die Leitlinie gibt den Regeln, nach denen alle Stellen der Firma entscheiden, ihre Aggressivität – wie bei den KI-Firmen: Preisuntergrenze, Schwellen für den Ausbau, Werbung und Gebote. Die Ziele misst der CEO bei jeder Rücksprache. Die Grenzen gelten für alle Stellen: Über die Verschuldungsgrenze hinaus nimmt niemand Kredite auf, in gesperrten Ländern und Warengruppen gründet, baut und bietet niemand. Investitionsbudget und Liquiditätsreserve legst du im Reiter „Strategie“ fest."
auftrag.hilfe: Was soll der Vorstand anstreben? Der Auftrag gilt ab sofort für alle Stellen deiner Firma.
