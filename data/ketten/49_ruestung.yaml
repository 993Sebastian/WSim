rezepte:
  - id: munition_salpeter
    produkt: munition
    menge: 1
    dauer_tage: 1
    anlage: munitionsfabrik
    eingang:
      stahl: 0.8
      kupfer: 0.03                # Führungsbänder
      chilesalpeter: 0.6          # Schwarzpulver und Nitrosprengstoffe
    arbeit_stunden:
      angelernt: 60
      fachkraft.metall: 15
      fachkraft.chemie: 5
    qualitaet_basis: 50
    annaeherung: true

  - id: munition_ammoniak
    produkt: munition
    menge: 1
    dauer_tage: 1
    anlage: munitionsfabrik
    technologie: haber_bosch
    eingang:
      stahl: 0.8
      kupfer: 0.03
      ammoniak: 0.25              # Salpetersäure aus Ammoniak (Ostwald)
    arbeit_stunden:
      angelernt: 60
      fachkraft.metall: 15
      fachkraft.chemie: 5
    qualitaet_basis: 55
    annaeherung: true

  - id: gewehr_bauen
    produkt: gewehr
    menge: 1
    dauer_tage: 1
    anlage: gewehrfabrik
    eingang:
      stabstahl: 0.005
      schnittholz: 0.003
    arbeit_stunden:
      angelernt: 12
      fachkraft.metall: 8
    qualitaet_basis: 55
    annaeherung: true

  - id: geschuetz_bauen
    produkt: geschuetz
    menge: 1
    dauer_tage: 5
    anlage: geschuetzwerk
    eingang:
      stahl: 1.8
      stabstahl: 0.4
    arbeit_stunden:
      angelernt: 1500
      fachkraft.maschinenbau: 1500
      akademiker.maschinenbau: 30
    qualitaet_basis: 55
    annaeherung: true

  - id: panzer_bauen
    produkt: panzer
    menge: 1
    dauer_tage: 20
    anlage: panzerwerk
    technologie: panzer
    eingang:
      stahl: 22
      motor: 1
      kupferdraht: 0.05
    arbeit_stunden:
      angelernt: 8000
      fachkraft.maschinenbau: 8000
      akademiker.maschinenbau: 200
    qualitaet_basis: 55
    annaeherung: true

  - id: jagdflugzeug_bauen
    produkt: jagdflugzeug
    menge: 1
    dauer_tage: 20
    anlage: militaerflugzeugwerk
    technologie: jagdflugzeug
    eingang:
      flugmotor: 1
      aluminium: 1.2
      stahl: 0.4
    arbeit_stunden:
      angelernt: 4000
      fachkraft.maschinenbau: 6000
      akademiker.maschinenbau: 200
    qualitaet_basis: 55
    annaeherung: true

  - id: kampfjet_bauen
    produkt: kampfjet
    menge: 1
    dauer_tage: 60
    anlage: kampfjetwerk
    technologie: duesenjaeger
    eingang:
      strahltriebwerk: 1
      aluminium: 5
      stahl: 1
    arbeit_stunden:
      angelernt: 40_000
      fachkraft.maschinenbau: 60_000
      akademiker.maschinenbau: 5000
    qualitaet_basis: 55
    annaeherung: true

  - id: lenkwaffe_bauen
    produkt: lenkwaffe
    menge: 1
    dauer_tage: 5
    anlage: lenkwaffenwerk
    technologie: lenkflugkoerper
    eingang:
      aluminium: 0.04
      transistor: 200
      ammoniak: 0.01
      stahl: 0.02
    arbeit_stunden:
