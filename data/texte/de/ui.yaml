beteiligungen.gesperrt: Eine andere Firma hält eine Sperrminorität – eingliedern kannst du nicht.
beteiligungen.ausgruenden: Ausgründen
beteiligungen.ausgruenden_einleitung: "Ein eigenes Forschungsprojekt, das an einer noch nicht erfundenen Technologie oder an einer Stufe arbeitet, die noch keine Firma hat, kannst du als Start-up ausgründen. Es beginnt in der Phase, die zu seinem Fortschritt passt, Investoren zahlen ihren Teil der weiteren Runden, und das Forschungszentrum ist frei für Neues. Behältst du mehr als {mehr}, bleibt es deine Tochterfirma: Du zahlst deinen Anteil jeder Runde, und gelingt sie, gehört dir die Technologie. Möglich ab {min} Fortschritt."
beteiligungen.keine_projekte: Keines deiner Forschungszentren arbeitet an einem Projekt. Ein Forschungszentrum baust du unter Standorte, das Projekt wählst du in der Forschung.
