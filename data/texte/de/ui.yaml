werk.ausfaelle_jahr: Erwartete Ausfälle je Jahr
werk.ausschuss: Ausschuss
werk.ausschuss_hilfe: Anteil der Erzeugung, der nicht verkauft werden kann; die Kosten bleiben. Schulung, Instandhaltung, Erfahrung und Automatisierung senken ihn.
werk.unfaelle: Arbeitsunfälle
werk.unfaelle_hilfe: Unfälle kosten Lohnfortzahlung und Entschädigung und legen eine Anlage für einen Tag still. Schulung und gut gewartete Anlagen senken das Risiko.
werk.unfaelle_wert: "{anzahl} in diesem Jahr ({rate} je 100 000 Arbeitsstunden)"
werk.ausfall_bis: Ausfall bis
werk.ueberholung_bis: Großüberholung bis
werk.ueberholen: "Großüberholung ({kosten})"
werk.ueberholt: "{anlage} wird überholt."
werk.erfahrung_wert: "{faktor} der Arbeitsstunden, spart {betrag}"
werk.erfahrung_hinweis: Je öfter ein Standort ein Produkt gemacht hat, desto weniger Arbeitsstunden braucht ein Durchlauf (Lernkurve). Ohne Produktion geht Erfahrung langsam verloren, ebenso bei großen Entlassungen.

ursache.vorprodukt: "Vorprodukt fehlt: {detail}"
ursache.vorprodukt.hilfe: Das Lager reicht nicht für die geplante Menge. Einkauf erhöhen oder eigene Herstellung ausbauen.
ursache.arbeitskraefte: "Zu wenig {detail}"
ursache.arbeitskraefte.hilfe: Im Land sind nicht genug Arbeitskräfte dieser Gruppe frei. Ein höherer Lohnaufschlag (Bereich Personal) wirbt sie bei anderen ab; sonst Auslastung senken oder in einem anderen Land produzieren.
ursache.strom: Zu wenig Strom
ursache.strom.hilfe: Das Stromnetz liefert nicht genug. Ein eigenes Kraftwerk am Standort hilft.
ursache.ereignis: Gedrosselt durch ein Weltereignis
ursache.regulierung: Gestoppt durch eine Regulierung
ursache.patent: Gestoppt durch ein Patent
ursache.ausfall: Ausfall
ursache.ausfall.hilfe: Die Anlage ist ausgefallen und wird repariert. Abgenutzte Anlagen fallen öfter aus; mehr Instandhaltung oder eine Großüberholung helfen.
ursache.ueberholung: Großüberholung
ursache.ueberholung.hilfe: Die Anlage wird überholt und läuft danach wie neu.
ursache.lager_voll: Lager voll
ursache.lager_voll.hilfe: Das Lager des Standorts ist voll; die Anlagen stehen, Einkaufsaufträge kaufen nicht. Verkaufe mehr, liefere Ware an andere Standorte oder baue das Lager aus (Reiter Lager).
ursache.patent.hilfe: Eine andere Firma hat die Technologie der Anlage oder des Verfahrens in diesem Land patentiert. Mit einer Lizenz des Inhabers (Wettbewerb → Lizenzen) läuft sie weiter; die Forschungsansicht zeigt, bis wann das Patent gilt.
ursache.regulierung.hilfe: Ein Verbot im Land oder eine Umweltauflage, für die die Einheit noch nicht nachgerüstet ist. Was gilt, zeigt die Länderansicht.
ursache.ereignis.hilfe: Krieg, Bürgerkrieg oder eine Förderkürzung begrenzen die Produktion in diesem Land. Was wie lange gilt, zeigt die Länderansicht.
ursache.lagerstaette: Höchstförderung erreicht
ursache.lagerstaette.hilfe: "Die Konzession erlaubt im Jahr nur eine bestimmte Menge, verteilt über das Jahr: Bis heute ist der bisherige Anteil gefördert. Oder der Vorrat der Lagerstätte ist erschöpft."
ursache.im_bau: im Bau
ursache.im_bau.hilfe: Die Anlage arbeitet ab dem Fertigstellungstag.
ursache.kein_rezept: kein Rezept gewählt
ursache.kein_rezept.hilfe: Ohne Rezept steht die Anlage still.
ursache.ruht: Auslastung 0 %
ursache.erschliessung: Lagerstätte in Erschließung
ursache.erschliessung.hilfe: Die Förderung beginnt, sobald die Lagerstätte erschlossen ist.
ursache.ruht.hilfe: Die geplante Auslastung ist 0 %. Die Anlage kostet weiter volle Wartung; stilllegen spart einen Teil davon.
ursache.stillgelegt: stillgelegt
ursache.stillgelegt.hilfe: Keine Erzeugung, kein Personal, kein Verschleiß und weniger Wartung. „Wieder anfahren“ macht die Anlage wieder einsatzbereit.
ursache.wiederanlauf: fährt wieder an
ursache.wiederanlauf.hilfe: Die Anlage wird wieder angefahren und produziert ab dem angegebenen Tag.

