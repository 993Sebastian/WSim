forschung.bereiche: Bereiche der Forschung
forschung.entwicklung: Weiterentwicklung
forschung.entwicklung_erklaerung: "Für jedes Produkt, das du herstellen darfst, sammelst du in Forschungszentren Punkte auf zwei Skalen: Weiterentwicklung (Qualität, Arbeit) und Fertigungsforschung (mehr Ausstoß, weniger Vorprodukte) – Rohstoffe und Vorprodukte ebenso wie Endprodukte. Wer die meisten Punkte hat, steht bei 100 %, alle anderen im Verhältnis ihrer Punkte darunter. Das Niveau bringt in allen deinen Rezepten für das Produkt bis zu {wirkung} (beim Führenden und voll ausgereiftem Produkt). Die Qualität deiner Vorprodukte zählt dazu. Es gibt kein Ende: Ein Vorsprung hält, solange du weiter forschst; Wissen geht nicht von selbst auf andere über."
