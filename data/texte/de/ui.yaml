# Grundstücke (M35)
grundstueck.titel: Grundstück
grundstueck.waehlen: Grundstück wählen
grundstueck.hinweis: "Jeder Standort außer einer Förderstätte steht auf einem Grundstück. Im Land sind {frei} von {gesamt} Gewerbefläche frei; Bodenpreis je ha: {preise}."
grundstueck.lagen_titel: Was bedeuten Lage, Kauf und Pacht?
grundstueck.lage_stadt: Kleine, teure Grundstücke; Arbeitskräfte kommen lieber – das wirkt wie ein Lohnaufschlag.
grundstueck.lage_hafen: Mittelgroße Grundstücke an der Küste; Fracht über See wird billiger.
grundstueck.lage_land: Große, billige Grundstücke; dafür Lieferkosten zu den Kunden im Land, und Arbeitskräfte kommen ungern.
grundstueck.kauf_pacht: "Kaufen bindet Geld, aber das Grundstück gehört dir und steht in der Bilanz. Pachten kostet vorab nichts, dafür jeden Monat Pacht; kaufen kannst du später in der Werksansicht. Ist ein Grundstück voll, passt keine weitere Anlage darauf – dann gründest du einen weiteren Standort."
grundstueck.keins_frei: Im Land ist gerade kein Grundstück frei. Neue kommen jedes Jahr am 1. Januar hinzu, wenn die Wirtschaft wächst – oder gründe in einem anderen Land.
