markt.anbieterwahl_einleitung: Jede Einkommensgruppe wägt die folgenden Punkte unterschiedlich stark ab; wer mehr Anziehung hat, bekommt mehr Käufer.
erklaerung.faktor.preis: Preis
erklaerung.faktor.preis.text: Der Preis im Verhältnis zum üblichen Preis im Land; ärmere Gruppen achten stärker darauf.
erklaerung.faktor.qualitaet: Qualität
erklaerung.faktor.qualitaet.text: Die Qualität der Ware; wohlhabendere Gruppen achten stärker darauf.
erklaerung.faktor.marke: Marke
erklaerung.faktor.marke.text: Die Bekanntheit der Firma in der Warengruppe; sie wächst mit Werbung und Absatz.
erklaerung.faktor.praesenz: Präsenz
