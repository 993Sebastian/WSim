# Währungen der Länder (Lastenheft §3.6, §18.2; M21). Formatbeschreibung:
# docs/DATENFORMAT.md. Länder gelten in heutigen Grenzen (wie alle Länderdaten).
#
# Jeder Zeitraum gilt ab dem ersten Tag des Jahres bzw. Monats bis zum nächsten.
# Vor einer eigenen Landeswährung gilt die Währung der Kolonial- oder Vormacht;
# Annahmen stehen als Kommentar am Land.
#
# „umrechnung“ (M28): gesetzlicher Umstellungskurs, Einheiten der bisherigen Währung
# je Einheit der neuen (Euro: amtliche Kurse vom 31.12.1998 bzw. vom Beitritt). Ohne
# ihn nennt die Meldung zur Währungsumstellung das Verhältnis der Wechselkurse.
landeswaehrungen:
  - land: ARG  # Argentinien
    perioden:
      - {ab: 1900, waehrung: peso_moneda_nacional}
      - {ab: 1970, waehrung: peso_ley, umrechnung: 100}
      - {ab: "1983-06", waehrung: peso_argentino, umrechnung: 10000}
      - {ab: "1985-06", waehrung: austral, umrechnung: 1000}
      - {ab: 1992, waehrung: peso_argentinien, umrechnung: 10000}
  - land: AUS  # Australien
    perioden:
      - {ab: 1900, waehrung: pfund_sterling}
      - {ab: 1910, waehrung: pfund_australien}
      - {ab: "1966-02", waehrung: australischer_dollar, umrechnung: 0.5}
  - land: BGD  # Bangladesch
    perioden:
      - {ab: 1900, waehrung: rupie_indien}
      - {ab: 1948, waehrung: rupie_pakistan}
      - {ab: 1972, waehrung: taka, umrechnung: 1}
  - land: BRA  # Brasilien – Cruzado novo 1989 und Cruzeiro real 1993 zusammengefasst
