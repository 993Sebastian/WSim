name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kern:
    name: Simulationskern (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Spieldaten prüfen
        run: cargo run -p wsim-cli -- validate data

  oberflaeche:
    name: Oberfläche (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui typecheck
      - run: pnpm -C ui lint
      - run: pnpm -C ui test
      - run: pnpm -C ui exec playwright install --with-deps chromium
      - run: pnpm -C ui e2e

  browser:
    name: Browser-Version (WebAssembly)
    runs-on: ubuntu-latest
    # Vorerst zurückgestellt (Wunsch vom 06.10.2026): ein Fehler hier hält die CI nicht auf.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy -p wsim-web --target wasm32-unknown-unknown -- -D warnings
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui build:web
      - name: Browser und Desktop rechnen dasselbe Spiel
        run: |
          nativ=$(cargo run -q -p wsim-web --example zustand --release)
          web=$(node ui/scripts/wasm-pruefen.mjs)
          echo "nativ $nativ, Browser $web"
          test "$nativ" = "$web"
      - run: pnpm -C ui exec playwright install --with-deps chromium
      - run: pnpm -C ui e2e:web
      # Published from the work branch to the branch gh-pages, which GitHub Pages serves.
      - name: Veröffentlichen (GitHub Pages)
        if: github.ref == 'refs/heads/claude/architektur-vorschlag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui/dist-web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Browser-Version"

  windows:
    name: Windows-Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C ui build
      - run: cargo clippy -p wsim-app --all-targets -- -D warnings
      - run: pnpm -C app tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: wsim-installer-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
