beteiligungen.zusagen: In der Runde zusagen
beteiligungen.zusagen_hilfe: "Das Geld geht sofort aus der Kasse. Ist die Runde gedeckt, beginnt die Phase und du erhältst Anteile im Verhältnis deines Betrags. Kommt die Runde nicht zustande, bekommst du es zurück."
beteiligungen.zusagen_knopf: Zusagen
beteiligungen.aufstocken: Anteile kaufen
