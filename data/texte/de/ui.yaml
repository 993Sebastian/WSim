werk.fehlt_keine_frei: "Es fehlen {anzahl} {gruppe}, und im Land ist niemand mehr frei. Mit einem höheren Lohnaufschlag als andere Standorte im Land (höchster der Konkurrenz: {aufschlag}) wirbst du sie ab."
