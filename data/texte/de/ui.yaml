beteiligungen.aus: In dieser Partie entstehen keine neuen Start-ups (Einstellung beim neuen Spiel).
beteiligungen.schaetzung_grob: Die Erfolgschance siehst du nur grob (gering, mittel, hoch). Eine Strategieabteilung (Organisation) schätzt sie genauer.
beteiligungen.schaetzung_genau: Die Erfolgschancen schätzt deine Strategieabteilung – je besser sie besetzt ist, desto genauer.
