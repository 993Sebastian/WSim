# Parameter der Forschung (Lastenheft §7.1). Formeln: docs/FORMELN.md, Abschnitt M9.
# Forschungspunkte: 1 Punkt = 1 Forschertag bei Forschungseffizienz 1.

forschungsmodell:
  # Kosten × 1,25 je Jahr vor dem historischen Erfindungsjahr: 10 Jahre ≈ × 9,
  # 30 Jahre ≈ × 800, 50 Jahre ≈ × 70 000 – extreme Vorgriffe führen in die Pleite.
  vorgriff_faktor: 1.25
  # Nach der Erfindung (historisch oder im Spiel) wird es für Nachzügler billiger.
  nachzuegler:
    rabatt_je_jahr: 0.1
    minimum: 0.2
  # So viele Jahre nach dem historischen Erfindungsjahr kennt jede Firma die Technologie
  # (Wissen hat sich verbreitet); ein Patent kann die Nutzung länger sperren.
  gemeingut_nach_jahren: 25
  # Patente (P7, docs/FORMELN.md): Wer eine Technologie als erste Firma erforscht, darf sie
  # binnen der Frist je Land anmelden; dort braucht jede andere Firma eine Lizenz.
  patente:
    laufzeit_jahre: 20              # übliche Laufzeit seit den 1990er Jahren (TRIPS)
    anmeldefrist_tage: 365          # Prioritätsjahr (Pariser Verbandsübereinkunft)
    # Anmeldung, Anwalt und Jahresgebühren über die ganze Laufzeit je Land, USD bei
    # Preisniveau 1 (Europa und USA heute grob 20 000–60 000 USD)
    kosten_je_land_usd: 30_000
    # KI-Firmen melden in ihren Standortländern und in so vielen größten Märkten an.
    ki_groesste_maerkte: 5
    annaeherung: true
  # Personal im Labor (PD1, docs/PRODUKTENTWICKLUNG.md §1): Der Spieler stellt je Rolle ein; die
  # Arbeitsplätze begrenzt die Laborgröße. „forschung“ ist das Gewicht einer Person in der
  # Forschung bis zu den Entwicklungsprojekten (PD2); Rollen ohne Gewicht kosten Lohn, forschen
  # aber noch nicht. Die Projektleiter kommen mit den Projekten (PD2).
  labor:
    rollen:
      - {id: entwickler, forschung: 1}
      - {id: laborpersonal, forschung: 0.5}
      - {id: produktmanager, forschung: 0}
      - {id: fertigungsplaner, forschung: 0}
  # Entwicklungsprojekte PM0–PM7 (PD2, docs/PRODUKTENTWICKLUNG.md §2–§3, Formeln FORMELN.md PD2). Alle
  # Werte vorläufig (OFFENE_PUNKTE PD). Der Projektumfang W stammt aus den Forschungspunkten der
  # fehlenden Technologien; Kosten = W · punktekosten_usd, Dauer = W / referenzrate Tage.
  projekte:
    punktekosten_usd: 120          # Lohn + Sachkosten je Forschungspunkt (Näherung)
    referenzrate: 20               # Punkte je Tag bei Referenzbesetzung
    referenzaufwand: 10000         # W, für das der Bedarf je Rolle unten gilt
    bedarf_exponent: 0.5           # Bedarf wächst mit (W / referenzaufwand)^exponent
    ueberbesetzung: {maximum: 0.30, tau: 0.5}   # höchstens 30 % schneller, abnehmender Ertrag
    restanteil: 0.1                # Tempo einer Phase ohne jede Person in einer Rolle
    unterbesetzung: {abschlag: 0.5, hoechstens: 0.25}   # Abschlag auf die Kennzahlen der Rolle
    streuung: 0.10                 # Endkennzahlen bei PM6 um höchstens ±10 %
    gate_kosten: 0.05              # Gate PM3→PM4: Vorbereitung der Freigabe, ohne Dauer (Annahme: Rest auf 100 %)
    # Phasen zwischen den Meilensteinen (PM3→PM4 ist das Gate). Je Rolle: Bedarf (Personen bei
    # referenzaufwand) und Wirkung (Anteil am Tempo der Phase; Summe 1).
    phasen:
      - id: pm0_pm1
        kosten: 0.05
        dauer: 0.10
        rollen:
          - {id: produktmanager, bedarf: 3, wirkung: 0.60}
          - {id: entwickler, bedarf: 1, wirkung: 0.30}
          - {id: fertigungsplaner, bedarf: 0.5, wirkung: 0.05}
          - {id: laborpersonal, bedarf: 0.5, wirkung: 0.05}
      - id: pm1_pm2
        kosten: 0.10
        dauer: 0.10
        rollen:
          - {id: produktmanager, bedarf: 3, wirkung: 0.50}
          - {id: entwickler, bedarf: 2, wirkung: 0.40}
          - {id: fertigungsplaner, bedarf: 0.5, wirkung: 0.05}
          - {id: laborpersonal, bedarf: 0.5, wirkung: 0.05}
      - id: pm2_pm3
        kosten: 0.10
        dauer: 0.10
        rollen:
          - {id: produktmanager, bedarf: 1, wirkung: 0.10}
          - {id: entwickler, bedarf: 6, wirkung: 0.60}
          - {id: fertigungsplaner, bedarf: 1, wirkung: 0.10}
          - {id: laborpersonal, bedarf: 3, wirkung: 0.20}
      - id: pm4_pm5
        kosten: 0.30
        dauer: 0.30
        rollen:
          - {id: produktmanager, bedarf: 1, wirkung: 0.05}
          - {id: entwickler, bedarf: 8, wirkung: 0.60}
          - {id: fertigungsplaner, bedarf: 2, wirkung: 0.20}
          - {id: laborpersonal, bedarf: 2, wirkung: 0.15}
      - id: pm5_pm6
        kosten: 0.25
        dauer: 0.25
        rollen:
          - {id: produktmanager, bedarf: 1, wirkung: 0.05}
          - {id: entwickler, bedarf: 6, wirkung: 0.45}
          - {id: fertigungsplaner, bedarf: 4, wirkung: 0.30}
          - {id: laborpersonal, bedarf: 4, wirkung: 0.20}
      - id: pm6_pm7
        kosten: 0.15
        dauer: 0.15
        rollen:
          - {id: produktmanager, bedarf: 3, wirkung: 0.40}
          - {id: entwickler, bedarf: 1, wirkung: 0.05}
          - {id: fertigungsplaner, bedarf: 4, wirkung: 0.40}
          - {id: laborpersonal, bedarf: 2, wirkung: 0.15}
    # Tempo (PM0): Faktoren auf Dauer, Kosten und Basisrisiko.
    tempo:
      - {id: gruendlich, dauer: 1.25, kosten: 1.10, risiko: 0.70}
      - {id: normal, dauer: 1.00, kosten: 1.00, risiko: 1.00}
      - {id: beschleunigt, dauer: 0.80, kosten: 1.15, risiko: 1.50}
    # Zielausstattung (PM0): Faktor auf die Kosten und Änderung der Zielqualität.
    ausstattung:
      - {id: basis, kosten: 0.80, qualitaet: -0.10}
      - {id: standard, kosten: 1.00, qualitaet: 0.0}
      - {id: premium, kosten: 1.35, qualitaet: 0.10}
    projektleiter:
      gehalt_usd_jahr: 90_000      # Preisniveau 1
      kapazitaet_neu: 1            # eine Neuentwicklung ...
      kapazitaet_weiter: 2         # ... oder bis zu zwei Weiterentwicklungen
      kandidaten: 6                # auf dem Markt je Labor-Land
      alter_min: 32
      alter_max: 58
      charaktere: [optimistisch, vorsichtig, sachlich]
    # Risiko je Phase (Zähler; die Ereignisse folgen mit PD4).
    risiko:
      basis: 0.02
      unterbesetzung: 1.5
      erfahrung: 0.4
      branche: 0.3
      puffer: 0.5
      fast_track: 1.0
  # Qualifikation der Forscher; die Fachrichtung ist das Fachgebiet der Technologie.
  forscher: akademiker
  # Geräte und Material je Forscher und Tag (USD bei Preisniveau 1)
  sachkosten_usd_je_forschertag: 40

  # Weiterentwicklung erforschter Produkte (M37, docs/FORMELN.md): Jede Firma kann jedes
  # Produkt, das sie herstellen darf, Stufe für Stufe verbessern.
  weiterentwicklung:
    # Generationen (Q1): Punkteschwellen für Nachfolgemodelle und Start-ups; die Forschung
    # geht darüber hinaus weiter, die Wirkung folgt allein dem Niveau.
    stufen: 5
    # Wirkung beim Führenden (Niveau 100 %) in allen Rezepten der Firma für das Produkt
    # (Q1): Qualitätspunkte · Niveau, eingesparter Anteil der Arbeitsstunden und der
    # Vorprodukte je Durchlauf · Niveau · Reife.
    # Die Vorprodukte spart seit Q6 die Fertigungsforschung (fertigung).
    wirkung_max: {qualitaet: 30, arbeit: 0.2, vorprodukte: 0}
    # Fertigungsforschung (Q6, Wunsch vom 11.10.2026): beim Führenden mehr Ausstoß je
    # Durchlauf und weniger Vorprodukte, je · Niveau · Reife.
    fertigung: {ausstoss: 0.25, vorprodukte: 0.15}
    # Generation n kostet B · anteil · wachstum^(n − 1) Forschungspunkte; B ist der größte
    # Forschungsaufwand der Technologien des Produkts, mindestens grundaufwand. B ist auch
    # das Maß der Reife: S = 1 − e^(−Punkte des Führenden / B).
    aufwand:
      anteil: 1.0
      wachstum: 1.7
      grundaufwand: 10_000
      # Produktindividueller Aufwand (Wunsch vom 12.10.2026): grundaufwand · (faktor_min +
      # Zuschlag je Stufe der Vorproduktkette + Zuschlag je verschiedenem Bauteil darin),
      # höchstens faktor_max. Gilt, wo die Technologien des Produkts keinen größeren
      # Forschungsaufwand haben.
      komplexitaet:
        faktor_min: 0.3
        zuschlag_je_stufe: 1.0
        zuschlag_je_bauteil: 0.4
        faktor_max: 40
    # Fachgebiet der Forscher für Produkte ohne Technologie (Ernte, einfacher Abbau),
    # nach Branche; sonst gilt das Fachgebiet der Technologie.
    fachgebiete:
      bergbau: bergbau
      metallurgie: metall
      chemie: chemie
      energie: elektro
      holz_papier: holz_bau
      textil: textil
      lebensmittel: lebensmittel
      bau: holz_bau
      maschinenbau: maschinenbau
      fahrzeuge: maschinenbau
      schiffbau: maschinenbau
      luftfahrt: maschinenbau
      raumfahrt: maschinenbau
      elektro: elektro
      konsumgueter: metall
      pharma: chemie
      ruestung: maschinenbau
