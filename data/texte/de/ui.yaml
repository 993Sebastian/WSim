zentrale.abteilungen: Zentralabteilungen
zentrale.abteilungen_hilfe: "Zentralabteilungen arbeiten für die ganze Firma: Strategie sucht Übernahmeziele auch in Ländern ohne eigenen Standort, Finanzen senkt den Risikoaufschlag neuer Kredite, Personal schult die Manager, Recht prüft Lizenzen für Technologien deiner Warengruppen, Marketing verstärkt die Werbung. Eine Abteilung arbeitet nur mit Leitung – dem Vorstandsmitglied ihres Ressorts – und Angestellten. Die Angestellten sind Akademiker im Land des Hauptsitzes; sie kosten Lohn und Büro jeden Monat, ob die Abteilung arbeitet oder nicht. Zu früh aufgebaut ruinieren sie eine kleine Firma."
zentrale.abteilungen_genauigkeit: "Je mehr der anfallenden Fälle die Angestellten bearbeiten (Abdeckung), desto genauer schätzt die Leitung in ihrem Ressort und desto seltener irrt sie sich bei Empfehlungen."
