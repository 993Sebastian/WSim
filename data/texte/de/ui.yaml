beteiligungen.erklaerung: "Hier legst du fest, wie viel die Firma im Jahr für Übernahmen und Lizenzen ausgeben darf, die der Vorstand anbietet, und bis zu welchem Betrag die Leitung jeder Zentralabteilung allein entscheidet. Was darüber liegt, legt sie dir als Anliegen vor. Die Risikobereitschaft gilt später für Start-ups."
