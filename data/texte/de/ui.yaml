beteiligungen.projekt_stand: "Forschungszentrum in {land}, {fortschritt} fertig"
beteiligungen.start_als: "Beginnt als {phase} mit einem Wert von {wert}; verkauftest du alles, erhieltest du {alles}."
beteiligungen.dauer: "Die Phasen dauern noch rund {monate} Monate, dazu die Suche nach Geld."
beteiligungen.dauer_vorlauf: "Die Phasen dauern noch rund {monate} Monate, dazu die Suche nach Geld; erfunden wird die Technologie sonst in {jahre} Jahren."
beteiligungen.zu_spaet: "Achtung: Die Technologie dürfte erfunden sein, bevor das Start-up fertig ist – dann ist es überholt und geht ein."
beteiligungen.rivalen: "Achtung: {anzahl} andere Firmen forschen am selben Ziel – wer zuerst fertig ist, überholt das Start-up."
