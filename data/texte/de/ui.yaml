markt.nachfrage_hilfe: Nachfrage je Monat zu heutigen Preisen und Einkommen; die Verbraucher nach Einkommensfünfteln, vom ärmsten zum reichsten. Firmen und Ausfuhr wie im Vormonat – die Verkäufe der Anbieter oben enthalten auch, was Händler für die Ausfuhr gekauft haben.
