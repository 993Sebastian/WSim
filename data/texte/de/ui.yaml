werk.schulung_gesetzt: "Schulungsziel {prozent} % gesetzt."
werk.schulung_vorgabe: Ziel der Strategie folgen
werk.schulung_vorgabe_gesetzt: Der Standort folgt jetzt dem Schulungsziel der Strategie.
