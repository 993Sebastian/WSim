# KI-Firmen (Lastenheft §10, §15). Formeln: docs/FORMELN.md, Abschnitt M10.
# Kompetenz und Aggressivität liegen zwischen 0 und 1; Werte mit bei_0/bei_1 hängen
# linear davon ab.

kimodell:
  firmen_standard: 100
  firmen_max: 10_000
  # Mit so vielen KI-Firmen arbeiten die Märkte in realer Größe. Bei weniger Firmen
  # schrumpfen Bevölkerung, Staatsnachfrage, Arbeitskräfte und Lagerstätten im selben
  # Verhältnis (Marktmaßstab); Preise, Löhne und Anlagengrößen bleiben real.
  firmen_bei_realer_groesse: 1000
  massstab: {minimum: 0.01, maximum: 1}
  # Kein Arbeitsmarkt schrumpft unter so viele Personen je Gruppe.
  arbeitskraefte_min: 2000
  # Eine Lagerstätte wird in Konzessionen für je so viele Förderanlagen geteilt.
  anlagen_je_konzession: 2
  konzessionen_max: 12

  schwierigkeiten:
    - {id: leicht, kompetenz: 0.25, aggressivitaet: 0.3}
    - {id: mittel, kompetenz: 0.5, aggressivitaet: 0.5}
    - {id: schwer, kompetenz: 0.8, aggressivitaet: 0.7}
  schwierigkeit_standard: mittel
  # Jede Firma weicht zufällig bis zu so viel von den Werten der Schwierigkeit ab.
  streuung: 0.15

  # Startbesetzung: Die KI-Firmen decken zusammen die Nachfrage des Startjahres.
  start:
    auslastung: 0.9                # Startauslastung und Normalauslastung der Vollkosten (M16: deckt bei 115 % Kapazität die Nachfrage)
    # Ein Land bekommt eine Anlage erst ab diesem Anteil einer ganzen Anlage.
    anlage_mindestanteil: 0.35
    lager_eingang_tage: 20
    lager_ausgang_tage: 14             # wie lager_ziel_tage: Startlager im Gleichgewicht
    # Kasse für so viele Monate laufender Kosten
    kasse_monate: 3
    # Gewicht des Entwicklungsstands bei der Wahl der Länder je Produktart:
    # Rohstoffe liegen bei der Lagerstätte, Halbzeuge und Bauteile in Industrieländern.
    gewicht_entwicklung: {rohstoff: 0, halbzeug: 1.5, komponente: 2, endprodukt: 0.5, energie: 1}
    # Lohn je Stunde zum Vergleich der Rezepte (USD bei Preisniveau 1)
    referenzlohn_usd: 4
    # Anlagen für dieses Vielfache des Bedarfs bei Vollleistung, je Produktart: gesättigte
    # Märkte (M16).
    marktdeckung: {rohstoff: 1.15, halbzeug: 1.15, komponente: 1.15, endprodukt: 1.15, energie: 1.15}

  verhalten:
    betrieb_alle_tage: {bei_0: 14, bei_1: 7}          # Kompetenz
    # Erzeugung = Absatz und Eigenverbrauch je Tag + (Lagerziel − Lager) / Ausgleichstage
    lager_ziel_tage: 14                                # Lager in Tagen von Absatz und Eigenverbrauch
    lager_ausgleich_tage: 15                           # so schnell wird die Lücke zum Ziel geschlossen
    # Einkauf: Gebote steigen unter „niedrig“ und sinken über „hoch“ um den Schritt
    lager_hoch_tage: 20
    lager_niedrig_tage: 7
    auslastung_schritt: 0.1
    auslastung_min: 0.05
    # Die geplante Auslastung ändert sich je Entscheidung höchstens so stark: Ein schwacher
    # Monat legt kein Werk still, ein starker füllt nicht alle Lager auf einmal (Schweinezyklus).
    auslastung_aenderung_max: 0.3
    # × Vollkosten bei normaler Auslastung (mit Gemeinkosten); deckt Werbung, Zinsen,
    # Gebäude und den üblichen Gewinn. Liegen die Preise an der Untergrenze, gilt im
    # Gleichgewicht Preis = Richtpreis bei einer Marge zum Richtpreis von 1 − 1/Faktor;
    # die Rezepte haben typisch 10–30 %.
    preisuntergrenze: {bei_0: 1.2, bei_1: 1.1}
    werbeanteil: {bei_0: 0.01, bei_1: 0.03}           # Werbung je Monat, Anteil am Umsatz, Aggressivität
    einkauf_aufschlag: 0.25                           # Höchstpreis über dem Marktpreis
    ausbau_auslastung: {bei_0: 0.95, bei_1: 0.8}      # Aggressivität
    ausbau_marge: {bei_0: 0.1, bei_1: 0.03}           # Aufschlag auf Vollkosten mit Gemeinkosten (M16), Aggressivität
    ausbau_vorprodukt_preis_max: 1.5                  # kein Ausbau, solange ein Vorprodukt mehr kostet (× Richtpreis im Land): knapp
    ausbau_anteil_kasse_max: 0.3
    # Lohnaufschlag je Standort (M18): + Schritt je Entscheidung, solange eine Anlage auf
    # Arbeitskräfte wartet, sonst − Schritt bis 0; höchstens so viel.
    lohnaufschlag_schritt: 0.05
    lohnaufschlag_max: 0.3
    forschung_vorgriff_jahre: {bei_0: 0, bei_1: 2}    # Kompetenz
    forschung_mindestumsatz_usd: 2_000_000
    forschung_mindestkompetenz: 0.4
    # Marktlücken (M32): Produkte, nach denen gefragt wird, die aber keine Firma herstellen
    # kann, erforschen Firmen ohne Aufgabe in den eigenen Branchen – so viele zugleich.
    forschung_luecke_firmen: 2
    kasse_min_monate: 2
    kasse_max_monate: 6
    kredit_jahre: 10
    gruendungen_je_monat: 2
    diversifikationen_je_quartal: 4                   # reiche Firmen bauen in fremden Engpässen
    # Teure Märkte (M33): Zahlen die Käufer weltweit wenigstens das Vielfache des
    # Richtpreises, steigt eine weitere Firma ein, solange weniger als so viele Firmen das
    # Produkt herstellen; sie plant für diesen Anteil des Absatzes.
    einstieg_preisfaktor: 1.3
    einstieg_firmen_max: 4
    einstieg_anteil: 0.25
    # Eine neue Konzession nur, wenn der Restvorrat der Lagerstätte noch so viele Jahre
    # ihrer Höchstförderung reicht (M33).
    vorrat_jahre_min: 10
    gruendung_kapitalfaktor: 1.5
    # Überkapazität abbauen (M22): Liegt der Abgang (Verkauf und Eigenverbrauch) eines
    # angebotenen Produkts am Standort zum Quartalsende unter stilllegen_auslastung der
    # Vollleistung (und der Preis im Land unter dem Richtpreis · stilllegen_preis_max),
    # werden die Einheiten stillgelegt, die bei der Zielauslastung nicht gebraucht werden;
    # nach so vielen Monaten Stillstand verkauft. Förderanlagen bleiben. Übersteigt der
    # Abgang wiederanfahren_auslastung der laufenden Vollleistung, fährt die KI zum
    # Quartalsende stillgelegte Anlagen wieder an, bis die Zielauslastung erreicht ist.
    stilllegen_auslastung: 0.5
    stilllegen_zielauslastung: 0.8
    stilllegen_preis_max: 1.0          # nur wo das Produkt unter seinem Richtpreis verkauft wird
    wiederanfahren_auslastung: 0.95    # Abgang über diesem Anteil der laufenden Vollleistung: Anlagen laufen wieder an
    verkaufen_nach_monaten: 24
