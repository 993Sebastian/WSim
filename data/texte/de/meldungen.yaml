# Lieblingsbegründungen der Manager je Stil (MG7): lieblingsgrund.<begruendung>.<stil>.<1–3>
lieblingsgrund.rendite.offensiv.1: "Hier steckt Rendite drin – wer jetzt zugreift, kassiert vor den anderen."
lieblingsgrund.rendite.offensiv.2: "Die Rendite ist der Punkt: Mutig anfangen zahlt sich schneller aus als abwarten."
lieblingsgrund.rendite.offensiv.3: "Ich sehe vor allem die Rendite – lieber groß anpacken als zögern."
lieblingsgrund.rendite.vorsichtig.1: "Wichtig ist mir, dass sich die Rendite sicher trägt, bevor wir viel Geld binden."
lieblingsgrund.rendite.vorsichtig.2: "Die Rendite muss auch im schlechten Fall stimmen – nur dann lohnt es sich."
lieblingsgrund.rendite.vorsichtig.3: "Ich rechne die Rendite vorsichtig; lieber klein beginnen und nachlegen."
lieblingsgrund.rendite.zahlengetrieben.1: "Der Erwartungswert der Rendite entscheidet – die Zahlen sprechen für diese Option."
lieblingsgrund.rendite.zahlengetrieben.2: "Nach Rendite je eingesetztem Dollar liegt diese Option vorn."
lieblingsgrund.rendite.zahlengetrieben.3: "Rein rechnerisch bringt diese Option die beste Rendite."
lieblingsgrund.rendite.querdenker.1: "Die Rendite liegt woanders, als man erwartet – genau dort würde ich ansetzen."
lieblingsgrund.rendite.querdenker.2: "Wer nur auf die offensichtliche Rendite schaut, übersieht die bessere Nische."
lieblingsgrund.rendite.querdenker.3: "Eine ungewöhnliche Rendite-Chance, die der Markt noch nicht sieht."
lieblingsgrund.marktanteil.offensiv.1: "Es geht um Marktanteil – wer jetzt Boden gewinnt, hält ihn später."
lieblingsgrund.marktanteil.offensiv.2: "Marktanteil holt man sich im Angriff, nicht im Abwarten."
lieblingsgrund.marktanteil.offensiv.3: "Mit mehr Marktanteil sind wir der Konkurrenz einen Schritt voraus."
lieblingsgrund.marktanteil.vorsichtig.1: "Wir sollten den Marktanteil halten, den wir haben, und ihn Schritt für Schritt ausbauen."
lieblingsgrund.marktanteil.vorsichtig.2: "Marktanteil ist wertvoll, aber nicht um jeden Preis – ich würde behutsam vorgehen."
lieblingsgrund.marktanteil.vorsichtig.3: "Den Marktanteil sichern wir am besten ohne Risiko für die Kasse."
lieblingsgrund.marktanteil.zahlengetrieben.1: "Der Marktanteil steigt nach meiner Rechnung mit dieser Option am stärksten."
lieblingsgrund.marktanteil.zahlengetrieben.2: "Ein Prozentpunkt Marktanteil ist hier etwa so viel wert – deshalb diese Option."
lieblingsgrund.marktanteil.zahlengetrieben.3: "Nach den Marktdaten bringt diese Option den größten Marktanteil je Dollar."
lieblingsgrund.marktanteil.querdenker.1: "Den Marktanteil gewinnt man dort, wo die anderen nicht hinsehen."
lieblingsgrund.marktanteil.querdenker.2: "Ein kleiner, vergessener Markt kann uns mehr Marktanteil bringen als der große."
lieblingsgrund.marktanteil.querdenker.3: "Marktanteil entsteht durch das, was die Konkurrenz nicht tut."
lieblingsgrund.sicherheit.offensiv.1: "Auch Sicherheit braucht Mut: Wer jetzt investiert, ist morgen unabhängiger."
lieblingsgrund.sicherheit.offensiv.2: "Die Sicherheit liegt im Wachstum – ein starker Standort trägt sich selbst."
lieblingsgrund.sicherheit.offensiv.3: "Sicherheit durch Größe – das ist mein Argument."
lieblingsgrund.sicherheit.vorsichtig.1: "Mir geht es um Sicherheit: lieber ein kleiner Schritt, der sicher klappt."
lieblingsgrund.sicherheit.vorsichtig.2: "Sicherheit zuerst – die Reserve darf nicht darunter leiden."
lieblingsgrund.sicherheit.vorsichtig.3: "Ich empfehle das, was am wenigsten schiefgehen kann."
lieblingsgrund.sicherheit.zahlengetrieben.1: "Das Risiko ist bei dieser Option am kleinsten, gemessen an der Streuung der Prognose."
lieblingsgrund.sicherheit.zahlengetrieben.2: "Die Spanne der Prognose ist hier am engsten – das ist die sicherere Wahl."
lieblingsgrund.sicherheit.zahlengetrieben.3: "Nach Schwankungsbreite ist das die sicherste Option."
lieblingsgrund.sicherheit.querdenker.1: "Sicher ist, was andere nicht kopieren können – das ist hier der Fall."
lieblingsgrund.sicherheit.querdenker.2: "Sicherheit durch Abwechslung: ein zweites Standbein statt einer größeren Wette."
lieblingsgrund.sicherheit.querdenker.3: "Gerade das Ungewöhnliche streut das Risiko."
lieblingsgrund.technologie.offensiv.1: "Der Technologievorsprung ist der Hebel – wer jetzt baut, setzt den Standard."
lieblingsgrund.technologie.offensiv.2: "Mit der neuen Technik sind wir den anderen Jahre voraus."
lieblingsgrund.technologie.offensiv.3: "Technologie ist Angriff: Ich würde sofort umstellen."
lieblingsgrund.technologie.vorsichtig.1: "Bei der Technologie würde ich erst Erfahrungen sammeln und dann ausrollen."
lieblingsgrund.technologie.vorsichtig.2: "Die Technologie muss sich erst bewähren – ein Probelauf genügt zunächst."
lieblingsgrund.technologie.vorsichtig.3: "Neue Technik ja, aber Schritt für Schritt."
lieblingsgrund.technologie.zahlengetrieben.1: "Die Technologie senkt die Stückkosten nach meiner Rechnung deutlich – das trägt die Option."
lieblingsgrund.technologie.zahlengetrieben.2: "Der Technologievorsprung ist in Zahlen messbar: weniger Ausschuss, weniger Stunden."
lieblingsgrund.technologie.zahlengetrieben.3: "Nach Kostenvergleich liegt die neue Technologie vorn."
lieblingsgrund.technologie.querdenker.1: "Die Technologie aus der Nachbarbranche löst unser Problem – das sieht kaum jemand."
lieblingsgrund.technologie.querdenker.2: "Ich würde eine Technik nehmen, die hier noch keiner nutzt."
lieblingsgrund.technologie.querdenker.3: "Ein ungewöhnlicher Technologiepfad kann uns einen Sprung nach vorn bringen."
