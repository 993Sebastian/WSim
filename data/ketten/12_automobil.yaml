rezepte:
  - id: motor_bauen
    produkt: motor
    menge: 1
    dauer_tage: 3
    anlage: motorenwerk
    technologie: ottomotor
    eingang:
      stahl: 0.19                 # nur Stahl (Lastenheft §17.2): Block, Welle, Kleinteile
    arbeit_stunden:
      angelernt: 120
      fachkraft.maschinenbau: 150
      akademiker.maschinenbau: 3
    qualitaet_basis: 50
    annaeherung: true

  - id: motor_fliessband          # Ford: etwa ein Sechstel der Stunden der Werkstattfertigung
    produkt: motor
    menge: 1
    dauer_tage: 1
    anlage: motorenwerk_fliessband
    technologie: fliessband
    eingang:
      stahl: 0.19
    arbeit_stunden:
      angelernt: 30
      fachkraft.maschinenbau: 10
      akademiker.maschinenbau: 0.3
    energie_mwh: 0.15
    qualitaet_basis: 55
    annaeherung: true

  - id: fahrgestell_bauen
    produkt: fahrgestell
    menge: 1
    dauer_tage: 2
    anlage: fahrgestellwerk
    technologie: automobil
    eingang:
      stahl: 0.33                 # Rahmen und Achsen, nur Stahl
    arbeit_stunden:               # Rahmen, Achsen, Federn und Lenkung von Hand
      angelernt: 110
      fachkraft.maschinenbau: 80
    qualitaet_basis: 50
    annaeherung: true

  - id: fahrgestell_fliessband
    produkt: fahrgestell
    menge: 1
    dauer_tage: 1
    anlage: fahrgestellwerk_fliessband
    technologie: fliessband
    eingang:
      stahl: 0.33
    arbeit_stunden:
      angelernt: 18
      fachkraft.maschinenbau: 5
    energie_mwh: 0.1
    qualitaet_basis: 55
    annaeherung: true

  - id: karosserie_holz           # Holzgerippe mit Blech, Kutschenbau
    produkt: karosserie
    menge: 1
    dauer_tage: 3
    anlage: karosseriewerk
    technologie: automobil
    eingang:
      schnittholz: 0.15
      stahl: 0.067                # Beplankung und Beschläge
      glas: 0.01
      leim: 0.002
    arbeit_stunden:
      angelernt: 60
      fachkraft.holz_bau: 80
      fachkraft.textil: 10
    qualitaet_basis: 50
    annaeherung: true

  - id: karosserie_stahl
    produkt: karosserie
    menge: 1
    dauer_tage: 1
    anlage: karosseriewerk
    technologie: ganzstahlkarosserie
    eingang:
      stahl: 0.229                # Blech, Beschläge und Schrauben aus dem eigenen Walzwerk
      glas: 0.01
    arbeit_stunden:
      angelernt: 30
      fachkraft.metall: 15
      fachkraft.textil: 5
    energie_mwh: 0.2              # Pressen
    qualitaet_basis: 65
    annaeherung: true

  - id: automobil_montage
    produkt: automobil
    menge: 1
    dauer_tage: 5
    anlage: automobilwerk
    technologie: automobil
    eingang:
      motor: 1
      fahrgestell: 1
      karosserie: 1
      autoreifen: 4
    arbeit_stunden:               # Werkstattmontage: Wochen je Wagen
      angelernt: 220
      fachkraft.maschinenbau: 180
      akademiker.maschinenbau: 8
    qualitaet_basis: 55
    annaeherung: true

  - id: automobil_fliessband
    produkt: automobil
    menge: 1
    dauer_tage: 1
    anlage: automobilwerk_fliessband
    technologie: fliessband
    eingang:
      motor: 1
      fahrgestell: 1
      karosserie: 1
      autoreifen: 4
    arbeit_stunden:
      angelernt: 35
      fachkraft.maschinenbau: 12
      akademiker.maschinenbau: 0.5
    energie_mwh: 0.5
    qualitaet_basis: 55
    annaeherung: true

  - id: rohoel_cracken            # Burton-Verfahren: mehr Benzin aus dem Rohöl
    produkt: benzin
    menge: 0.4
    nebenprodukte:
      petroleum: 0.15             # Rest: Gas, Koks, Verluste
    dauer_tage: 2
    anlage: crackanlage
    technologie: thermisches_cracken
    eingang:
      rohoel: 1
    arbeit_stunden:
      ungelernt: 1.0
      angelernt: 1.0
      fachkraft.chemie: 0.8
      akademiker.chemie: 0.05
    qualitaet_basis: 55
    annaeherung: true

technologien:
  - id: ottomotor                 # Nicolaus August Otto
    fachgebiet: maschinenbau
    erfindungsjahr: 1876

  - id: automobil                 # Carl Benz
    fachgebiet: maschinenbau
    erfindungsjahr: 1886
    voraussetzungen: [ottomotor]

  - id: fliessband                # Henry Ford, Highland Park
    fachgebiet: maschinenbau
    erfindungsjahr: 1913
    voraussetzungen: [automobil]
    forschungsaufwand: 30_000
    annaeherung: true

  - id: ganzstahlkarosserie       # Edward G. Budd
    fachgebiet: metall
    erfindungsjahr: 1914
    voraussetzungen: [automobil, warmwalzen]
    forschungsaufwand: 12_000
    annaeherung: true

  - id: thermisches_cracken       # William Burton
    fachgebiet: chemie
    erfindungsjahr: 1913
    voraussetzungen: [erdoeldestillation]
    forschungsaufwand: 15_000
    annaeherung: true
