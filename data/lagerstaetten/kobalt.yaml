# Kobalt-Lagerstätten (M40). Kobalt fällt fast nur in Kupfer- und Nickelgruben an; jede
# Lagerstätte steht für den Kobaltanteil ihrer Gruben und Hütten. Vorrat und Förderung in t
# Kobalt, Förderung etwa nach dem Stand um 2008. Länder in heutigen Grenzen. Alle Werte sind
# grobe Annäherungen.

lagerstaetten:
  - id: katanga_kobalt   # Kolwezi, Kamoto (Gécamines); 1990 stürzte die Kamoto-Grube ein
    land: COD
    rohstoff: kobalt
    vorrat: 3_500_000
    entdeckt: 1906
    erschliessung: {investition_usd: 150_000_000, dauer_tage: 900}
    foerderung_max_je_jahr: 30_000
    foerderkosten_faktor: 0.8
    annaeherung: true

