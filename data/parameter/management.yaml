# Manager-System (docs/MANAGER.md; Regeln: docs/FORMELN.md, MA1). Gehaltsfaktoren nach
# der Vorgabe (Abschnitt 3): Vielfaches des Jahreslohns eines kaufmännischen Akademikers
# im Land der Stelle. Fähigkeiten 0–100.

management:
  # Bereiche und die Themen der Entscheidungen (MA0), die eine Stelle des Bereichs
  # erledigt. Logistik bekommt Themen mit Stufe 2; Finanzen sind Sache des Vorstands (MA5).
  bereiche:
    - id: produktion
      themen: [produktion, ueberkapazitaet, stillgelegt, wiederanfahren, ausbau, kraftwerk,
               lagerstaette, engpass]
    - id: einkauf_lager
      themen: [einkauf, eigenversorgung]
    - id: vertrieb_marketing
      themen: [verkauf, werbung]
    - id: personal
      themen: [lohn, abwerbung]
    - id: logistik
      themen: []
    - id: forschung
      themen: [forschung, weiterentwicklung]
    - id: finanzen
      themen: [kasse, kaufangebot, antwort]

  # Themen der laufenden Routine: Hier folgt die Stelle der Option der Regeln; bei allen
  # anderen empfiehlt sie nach ihrem Urteilsvermögen (MA2).
  routine_themen: [produktion, verkauf, einkauf, eigenversorgung, lohn]
  # Themen, deren Wirkung nur Kosten zählt (Zins, Werbebudget): Auch hier folgt die Stelle
  # der Regel; Anliegen dazu sind aber wichtig (MA5).
  regel_themen: [kasse, werbung]

  # Ebenen: Prüfrhythmus in Tagen, Gehaltsfaktor der Fachstellen und der Leitung,
  # Budget je Entscheidung und je Jahr als Anteil am Umsatz der Einheit in zwölf Monaten
  # (Vorgabe, Abschnitt 5.2), die Themen, die Stellen der Ebene selbst aufgreifen (MA3),
  # und die Fachstellen von Land und Kontinent (die der Standorte: standorttypen). Den
  # Vorstand gibt es mit MA5.
  ebenen:
    - {id: standort, pruefung_tage: 7, gehalt_fach: 1.5, gehalt_leitung: 2.5,
       budget_fach: [0.02, 0.05], budget_leitung: [0.05, 0.10],
       themen: [produktion, verkauf, einkauf, eigenversorgung, lohn, ueberkapazitaet,
                stillgelegt, wiederanfahren, ausbau, forschung, weiterentwicklung]}
    - {id: land, pruefung_tage: 30, gehalt_fach: 3, gehalt_leitung: 4,
       budget_fach: [0.03, 0.06], budget_leitung: [0.05, 0.12],
       fachstellen: [produktion, einkauf_lager, vertrieb_marketing, personal, logistik,
                     forschung],
       themen: [ueberkapazitaet, stillgelegt, wiederanfahren, ausbau, kraftwerk,
                lagerstaette, werbung]}
    - {id: kontinent, pruefung_tage: 30, gehalt_fach: 5, gehalt_leitung: 7,
       budget_fach: [0.03, 0.08], budget_leitung: [0.06, 0.15],
       fachstellen: [produktion, einkauf_lager, vertrieb_marketing, personal, logistik,
                     forschung],
       themen: [ueberkapazitaet, stillgelegt, wiederanfahren, ausbau, kraftwerk,
                lagerstaette, werbung]}
    - {id: vorstand, pruefung_tage: 30, gehalt_fach: 10, gehalt_leitung: 15,
       budget_fach: [0.03, 0.08], budget_leitung: [0.08, 0.20],
       fachstellen: [produktion, einkauf_lager, vertrieb_marketing, personal, forschung,
                     finanzen],
       themen: [ueberkapazitaet, stillgelegt, wiederanfahren, ausbau, kraftwerk,
                lagerstaette, werbung, kasse, kaufangebot, antwort, engpass]}

  # Mindestbudget in Jahresgehältern des Managers: je Entscheidung und je Jahr.
  budget_sockel_gehaelter: {entscheidung: 1, jahr: 3}

  # Anliegen (MA2): Frist der Antwort, Ruhe nach einer Ablehnung, höchstens so viele
  # offene Anliegen je Stelle, Rückmeldung zu den Folgen nach dieser Zeit, größter
  # Schätzfehler der Prognose (ohne Fachkompetenz; mit voller Fachkompetenz keiner),
  # Wahrscheinlichkeit, dass ganz ohne Urteilsvermögen die Empfehlung die beste Option
  # ist (mit vollem Urteilsvermögen immer); ab so vielen gleichen Anliegen verschiedener
  # Standorte an einem Tag fragt die Stelle darüber einmal für alle (MA3).
  anliegen:
    frist_tage: 30
    sperre_tage: 90
    offen_je_stelle: 2
    wirkzeit_tage: 91
    schaetzfehler: 0.5
    empfehlung_grund: 0.5
    buendel_ab: 3

  # Strategievorgaben (MA4): Premium und Kampfpreis setzen die Preisuntergrenze als
  # Vielfaches der Vollkosten je Stück und den Aufschlag, mit dem ein Angebot auf den
  # Marktpreis startet („Marktpreis“ nimmt die Untergrenze der Regeln). Dazu die größten
  # Werte, die sich einstellen lassen: Mindestmarge auf die Vollkosten, Reichweiten des
  # Lagers in Tagen, Liquiditätsreserve in Monaten laufender Kosten.
  strategie:
    premium: {untergrenze: 1.35, aufschlag: 0.15}
    kampfpreis: {untergrenze: 0.95, aufschlag: -0.1}
    mindestmarge_max: 2
    lager_tage_max: 180
    liquiditaet_monate_max: 24

  # Strategieauftrag und Strategierücksprache (MA5): Aggressivität der Regeln (0–1, wie
  # bei den KI-Firmen) je Leitlinie; höchstens so viele Anträge je Rücksprache, so viele
  # Chancen und Risiken im Bericht, so viele Rücksprachen bleiben gespeichert. Ein
  # Personalressort mit voller Fachkompetenz macht den Eindruck der Fähigkeiten um diesen
  # Anteil genauer.
  strategieauftrag:
    leitlinien: {wachstum: 0.8, ertrag: 0.5, sicherheit: 0.2, marktfuehrung: 0.8}
    antraege_max: 3
    chancen_risiken: 3
    ruecksprachen_behalten: 8
    personal_schaerfe: 0.8

  # Lebendiger Managermarkt (MA6). Erfahrung: je Monat auf einer Stelle mit dieser
  # Wahrscheinlichkeit ein Punkt Fachkompetenz im Bereich der Stelle, bis zur persönlichen
  # Obergrenze (Schwerpunkt bei der Ziehung + bis zu spielraum). Zufriedenheit 0–100: Ziel
  # = basis + gehalt_gewicht · 100 · (Gehalt / Marktwert − 1) − verlust_abzug (Einheit mit
  # Verlust in zwölf Monaten) − uebergangen_abzug je übergangener Empfehlung; je Monat um
  # den Anteil anpassung dorthin; Stufen „unzufrieden“ und „gemischt“ bis zu den Grenzen.
  # Unter der Schwelle kündigt ein Manager je Monat mit bis zu chance_max. Abwerbung durch
  # KI-Firmen: Manager ab staerke_min, um vorsprung stärker als der beste freie Bewerber,
  # Angebot Gehalt · (1 + aufschlag); unbeantwortet sinkt die Zufriedenheit um
  # ignoriert_abzug; KI-Firmen halten ihre Manager bis ki_gegen_max · Gehalt. KI-Firmen
  # stellen je Monat höchstens einstellungen_monat ein: den CEO ab umsatz_ceo_usd Umsatz
  # der Firma, Standortleitungen ab umsatz_standort_usd Umsatz des Standorts (in zwölf
  # Monaten), das Gehalt höchstens gehalt_anteil des Umsatzes der Einheit. Wirkung auf
  # ihre Kompetenz: kompetenz_ceo bzw. kompetenz_leitung · (Stärke − 50) / 50.
  markt:
    erfahrung: {chance_monat: 0.3, spielraum: 20}
    zufriedenheit: {start: 70, basis: 70, gehalt_gewicht: 1, verlust_abzug: 15,
                    uebergangen_abzug: 5, anpassung: 0.3, stufen: [30, 60]}
    kuendigung: {schwelle: 30, chance_max: 0.25}
    abwerbung: {staerke_min: 70, vorsprung: 10, aufschlag: 0.2, ignoriert_abzug: 20,
                ki_gegen_max: 1.3, sperre_monate: 12}
    ki: {einstellungen_monat: 1, umsatz_ceo_usd: 50000000, umsatz_standort_usd: 5000000,
         gehalt_anteil: 0.02, kompetenz_ceo: 0.15, kompetenz_leitung: 0.1}

  # Fachstellen je Standorttyp; jeder Standort hat außerdem eine Leitung.
  standorttypen:
    werk: [produktion, einkauf_lager, vertrieb_marketing, personal, logistik]
    foerderstaette: [produktion, vertrieb_marketing, personal]
    kraftwerk: [produktion, einkauf_lager]
    lager: [logistik]
    niederlassung: [vertrieb_marketing]
    forschungszentrum: []

  # Eine Leitung ohne die Fachstelle eines Bereichs erledigt ihn mit so viel weniger
  # Fachkompetenz (Vorgabe: 20 %).
  leitung_ohne_fach_abschlag: 0.2
  # Wahrscheinlichkeit, mit der eine Stelle eine Lage am Prüftermin bemerkt:
  # bemerken_grund + (1 − bemerken_grund) · Sorgfalt / 100.
  bemerken_grund: 0.5
  # Lohngruppe, nach der sich die Gehälter richten.
  gehalt_lohngruppe: akademiker.kaufmaennisch
  abfindung_monate: 3

  # Bewerberpool je Kontinent: Kandidaten je Million Akademiker, begrenzt; am
  # Monatsanfang verlässt jeder freie Kandidat den Markt mit dieser Wahrscheinlichkeit.
  pool:
    je_mio_akademiker: 4
    min: 12
    max: 60
    abgang_monat: 0.15

  # Verteilung der Fähigkeiten (Normalverteilung, auf 0–100 begrenzt); Risikoneigung und
  # Fragefreude sind gleichverteilt. Der Eindruck verschiebt die angezeigte Stufe.
  faehigkeiten:
    schwerpunkt: {mittel: 60, streuung: 15}
    sonst: {mittel: 35, streuung: 15}
    allgemein: {mittel: 50, streuung: 15}
    eindruck_unschaerfe: 15

  annaeherung: true
