# Umwelt und Regulierung (H2; Lastenheft §12; Formeln: docs/FORMELN.md, Abschnitt H2;
# Format: docs/DATENFORMAT.md). Die Regeln selbst stehen in regulierungen.yaml.

umwelt:
  # Stufen der Abgasreinigung, die Einheiten mit Schadstoffen nachrüsten können: ab dem Jahr
  # verfügbar, Minderung der Schadstoffe, Kosten als Anteil der Investition der Einheit.
  nachruestung:
    - {ab: 1910, minderung: 0.5, kosten_anteil: 0.03}   # Zyklone, Staubkammern
    - {ab: 1950, minderung: 0.6, kosten_anteil: 0.05}   # Elektrofilter
    - {ab: 1972, minderung: 0.7, kosten_anteil: 0.08}   # Rauchgasentschwefelung
    - {ab: 1985, minderung: 0.6, kosten_anteil: 0.06}   # Entstickung, beste Technik
