beteiligungen.lenken: Lenken
beteiligungen.lenken_hilfe: "Als Mehrheitseigner bestimmst du das Tempo: zügig verkürzt die Phasen, senkt aber die Chance; gründlich dauert länger und gelingt öfter. Es gilt für die nächsten Phasen und für die laufende, solange ihre Runde offen ist."
