# Parameter der Produktion. Formeln: docs/FORMELN.md, Abschnitt M5.

produktionsmodell:
  # Kosten für Grundstück und Gebäude beim Gründen eines Standorts
  standortkosten_usd:
    foerderstaette: 200_000
    werk: 500_000
    kraftwerk: 300_000
    lager: 150_000
    niederlassung: 150_000
    forschungszentrum: 400_000
  gebaeude_lebensdauer_jahre: 50
  erschliessung_lebensdauer_jahre: 30
  automatisierung:
    arbeitsersparnis: 0.8       # Anteil der Arbeit, den volle Automatisierung bei voller Prägung spart
    kostenanteil: 0.5           # Kosten für Automatisierung 0 → 1 als Anteil der Investition
  qualitaet:
    vorprodukte: 0.3            # je Punkt Vorproduktqualität über/unter 50
    automatisierung: 10         # Punkte bei voller Automatisierung
    zustand: 20                 # Punkte Abzug bei völlig verschlissener Anlage
  zustand_minimum: 0.2
  strom: strom                  # Produkt für Eigenstrom (Kette 7)
  einspeiseverguetung: 0.5      # Anteil des Industriestrompreises für Überschuss ins Netz
  # Verwaltung, Vertrieb und Logistik je Lauf als Anteil der Wertschöpfung zu Richtpreisen
  # (Erzeugnisse minus Vorprodukte), je Produktart (M16). Die Rezepte enthalten nur direkte
  # Kosten; Richtpreise sind Marktpreise. Konsumgüter tragen den Vertrieb an Verbraucher.
  gemeinkosten_anteil: {rohstoff: 0.1, halbzeug: 0.2, komponente: 0.25, endprodukt: 0.4, energie: 0}
  # Plausibilitätsprüfung beim Laden: Marge des besten Rezepts eines Produkts zu Richtpreisen
  # im ersten Jahr, in dem es hergestellt werden kann (Referenzland, Normalauslastung).
  # Förderung nur nach unten geprüft: knappe Lagerstätten tragen eine Rente.
  richtpreis_marge: {minimum: 0.05, maximum: 0.45}

  # Was eine neue Firma zu Beginn besitzt (Lastenheft §2, §15); bezahlt aus dem
  # Startkapital. Die Werkstatt stellt Nägel aus Draht her und verkauft sie zum
  # Marktpreis; der Händler beginnt mit einer Niederlassung im Startland.
  startformen:
    werkstatt:
      standorttyp: werk
      gebaeude_usd: 20_000          # kleine Werkstatt statt eines Industriewerks
      anlagen:
        - {anlage: nagelmaschine, rezept: naegel_maschine, auslastung: 1.0}
      einkauf:
        - {produkt: draht, ziel: 5, hoechstpreis_usd: 2_000}
      verkauf: [naegel]
    handel:
      standorttyp: niederlassung
      gebaeude_usd: 15_000
