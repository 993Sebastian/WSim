# Währungen (Lastenheft §3.6, §18.2; M21). Formatbeschreibung: docs/DATENFORMAT.md.
#
# kurse:   Einheiten der Währung je US-Dollar der jeweiligen Zeit (nominal). Ein Jahr
#          steht für das Jahresmittel, "Jahr-Monat" für einen Monat (Paritätsänderungen,
#          Hyperinflation). Dazwischen wird auf logarithmischer Skala interpoliert, vor
#          dem ersten und nach dem letzten Wert bleibt der Kurs gleich.
# bindung: statt Kursen fest an eine andere Währung (Einheiten je Einheit der anderen).
#
# Die Kurse sind Näherungen: Goldparitäten bis 1914, Paritäten von Bretton Woods
# 1946–1971 und gerundete Jahresmittel der freien Kurse; bei gespaltenen Kursen der
# Kurs, zu dem tatsächlich gehandelt wurde. Wo eine Landeswährung jünger ist als 1900,
# gilt vorher die Währung der Kolonial- oder Vormacht (Zuordnung in laender.yaml).
