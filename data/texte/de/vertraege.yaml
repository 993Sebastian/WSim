# Lieferverträge (W4)
vertrag.abgelehnt.preis: Der Preis passt ihr nicht.
vertrag.abgelehnt.menge: So viel kann sie nicht liefern oder abnehmen.
vertrag.abgelehnt.qualitaet: Diese Qualität erreicht sie nicht.
vertrag.abgelehnt.strafe: Die Vertragsstrafe ist ihr zu hoch.
vertrag.abgelehnt.nur_preis: Über den Preis allein verhandelt sie einen laufenden Vertrag nicht neu – dafür muss sich auch Menge oder Laufzeit lohnend ändern.
