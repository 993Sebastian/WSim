einfuehrung.weiter: Weiter
einfuehrung.fertig: Fertig
einfuehrung.starten: Einführung starten
einfuehrung.willkommen.titel: Willkommen
einfuehrung.willkommen.text: "Du führst eine kleine, neue Firma. Die Märkte sind schon verteilt: Etablierte Firmen versorgen jedes Land, sie sind bekannt und haben große Werke. Verkaufen wirst du nur, was du ihnen abnimmst – über einen günstigeren Preis, bessere Qualität, eine bekannte Marke, genug Ware in den Läden oder als Lieferant anderer Firmen."
einfuehrung.uebersicht.titel: Übersicht
einfuehrung.uebersicht.text: "Hier stehen Kasse, Eigenkapital und Ergebnis deiner Firma und die Zahl deiner Wettbewerber. Oben wählst du die Rundenlänge und beendest die Runde (Strg + Enter); danach fasst der Rundenbericht zusammen, was geschehen ist."
einfuehrung.produktion.titel: Standorte
einfuehrung.produktion.text: "Jeder Standort ist eine Karte mit Umsatz, Ergebnis und Engpässen. „Öffnen“ führt in die Werksansicht: Anlagen (Verfahren und Auslastung), Einkauf (Ziellager und Höchstpreis der Vorprodukte), Verkauf (dein Preis neben Marktpreis und Stückkosten), Personal (Arbeitskräfte und Lohnaufschlag) sowie Kosten und Ergebnis. Neue Standorte gründest du unten auf der Seite."
einfuehrung.markt.titel: Markt
einfuehrung.markt.text: "Preise, Nachfrage und Anbieter jedes Landes im Vormonat. „Marktführer“ zeigt, gegen wen du antrittst, „Eigener Anteil“, was du ihm schon abgenommen hast. Wer mehr Ware in die Läden bringt, wird öfter gekauft; ein kleiner Neuling mit hohem Preis bleibt auf seiner Ware sitzen."
einfuehrung.werbung.titel: Marke und Werbung
einfuehrung.werbung.text: "Unter der Markttabelle steht deine Bekanntheit je Warengruppe neben der bekanntesten Konkurrenz. Ein monatliches Werbebudget macht dich bekannt, Verkäufe an Verbraucher ebenso; ohne beides verblasst die Marke. Industriekunden und Staaten kaufen allein nach dem Preis."
einfuehrung.forschung.titel: Forschung
einfuehrung.forschung.text: "Mit einem Forschungszentrum und seinen Laboren erforschst du neue Verfahren und Produkte – auch vor ihrer historischen Zeit, dann aber teurer."
einfuehrung.finanzen.titel: Finanzen
einfuehrung.finanzen.text: "Kredite, Erfolgsrechnung, Bilanz und Kapitalfluss. Behalte die Kasse im Blick: Ohne Geld kannst du nicht einkaufen, und wer zahlungsunfähig wird, scheidet aus."
einfuehrung.weltkarte.titel: Weltkarte
einfuehrung.weltkarte.text: "Einwohner, Einkommen und Rohstoffe der Länder; ein Klick zeigt ein Land mit seinen Firmen. Mit „?“ siehst du alle Tastaturkürzel und kannst diese Einführung erneut starten. Viel Erfolg!"

