# Namensbausteine für erzeugte KI-Firmen (Lastenheft §10) und für Manager (Vor- und
# Familienname, docs/MANAGER.md, MA1). Eine Firma bekommt die
# Namensgruppe ihres Sitzlandes, sonst die Standardgruppe. Platzhalter im Muster:
# {familienname}, {ort}, {rechtsform}, {branche}. Namen sind Eigennamen und werden nicht
# übersetzt; reale Firmennamen stehen in reale_firmen.yaml und werden nicht erzeugt.

