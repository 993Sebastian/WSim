# Kette 49 – Rüstung (H3, Lastenheft §6.5)
# Stahl, Salpeter oder Ammoniak → Munition; Stahl, Schnittholz → Gewehr; Stahl → Geschütz;
# Stahl, Motor → Panzer; Flugmotor, Aluminium → Jagdflugzeug; Strahltriebwerk → Kampfjet;
# Transistoren, Aluminium → Lenkwaffe. Nur der Staat kauft: der Bedarf je BIP gilt bei
# Militärausgaben von 3 % des BIP und folgt ihnen (docs/FORMELN.md, H3). Zusammen rund
# 0,5 % des BIP bei 3 % Militärausgaben.
# Alle Zahlen sind Annäherungen; Preise in Kaufkraft 2026.

produkte:
  - id: munition
    art: endprodukt
    branche: ruestung
    einheit: t                    # Artilleriegranaten und Patronen
    gewicht_kg: 1000
    verwendung: industrie
    warengruppe: ruestung
    transportklasse: stueckgut
    richtpreis_usd: 3_300   # Herstellkosten um 1900 mit 30 % Marge
    staatsnachfrage:
      je_mio_usd_bip: 0.45 # 0,15 % des BIP
      ruestung: true
    annaeherung: true

  - id: gewehr
    art: endprodukt
    branche: ruestung
    einheit: stueck
    gewicht_kg: 4.5
    verwendung: industrie
    warengruppe: ruestung
    transportklasse: stueckgut
    richtpreis_usd: 350   # Herstellkosten um 1900 mit 30 % Marge
    staatsnachfrage:
      je_mio_usd_bip: 0.57 # 0,02 % des BIP
      ruestung: true
    annaeherung: true

  - id: geschuetz
    art: endprodukt
    branche: ruestung
    einheit: stueck               # Feldkanone mit Rohrrücklauf
    gewicht_kg: 1500
    verwendung: industrie
    warengruppe: ruestung
    transportklasse: stueckgut
    richtpreis_usd: 65_000
    staatsnachfrage:
      je_mio_usd_bip: 0.0077 # 0,05 % des BIP
      ruestung: true
    annaeherung: true

  - id: panzer
    art: endprodukt
    branche: ruestung
    einheit: stueck
    gewicht_kg: 30_000
    verwendung: industrie
    warengruppe: ruestung
    transportklasse: stueckgut
    richtpreis_usd: 390_000   # Herstellkosten 1916 mit 30 % Marge
    staatsnachfrage:
      je_mio_usd_bip: 0.0026 # 0,1 % des BIP
      ruestung: true
    sehr_komplex: true
    annaeherung: true

  - id: jagdflugzeug
    art: endprodukt
    branche: luftfahrt
    einheit: stueck
    gewicht_kg: 3000
    verwendung: industrie
    warengruppe: ruestung
    transportklasse: stueckgut
    richtpreis_usd: 315_000
    staatsnachfrage:
      je_mio_usd_bip: 0.0038 # 0,12 % des BIP
      ruestung: true
    sehr_komplex: true
    annaeherung: true

  - id: kampfjet
    art: endprodukt
    branche: luftfahrt
    einheit: stueck
    gewicht_kg: 12_000
    verwendung: industrie
    warengruppe: ruestung
    transportklasse: stueckgut
    richtpreis_usd: 5_700_000   # Löhne von 1944; heutige Kampfjets 80 Mio. USD
    ersetzt: [jagdflugzeug]
    staatsnachfrage:
      je_mio_usd_bip: 0.00021 # 0,12 % des BIP
      ruestung: true
    sehr_komplex: true
    annaeherung: true

  - id: lenkwaffe
    art: endprodukt
    branche: ruestung
    einheit: stueck               # Luft-Luft- oder Flugabwehrrakete
    gewicht_kg: 90
    verwendung: industrie
    warengruppe: ruestung
    transportklasse: stueckgut
    richtpreis_usd: 25_000
    staatsnachfrage:
      je_mio_usd_bip: 0.02 # 0,05 % des BIP
      ruestung: true
    sehr_komplex: true
    annaeherung: true

anlagen:
