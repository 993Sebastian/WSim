# Hauptsitz und Zentralabteilungen (ZA1–ZA3, docs/BETEILIGUNGEN.md; Formeln:
# docs/FORMELN.md, Abschnitte ZA1–ZA3). Beträge in USD Kaufkraft 2026.

zentrale:
  # Verlegen des Hauptsitzes: Dauer in Monaten, Kosten (Grundbetrag und je Angestelltem
  # der Zentralabteilungen) und Anteil der Angestellten, der mitzieht.
  hauptsitz: {verlegung_monate: 6, kosten_grund_usd: 250000, kosten_je_angestelltem_usd: 25000,
              mitziehen: 0.6}

  # Zentralabteilungen (ZA2): das Ressort des Vorstands, das sie leitet, die Lohngruppe der
  # Angestellten (Lohn im Land des Hauptsitzes), Bürokosten je Angestelltem und Jahr, Fälle
  # je Angestelltem und Monat und die Wirkung bei voller Güte und Abdeckung. Was eine
  # Abteilung tut, steht im Kern; die Liste wählt aus, welche es gibt.
  abteilungen:
    - {id: strategie, bereich: strategie, lohngruppe: akademiker.kaufmaennisch,
       buero_usd: 15000, faelle: 2, wirkung: 0}
    - {id: finanzen, bereich: finanzen, lohngruppe: akademiker.kaufmaennisch,
       buero_usd: 15000, faelle: 4, wirkung: 0.4}
    - {id: personal, bereich: personal, lohngruppe: akademiker.kaufmaennisch,
       buero_usd: 15000, faelle: 15, wirkung: 0.5}
    - {id: recht, bereich: recht, lohngruppe: akademiker.kaufmaennisch,
       buero_usd: 15000, faelle: 3, wirkung: 0}
    - {id: marketing, bereich: vertrieb_marketing, lohngruppe: akademiker.kaufmaennisch,
       buero_usd: 15000, faelle: 5, wirkung: 0.3}

  # So viel kleiner werden Schätzfehler einer voll ausgestatteten Abteilung, und so viel
  # öfter trifft ihre Leitung die beste Option.
  genauigkeit: 0.5

  # Empfehlungen (ZA3): Umschuldung ab diesem Zinsvorteil (absolut), Gebühr als Anteil der
  # Restschuld; Trefferquote der Leitungen: Bewertung nach Monaten, Mittelwert, Vorgewicht
  # in Fällen und Exponent k der Gehaltsforderung.
  umschuldung: {mindestvorteil: 0.01, gebuehr: 0.01}
  trefferquote: {bewertung_monate: 12, mittelwert: 0.5, vorgewicht: 4, k: 2}

  # KI-Firmen (ZA4): Zum Jahresbeginn richten sie Abteilungen in der Reihenfolge ein,
  # solange alle zusammen (Angestellte, Büro, Leitung) höchstens anteil_umsatz ihres
  # Umsatzes der letzten zwölf Monate kosten (nach Kompetenz; mit Verlust keine). Eine
  # Abteilung nur ab ihrer Mindestlast (Arbeitslast wie ZA2: Finanzen Kredite + 1,
  # Personal Manager, Marketing Werbebudgets + 1, sonst 1). Den Sitz verlegen sie in ein
  # Land mit eigenen Standorten, die mindestens anteil_umsatz_min ihres Umsatzes bringen
  # und dessen BIP je Kopf mindestens bip_anteil_min des heutigen Sitzlands beträgt (kein
  # Umzug in ein viel ärmeres Land: Kapital, Manager, Verwaltung), wenn die Ersparnis an
  # Gewinnsteuer und Löhnen der Zentrale die Kosten der Verlegung in amortisation_jahre
  # deckt; danach bleibt der Sitz mindestens sperre_jahre.
  ki:
    anteil_umsatz: {bei_0: 0, bei_1: 0.02}
    reihenfolge: [finanzen, marketing, personal, strategie, recht]
    mindestlast: {finanzen: 2, marketing: 2, personal: 10}
    sitz: {anteil_umsatz_min: 0.25, bip_anteil_min: 0.75, amortisation_jahre: 3, sperre_jahre: 10}
  annaeherung: true
