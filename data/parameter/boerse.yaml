# Börse (K1, Lastenheft §11; Formeln: docs/FORMELN.md, Abschnitt K1).

boerse:
  bewertung:
    gewicht_buchwert: 0.4       # Rest: Gewinn mal KGV
    kgv: 12
    boden_buchwert: 0.3         # nie unter 30 % des Eigenkapitals
    rendite_annahme: 0.12       # Jahresgewinn je Eigenkapital für Monate ohne Zahlen
    gewinn_monate: 24           # Gewinn als Durchschnitt so vieler abgeschlossener Monate
  stimmung:
    schwankung: 0.04            # Standardabweichung von ln S je Monat
    rueckkehr: 0.06             # so viel von ln S baut sich je Monat ab
  traegheit: 0.3                # Anteil der Lücke zum Ziel, der sich je Monat schließt
  rauschen: 0.03                # eigene Schwankung je Firma und Monat
  # Börsenkrisen stehen als Wirkung „boersenkrach“ bei den Ereignissen (H1).
  boersengang:
    eigenkapital_min_usd: 2000000
    anteil_max: 0.4
    abschlag: 0.15              # Zeichnungsabschlag
    kosten_anteil: 0.05         # Banken, Prospekt
  handel:
    aufschlag: 0.02
    abschlag: 0.02
    preiswirkung: 0.5
    anteil_max: 0.5             # über die Börse; darüber nur mit einem Übernahmeangebot
  uebernahme:
    aufschlag: 0.3              # Übernahmeprämie über dem Börsenwert
    kosten_anteil: 0.02         # Banken und Berater
  rueckkauf:
    anteil_max: 0.1             # je Rückkauf höchstens so viel der Aktien
  start:
    eigenkapital_min_usd: 200000000
    streubesitz: 0.6
  ki:
    boersengang_chance: 0.01
    boersengang_anteil: 0.3
    depot_anteil_kasse: 0.2       # so viel des Überschusses über kasse_max_monate in Aktien
    depot_anteil_max: 0.1         # höchstens so viel einer anderen Firma
    unterbewertung: 0.25          # kauft unter (1 − Wert) · fair, verkauft über (1 + Wert) · fair
    uebernahme_chance: 0.005      # je Monat, mal Aggressivität
    uebernahme_kasse_anteil: 0.5  # Übernahmepreis höchstens so viel der Kasse
  annaeherung: true
