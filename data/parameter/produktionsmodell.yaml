# Parameter der Produktion. Formeln: docs/FORMELN.md, Abschnitt M5.

produktionsmodell:
  # Kosten für Grundstück und Gebäude beim Gründen eines Standorts
  standortkosten_usd:
    foerderstaette: 200_000
    werk: 500_000
    kraftwerk: 300_000
    lager: 150_000
    niederlassung: 150_000
    forschungszentrum: 400_000
  gebaeude_lebensdauer_jahre: 50
  erschliessung_lebensdauer_jahre: 30
  # Förderkurve (C2): Ist von einer Lagerstätte mit Vorrat weniger als dieser Anteil übrig,
  # sinkt die zulässige Förderung im selben Verhältnis (bei der Hälfte des Anteils auf die
  # Hälfte). 0: volle Förderung bis zum letzten Fass.
  foerderkurve_ab: 0.5
  automatisierung:
    arbeitsersparnis: 0.8       # Anteil der Arbeit, den volle Automatisierung bei voller Prägung spart
    kostenanteil: 0.5           # Kosten für Automatisierung 0 → 1 als Anteil der Investition
  qualitaet:
    vorprodukte: 0.3            # je Punkt Vorproduktqualität über/unter 50
    automatisierung: 10         # Punkte bei voller Automatisierung
    zustand: 20                 # Punkte Abzug bei völlig verschlissener Anlage
  zustand_minimum: 0.2
  # Höchster Lohnaufschlag je Standort (1 = doppelter Lohn). Sind Arbeitskräfte knapp,
  # bekommen Standorte mit höherem Aufschlag sie zuerst und werben sie ab (M18).
  lohnaufschlag_max: 1.0
  # Anlagen stilllegen und verkaufen (M22). Stillgelegte Anlagen kosten einen Teil der
  # Wartung (Konservierung, Bewachung) und verschleißen nicht; das Wiederanfahren dauert
  # und kostet einen kleinen Teil der Investition. Gebrauchte Anlagen bringen beim
  # Verkauf einen Teil des Restbuchwerts, mindestens den Schrottwert.
  stilllegung:
    instandhaltung_anteil: 0.25
    wiederanlauf_tage: 30
    wiederanlauf_kosten: 0.02
  verkauf:
    erloes_anteil: 0.5
    schrottwert: 0.03
  strom: strom                  # Produkt für Eigenstrom (Kette 7)
  einspeiseverguetung: 0.5      # Anteil des Industriestrompreises für Überschuss ins Netz
  # Verwaltung, Vertrieb und Logistik als Zuschlag auf die Umwandlungskosten eines Laufs
  # (Arbeit, Strom, Anlage), je Produktart (M16) – wie Gemeinkostenzuschläge in der
  # Zuschlagskalkulation. Die Rezepte enthalten nur direkte Kosten. Konsumgüter tragen
  # zusätzlich den Vertrieb an Verbraucher.
  gemeinkosten_anteil: {rohstoff: 0.25, halbzeug: 0.5, komponente: 0.5, endprodukt: 1.0, energie: 0}
  # Plausibilitätsprüfung beim Laden: Marge des besten Rezepts eines Produkts zu Richtpreisen
  # im ersten Jahr, in dem es hergestellt werden kann (Referenzland, Normalauslastung).
  # Förderrezepte zählen mit ihrer Pacht (pacht_anteil am Rohstoff).
  richtpreis_marge: {minimum: 0.05, maximum: 0.45}
  # Nebenprodukte, die über so viele Tage ihrer Erzeugung hinaus auf Lager lägen, werden
  # entsorgt (abgefackelt, verkippt): Um 1900 fand Benzin kaum Käufer.
  nebenprodukte_lager_tage: 90
  # Anlagengrößen (M36): Kapazität als Vielfaches der Datenwerte, die für „mittel“ gelten.
  # Investition, Fläche und Bauzeit wachsen mit Kapazität^Exponent, die Arbeitsstunden je
  # Durchlauf mit Kapazität^arbeit_exponent (negativ: große Anlagen brauchen je Stück
  # weniger Arbeit). Größenvorteile der Industrie: Investition etwa mit Kapazität^0,6–0,7
  # („six-tenths rule“), Arbeit je Stück sinkt schwächer.
  anlagengroessen:
    kapazitaet: {sehr_klein: 0.25, klein: 0.5, mittel: 1, gross: 2, sehr_gross: 4}
    investition_exponent: 0.7
    arbeit_exponent: -0.15
    flaeche_exponent: 0.7
    bauzeit_exponent: 0.3

  # Was eine neue Firma zu Beginn besitzt (Lastenheft §2, §15); bezahlt aus dem
  # Startkapital. Die Werkstatt stellt Nägel aus Draht her und verkauft sie zum
  # Marktpreis; der Händler beginnt mit einer Niederlassung im Startland.
  startformen:
    werkstatt:
      standorttyp: werk
      gebaeude_usd: 20_000          # kleine Werkstatt statt eines Industriewerks
      anlagen:
        - {anlage: nagelmaschine, rezept: naegel_maschine, auslastung: 1.0}
      einkauf:
        - {produkt: draht, ziel: 5, hoechstpreis_usd: 2_000}
      verkauf: [naegel]
    handel:
      standorttyp: niederlassung
      gebaeude_usd: 15_000
