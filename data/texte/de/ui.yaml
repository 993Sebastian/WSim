beteiligungen.foerdern: Fördergeld geben
beteiligungen.foerdern_hilfe: "Fördergeld ist Forschungsaufwand ohne Anteile und Rechte. Es hebt die Chance der laufenden Phase: Ein Betrag in Höhe des Phasenkapitals schließt {wirkung} der Lücke zu 100 %. Gelingt das Start-up, ist die Technologie früher in der Welt – Nachforschen wird günstiger."
beteiligungen.foerdern_knopf: Fördern
beteiligungen.gefoerdert_meldung: "Du hast {betrag} Fördergeld gegeben."
beteiligungen.verkaufen_hilfe: "Investoren kaufen deine Anteile zum heutigen Wert mit {abschlag} Abschlag – für alle bekämst du {wert}."
