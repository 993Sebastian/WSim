etappen.ausblenden: Etappen ausblenden
etappen.einblenden: Etappen zeigen
etappen.alle_zeigen: Alle Etappen
etappe.erster_verkauf: Erster Verkauf
etappe.erster_verkauf.hinweis: Biete im Werk unter „Verkauf“ ein Erzeugnis an und spiele eine Runde. Ein Preis knapp unter dem Marktpreis findet schnell Käufer.
etappe.gewinnmonat: Erster Monat mit Gewinn
etappe.gewinnmonat.hinweis: Achte im Werk unter „Verkauf“ auf die Marge über den Stückkosten. Volle Auslastung senkt die Stückkosten, ein zu hoher Preis kostet Absatz.
etappe.zweite_anlage: Zwei Anlagen in Betrieb
etappe.zweite_anlage.hinweis: Unter „Produktion“ → „Anlage bauen“ siehst du Leistung, Personal und Kosten jeder Anlage. Baue dort, wo dein Absatz die Leistung übersteigt.
etappe.eigenes_vorprodukt: Eigenes Vorprodukt
etappe.eigenes_vorprodukt.hinweis: Stelle ein Vorprodukt deiner Anlagen selbst her – etwa Draht für die Nagelmaschine. Der Technologiebaum unter „Forschung“ zeigt, welche Anlage es herstellt.
etappe.zweites_land: Standort in einem zweiten Land
etappe.zweites_land.hinweis: Gründe unter „Produktion“ → „Neuer Standort“ einen Standort im Ausland. Die Weltkarte zeigt Löhne, Rohstoffe und Märkte der Länder.
etappe.eigene_forschung: Erste eigene Erfindung
etappe.eigene_forschung.hinweis: Gründe ein Forschungszentrum und wähle unter „Forschung“ eine Technologie. Neue Verfahren senken die Kosten oder öffnen neue Produkte.
etappe.marktfuehrer: Marktführer in einem Land
etappe.marktfuehrer.hinweis: Verkaufe in einem Land mehr von einem Produkt als jede andere Firma, mit mindestens {anteil} des Absatzes. Der Markt zeigt je Produkt den Marktführer und deinen Anteil.
etappe.eigenkapital_verdoppelt: Eigenkapital verdoppelt
etappe.eigenkapital_verdoppelt.hinweis: Gewinne erhöhen das Eigenkapital. Steck sie in Anlagen mit guter Marge; die Übersicht zeigt den Verlauf.

