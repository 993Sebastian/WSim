# Parameter der Produktion. Formeln: docs/FORMELN.md, Abschnitt M5.

produktionsmodell:
  # Kosten für Grundstück und Gebäude beim Gründen eines Standorts
  standortkosten_usd:
    foerderstaette: 200_000
    werk: 500_000
    kraftwerk: 300_000
    lager: 150_000
    niederlassung: 150_000
    forschungszentrum: 400_000
  gebaeude_lebensdauer_jahre: 50
  erschliessung_lebensdauer_jahre: 30
  # Förderkurve (C2): Ist von einer Lagerstätte mit Vorrat weniger als dieser Anteil übrig,
  # sinkt die zulässige Förderung im selben Verhältnis (bei der Hälfte des Anteils auf die
  # Hälfte). 0: volle Förderung bis zum letzten Fass.
  foerderkurve_ab: 0.5
  # Rohstoffzyklus: Die zulässige Förderung jedes Rohstoffs schwankt monatlich (Ernten,
  # Streiks, Funde): x ← beharrung · x + schwankung · z, |x| ≤ grenze, Förderung · e^x.
  # Dauerhafte Streuung etwa schwankung / √(1 − beharrung²). 0: kein Zyklus.
  rohstoffzyklus:
    schwankung: 0.05
    beharrung: 0.9
    grenze: 0.4
  # Schulung je Standort (W1, Lastenheft §5.4): Kosten als Anteil der Lohnsumme beim Ziel 1,
  # Aufbau und Verlust des Niveaus je Monat, Wirkung bei vollem Niveau.
  schulung:
    kosten_anteil_lohn: 0.05
    aufbau_je_monat: 0.08
    verlust_je_monat: 0.03
    arbeitsersparnis: 0.1         # Anteil weniger Arbeitsstunden
    qualitaet_punkte: 8
  automatisierung:
    arbeitsersparnis: 0.8       # Anteil der Arbeit, den volle Automatisierung bei voller Prägung spart
    kostenanteil: 0.5           # Kosten für Automatisierung 0 → 1 als Anteil der Investition
  qualitaet:
    vorprodukte: 0.3            # je Punkt Vorproduktqualität über/unter 50
    automatisierung: 10         # Punkte bei voller Automatisierung
    zustand: 20                 # Punkte Abzug bei völlig verschlissener Anlage
  zustand_minimum: 0.2
  # Höchster Lohnaufschlag je Standort (1 = doppelter Lohn). Sind Arbeitskräfte knapp,
  # bekommen Standorte mit höherem Aufschlag sie zuerst und werben sie ab (M18).
  lohnaufschlag_max: 1.0
  # Anlagen stilllegen und verkaufen (M22). Stillgelegte Anlagen kosten einen Teil der
  # Wartung (Konservierung, Bewachung) und verschleißen nicht; das Wiederanfahren dauert
  # und kostet einen kleinen Teil der Investition. Gebrauchte Anlagen bringen beim
  # Verkauf einen Teil des Restbuchwerts, mindestens den Schrottwert.
  stilllegung:
    instandhaltung_anteil: 0.25
    wiederanlauf_tage: 30
    wiederanlauf_kosten: 0.02
  verkauf:
    erloes_anteil: 0.5
    schrottwert: 0.03
  # Standort schließen (geschätzt): Restbestände gehen im Räumungsverkauf zu diesem Anteil
  # ihres Lagerwerts weg; die Beschäftigten bekommen so viele Monatslöhne Abfindung.
  schliessung:
    lager_erloes_anteil: 0.5
    abfindung_monate: 3
  # Lager (Wunsch vom 10.10.2026; docs/FORMELN.md „Lager“). Gemessen in m³ (Lagervolumen
  # der Güter). Ein Lager fasst `tage` Tage Durchsatz der Anlagen bei voller Auslastung,
  # mindestens den Wert je Standorttyp; Ausbau in Stufen. Kosten je Jahr als Anteil des
  # Lagerwerts, Verderb je Monat als Anteil des Bestands. Alle Werte geschätzt
  # (annaeherung).
  lager:
    mindestens_m3:
      foerderstaette: 20_000
      werk: 5_000
      kraftwerk: 20_000
      lager: 200_000
      niederlassung: 10_000
      forschungszentrum: 1_000
    tage: 60
    ausbau: {kapazitaet_m3: 10_000, kosten_usd: 25_000}
    # Lagervolumen (Wunsch vom 11.10.2026): Gewicht je Einheit durch die Stapeldichte der
    # Lagerklasse (t je m³, mit Gängen und Regalen); ein Produkt kann lagervolumen_m3
    # selbst angeben.
    dichte_t_je_m3: {schuettgut: 1.2, stueckgut: 0.25, fluessig: 0.8, gekuehlt: 0.35, gefahrgut: 0.6}
    kosten_jahr_anteil: 0.04
    ki_ausbau_ab: 0.9
    # Lagerklassen (BP3): Kosten je Jahr als Anteil des Lagerwerts. Klasse eines Produkts:
    # eigenes Feld lagerklasse, sonst bis gekuehlt_bis_tage Haltbarkeit gekühlt, sonst nach
    # Warengruppe, sonst nach Transportklasse. Über der Kapazität nimmt ein Fremdlager bis
    # zum kapazitaet_faktor-fachen auf, zum kosten_faktor-fachen Satz; Verderb nach
    # haltbarkeit_tage der Produkte (Chargen), Meldung ab verderb_meldung_ab des Bestands.
    klassen: {schuettgut: 0.02, stueckgut: 0.04, fluessig: 0.03, gekuehlt: 0.12, gefahrgut: 0.06}
    nach_transportklasse: {schuettgut: schuettgut, stueckgut: stueckgut, fluessig: fluessig, gas: gefahrgut, leitung: stueckgut}
    nach_warengruppe: {chemie: gefahrgut, mineraloel: gefahrgut, ruestung: gefahrgut}
    gekuehlt_bis_tage: 60
    fremdlager: {kapazitaet_faktor: 2, kosten_faktor: 2}
    verderb_meldung_ab: 0.05
  # Lernkurve (BP1): Je verdoppelter Menge, die ein Standort von einem Produkt gemacht hat,
  # braucht ein Durchlauf nur noch `rate` der Arbeitsstunden (ab einem Jahresausstoß einer
  # mittleren Anlage). Nicht genannte Branchen: rate_sonst. Ohne Produktion sinkt die
  # Erfahrung je Monat um vergessen_je_monat, bei Entlassung von mehr als einem Drittel
  # einmalig um entlassung; Nachfolgeprodukte (ersetzt) starten mit uebertrag der
  # Vorgänger-Erfahrung; Startfirmen haben start_etabliert_jahre Jahresausstöße Erfahrung.
  # Alle Werte geschätzt (annaeherung), Lernraten nach der Literatur (Wright 1936, BCG).
  # Ausstattungsstufen der Endprodukte (MN2, docs/FORMELN.md): Faktoren auf Vorprodukte und
  # Arbeit je Durchlauf, Punkte auf die Qualität; „standard“ ändert nichts. KI-Firmen machen
  # ab dieser Kompetenz Premium, bis zu jener die einfache Ausstattung.
  ausstattung:
    einfach: {material: 0.85, arbeit: 0.9, qualitaet: -15}
    premium: {material: 1.25, arbeit: 1.3, qualitaet: 15}
    ki_premium_ab: 0.75
    ki_einfach_bis: 0.25
  lernkurve:
    rate:
      luftfahrt: 0.80
      raumfahrt: 0.80
      fahrzeuge: 0.85
      elektro: 0.85
      schiffbau: 0.88
      maschinenbau: 0.88
      ruestung: 0.88
      konsumgueter: 0.90
      pharma: 0.90
      metallurgie: 0.92
      chemie: 0.92
      textil: 0.92
      holz_papier: 0.95
      bau: 0.95
      energie: 0.97
      bergbau: 0.97
      lebensmittel: 0.97
    rate_sonst: 0.95
    untergrenze: 0.5
    vergessen_je_monat: 0.03
    entlassung: 0.1
    uebertrag: 0.5
    start_etabliert_jahre: 3
  # Instandhaltung (BP2): Stufe je Standort (Wartungskosten · Stufe), Verschleiß ·
  # (1 / Stufe)^exponent, Kapazität · (1 − kapazitaet_zustand · (1 − Zustand)).
  # Ausfall je Anlage und Tag: basis · ((1 − Zustand) / (1 − zustand_minimum))²; die Anlage
  # steht tage_min–tage_max Tage, die Reparatur kostet kosten_anteil der Investition;
  # ab warnung_ab Ausfällen im Jahr rät die Meldung zu Instandhaltung oder Überholung.
  # Großüberholung: kosten_anteil der Investition, tage Stillstand, danach Zustand 1; die
  # KI überholt unter ki_ab. Alle Werte geschätzt (annaeherung).
  instandhaltung:
    stufe_min: 0.5
    stufe_max: 1.5
    exponent: 1.5
    kapazitaet_zustand: 0.3
    ausfall: {basis: 0.004, tage_min: 3, tage_max: 14, kosten_anteil: 0.02, warnung_ab: 3}
    ueberholung: {kosten_anteil: 0.3, tage: 30, ki_ab: 0.35}
  # Betrieb (BP4), alle Werte geschätzt (annaeherung):
  # Ausschuss a = basis · (1 − Schulung · 0,5) · (1,5 − Zustand · 0,5) · Lernfaktor^0,5
  #   · (1 − Automatisierung · 0,3), begrenzt auf min–max.
  # Unfälle je 100 000 Arbeitsstunden nach Jahr (Industrie, grob nach ILO/US-BLS), Kosten
  # je Unfall in Arbeitsstunden zum Durchschnittslohn des Standorts; nur schwere Unfälle
  # (unfall_stillstand_anteil) legen eine Anlage einen Tag still und werden gemeldet.
  # Korruption = grund − entwicklung · Entwicklung + instabilitaet · (1 − Stabilität);
  # Rechtssicherheit = grund + entwicklung · Entwicklung + stabilitaet · Stabilität.
  # Bauzeit · (1 + Korruption · bauzeit), Genehmigung Korruption · gebuehr · Investition,
  # Forderung je Standort und Jahr mit Chance Korruption · forderung_chance über
  # forderung_anteil der Investition; Enteignung ausländischer Standorte je Land und Jahr
  # mit Chance (1 − Rechtssicherheit)(1 − Stabilität) · enteignung_basis.
  betrieb:
    # Ausschuss eines neuen Produkts mit ungeschultem Personal; geschultes Personal nimmt
    # bis zu `schulung`, die Weiterentwicklung (Stand gegen den Führenden · Reife) bis zu
    # `weiterentwicklung` davon weg. Zusätzlich zu den Netto-Ausbeuten der Rezepte.
    ausschuss:
      basis: {rohstoff: 0, halbzeug: 0, komponente: 0.02, endprodukt: 0.03, energie: 0}
      min: 0.0
      max: 0.3
      schulung: 0.6
      weiterentwicklung: 0.8
    unfaelle_je_100000_stunden: {1900: 8, 1930: 5, 1950: 3.5, 1970: 2, 1990: 1, 2026: 0.5}
    unfall_kosten_stunden: 100
    unfall_stillstand_anteil: 0.05   # schwere Unfälle: Anlage einen Tag still, Meldung
    korruption: {grund: 0.6, entwicklung: 0.6, instabilitaet: 0.4, bauzeit: 0.5, gebuehr: 0.05, forderung_chance: 0.3, forderung_anteil: 0.005}
    rechtssicherheit: {grund: 0.1, entwicklung: 0.5, stabilitaet: 0.4}
    enteignung_basis: 0.02
    make_or_buy_toleranz: 0.1      # Eigenfertigung um mehr als 10 % teurer: „Zukauf prüfen“
  strom: strom                  # Produkt für Eigenstrom (Kette 7)
  einspeiseverguetung: 0.5      # Anteil des Industriestrompreises für Überschuss ins Netz
  # Verwaltung, Vertrieb und Logistik als Zuschlag auf die Umwandlungskosten eines Laufs
  # (Arbeit, Strom, Anlage), je Produktart (M16) – wie Gemeinkostenzuschläge in der
  # Zuschlagskalkulation. Die Rezepte enthalten nur direkte Kosten. Konsumgüter tragen
  # zusätzlich den Vertrieb an Verbraucher.
  gemeinkosten_anteil: {rohstoff: 0.25, halbzeug: 0.5, komponente: 0.5, endprodukt: 1.0, energie: 0}
  # Plausibilitätsprüfung beim Laden: Marge des besten Rezepts eines Produkts zu Richtpreisen
  # im ersten Jahr, in dem es hergestellt werden kann (Referenzland, Normalauslastung).
  # Förderrezepte zählen mit ihrer Pacht (pacht_anteil am Rohstoff).
  richtpreis_marge: {minimum: 0.05, maximum: 0.45}
  # Nebenprodukte, die über so viele Tage ihrer Erzeugung hinaus auf Lager lägen, werden
  # entsorgt (abgefackelt, verkippt): Um 1900 fand Benzin kaum Käufer.
  nebenprodukte_lager_tage: 90
  # Anlagengrößen (M36): Kapazität als Vielfaches der Datenwerte, die für „mittel“ gelten.
  # Investition, Fläche und Bauzeit wachsen mit Kapazität^Exponent, die Arbeitsstunden je
  # Durchlauf mit Kapazität^arbeit_exponent (negativ: große Anlagen brauchen je Stück
  # weniger Arbeit). Größenvorteile der Industrie: Investition etwa mit Kapazität^0,6–0,7
  # („six-tenths rule“), Arbeit je Stück sinkt schwächer.
  anlagengroessen:
    kapazitaet: {sehr_klein: 0.25, klein: 0.5, mittel: 1, gross: 2, sehr_gross: 4}
    investition_exponent: 0.7
    arbeit_exponent: -0.15
    flaeche_exponent: 0.7
    bauzeit_exponent: 0.3

  # Was eine neue Firma zu Beginn besitzt (Lastenheft §2, §15); bezahlt aus dem
  # Startkapital. Die Werkstatt stellt Nägel aus Draht her und verkauft sie zum
  # Marktpreis; der Händler beginnt mit einer Niederlassung im Startland.
  startformen:
    werkstatt:
      standorttyp: werk
      gebaeude_usd: 20_000          # kleine Werkstatt statt eines Industriewerks
      anlagen:
        - {anlage: nagelmaschine, rezept: naegel_maschine, auslastung: 1.0}
      einkauf:
        - {produkt: draht, ziel: 5, hoechstpreis_usd: 2_000}
      verkauf: [naegel]
    handel:
      standorttyp: niederlassung
      gebaeude_usd: 15_000
