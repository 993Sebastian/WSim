# Organisation und Manager (MA1)
organisation.kopf: "{anzahl} Manager · Gehälter {gehalt} im Jahr · {bewerber} Bewerber auf dem Markt"
organisation.hilfe: "Besetzte Stellen prüfen ihren Standort alle {tage} Tage und erledigen die Routine ihres Bereichs selbst: Auslastung und Rezept, Einkauf und Lieferungen zwischen deinen Standorten, Verkauf. Am Quartalsende kümmern sie sich auch um Überkapazität, stillgelegte Anlagen und den Ausbau, Laborleitungen um das nächste Forschungsziel. Was ihr Budget übersteigt oder einen Kredit braucht, legen sie dir als Anliegen vor. Eine Leitung übernimmt die Bereiche, deren Fachstelle leer ist – etwas weniger gründlich. Was niemand erledigt, entscheidest du selbst. Deine eigenen Einstellungen gelten bis zur nächsten Prüfung."
organisation.spaeter: "Landesleitungen und Kontinentvorstände entscheiden, was den Standorten zu teuer ist, kümmern sich um Standorte ohne eigene Leitung, um Kraftwerke, Lagerstätten und die Werbung im Land. Darüber steht der Vorstand: Der CEO und die Ressorts nehmen Kredite auf, beantworten Kaufangebote, bieten selbst und besprechen mit dir in der Rücksprache Bericht und Anträge."
organisation.aus: In diesen Spieldaten gibt es keine Manager.
