# Spielerfigur als Person (PE2, docs/PERSON.md §5; Formeln: docs/FORMELN.md, Abschnitt PE2).
# Alle Werte geschätzt.

person:
  # Alter der Person beim Spielbeginn: Vorgabe und erlaubte Spanne (Jahre).
  alter_start: {standard: 30, von: 18, bis: 60}
  # Kinder kommen, solange die Person verheiratet und kinder_ab bis unter kinder_bis Jahre
  # alt ist, mit dieser Chance je Jahr, höchstens so viele; ab managerkarte_ab Jahren hat
  # ein Kind eine Managerkarte.
  familie: {kinder_ab: 22, kinder_bis: 45, kinder_hoechstens: 4, kinder_chance_jahr: 0.15,
            managerkarte_ab: 25}
  # Privatkonto und Firmengründung (PE3, docs/PERSON.md §6–8; Formeln: docs/FORMELN.md,
  # Abschnitt PE3). Maß ist der Akademiker-Monatslohn: ein Zwölftel des Jahreslohns der
  # Gehaltsgruppe der Manager (management.yaml, gehalt_lohngruppe) im Land.
  # Gründungskosten (Register, Notar): Anteil der Einlage, mindestens so viele
  # Akademiker-Monatslöhne im Sitzland; die Oberfläche schlägt diesen Anteil des Kontos als
  # Einlage vor.
  gruendung: {kosten_anteil: 0.005, kosten_mindestens_monatsloehne: 1, einlage_vorschlag: 0.9}
  # Gehalt als CEO: mit Mitgesellschaftern höchstens dieses Vielfache des Vorschlags.
  gehalt: {hoechstens_mitgesellschafter: 2}
  # Gesellschafterdarlehen: höchster Zins je Jahr und längste Laufzeit in Jahren.
  darlehen: {zins_hoechstens: 0.15, jahre_hoechstens: 30}
  # Lebensstil je Stufe: Kosten je Monat in Akademiker-Monatslöhnen des Wohnsitzlandes,
  # Auf- oder Abschlag auf den Zins neuer Bankkredite der kontrollierten Firmen, Anteil mehr
  # oder weniger Gehaltsforderung für den Vorstand, Ausbildung der Kinder (Punkte auf jede
  # Fähigkeit), Faktor auf die Sterbechance der Person. Wechsel höchstens einmal in so
  # vielen Monaten.
  lebensstil:
    # Gründer beginnen bescheiden; ein Gehalt für „bürgerlich“ trägt eine Werkstatt von 1900
    # noch nicht (Weltlauf PE3).
    standard: bescheiden
    wechsel_monate: 12
    stufen:
      bescheiden: {kosten: 0.5, zins: 0.005, gehaltsforderung: 0.05, ausbildung: 0,
                   sterblichkeit: 1.1}
      buergerlich: {kosten: 1, zins: 0, gehaltsforderung: 0, ausbildung: 5, sterblichkeit: 1}
      gehoben: {kosten: 3, zins: -0.0025, gehaltsforderung: -0.05, ausbildung: 10,
                sterblichkeit: 0.95}
      luxurioes: {kosten: 8, zins: -0.005, gehaltsforderung: -0.1, ausbildung: 15,
                  sterblichkeit: 0.95}
  # Privatleben (Wunsch vom 10.10.2026): Kosten je Monat in Akademiker-Monatslöhnen des
  # Wohnsitzlandes. Partnersuche mit dieser Chance je Monat; Privatschule je Kind bis zur
  # Managerkarte mit so vielen Punkten auf jede Fähigkeit für eine ganze Kindheit
  # (anteilig); Gesundheitsvorsorge als Faktor auf die Sterbechance.
  privatleben:
    partnersuche: {kosten_monat: 0.3, chance_monat: 0.12}
    privatschule: {kosten_monat: 0.8, ausbildung: 12}
    vorsorge: {kosten_monat: 0.5, sterblichkeit: 0.8}
  # Einkommensteuer je Land und Jahr: ein Satz für das Einkommen eines Unternehmers (Gehalt,
  # Zinsen), grob der mittlere Satz hoher Einkommen.
  einkommensteuer:
    standard: {1900: 0.04, 1914: 0.06, 1920: 0.15, 1945: 0.35, 1980: 0.35, 2000: 0.32,
               2026: 0.3}
    laender:
      USA: {1900: 0, 1913: 0.02, 1918: 0.15, 1930: 0.1, 1944: 0.4, 1970: 0.35, 1990: 0.28,
            2026: 0.3}
      GBR: {1900: 0.05, 1918: 0.2, 1945: 0.45, 1980: 0.4, 2000: 0.33, 2026: 0.35}
      DEU: {1900: 0.04, 1920: 0.15, 1946: 0.4, 1960: 0.35, 2000: 0.38, 2026: 0.38}
      FRA: {1900: 0, 1916: 0.05, 1946: 0.3, 1980: 0.35, 2026: 0.35}
      XNO: {1900: 0.03, 1920: 0.15, 1950: 0.45, 1980: 0.55, 2000: 0.45, 2026: 0.4}
      JPN: {1900: 0.03, 1940: 0.2, 1950: 0.4, 1990: 0.35, 2026: 0.33}
  # Stufen der Einkommensteuer (PV1, FORMELN PV1): Einkommen in Akademiker-Jahreslöhnen des
  # Wohnsitzlandes ab `ab` wird mit `faktor` mal dem Satz der Reihe oben besteuert (Grenzsatz,
  # höchstens 90 %). Ohne Stufen gilt der Satz für das ganze Einkommen.
  einkommensteuer_stufen:
    - {ab: 0, faktor: 0.2}
    - {ab: 1, faktor: 0.6}
    - {ab: 3, faktor: 1.0}
    - {ab: 10, faktor: 1.3}
  # Pauschale Kapitalertragsteuer auf Zinsen (Dividenden: Quellensteuer der Länder).
  kapitalertragsteuer:
    standard: {1900: 0, 1920: 0.05, 1950: 0.15, 2000: 0.25, 2026: 0.25}
  # Guthabenzins des Privatkontos je Land und Jahr (real, Kaufkraft 2026).
  sparzins:
    standard: {1900: 0.02}
  # Hintergrund, Zeit und Gesundheit (PV1b). Hintergründe: Startwerte der Wirkung; Anteile
  # (forschung, loyalitaet) werden mit Erfahrung skaliert und bei `deckel` gekappt.
  # Privates Ansehen, Netzwerk, Clubs und Besitzobjekte (PV6a, FORMELN PV6a). Annäherungen.
  ansehen:
    ziel_basis: 8
    ziel_lebensstil: [0, 6, 16, 30]
    ziel_je_firma: 5
    annaeherung_monat: 0.04
    spende_punkte_je_jahreslohn: 6
    spende_deckel: 15
    kreditzins_je_punkt: -0.00004
    kontakt_jahre: {von: 15, bis: 40}
    pflege_gewinn: 1.0
    pflege_verfall: 1.0
    bankier_zins: -0.006
    makler_rabatt: 0.08
    hinweis_chance: 0.08
    clubs:
      - {id: stammtisch, ansehen: 0, lebensstil: 0, beitrag: 0.3, kontakte_jahr: 0.8, rollen: [unternehmer, makler]}
      - {id: handelsclub, ansehen: 20, lebensstil: 1, beitrag: 1.0, kontakte_jahr: 1.0, rollen: [bankier, unternehmer, makler]}
      - {id: akademie, ansehen: 30, lebensstil: 1, beitrag: 1.0, kontakte_jahr: 0.8, rollen: [wissenschaftler, politiker]}
      - {id: herrenclub, ansehen: 45, lebensstil: 2, beitrag: 3.0, kontakte_jahr: 1.2, rollen: [bankier, politiker, unternehmer]}
    besitz:
      - {id: wohnsitz, ab: 1900, preis: 8, unterhalt: 0.02, repraesentation: 6}
      - {id: wagen, ab: 1905, preis: 1.5, unterhalt: 0.08, repraesentation: 3}
      - {id: gemaelde, ab: 1900, preis: 3, unterhalt: 0.01, repraesentation: 4, sammler: true}
      - {id: oldtimer, ab: 1930, preis: 4, unterhalt: 0.03, repraesentation: 5, sammler: true}
      - {id: yacht, ab: 1910, preis: 20, unterhalt: 0.06, repraesentation: 12}
  # Beziehung, persönliche Ereignisse und Vetternwirtschaft (PV6b, FORMELN PV6b). Annäherungen.
  persoenliches:
    chance_faktor: 1.0
    frist_tage: 60
    beziehung: {start: 70, haelt_bei: 15, aenderung: 1.5, warnung_unter: 35}
    trennung: {unter: 12, anteil_ohne_vertrag: 0.5, anteil_mit_vertrag: 0.15}
    ehevertrag_kosten: 3
    vetternwirtschaft_malus: 15
    gesundheit_unter: 40
    gleichzeitig: 2
    liste:
      - id: bruder_kapital
        bedingung: immer
        chance_jahr: 0.12
        optionen:
          - {id: darlehen, kosten: 18, beziehung: 8, ansehen: 2}
          - {id: absage, beziehung: -8}
      - id: kind_kuenstler
        bedingung: kinder
        chance_jahr: 0.12
        optionen:
          - {id: erlauben, kosten: 6, beziehung: 6, interesse: -20}
          - {id: ueberzeugen, beziehung: -6, interesse: 10}
      - id: hochzeit_manager
        bedingung: firma
        chance_jahr: 0.25
        optionen:
          - {id: teilnehmen, kosten: 1, beziehung: -2, loyalitaet: 8}
          - {id: absagen, loyalitaet: -3}
      - id: zeitung_mieten
        bedingung: mieter
        chance_jahr: 0.08
        optionen:
          - {id: stellung, kosten: 2, ansehen: 3}
          - {id: schweigen, ansehen: -6}
      - id: partner_zeit
        bedingung: verheiratet
        chance_jahr: 0.3
        optionen:
          - {id: urlaub, kosten: 8, beziehung: 12, gesundheit: 4}
          - {id: spaeter, beziehung: -8}
      - id: nachlass_kunst
        bedingung: immer
        chance_jahr: 0.1
        optionen:
          - {id: kaufen, kosten: 12, ansehen: 6}
          - {id: ablehnen}
      - id: firmenjubilaeum
        bedingung: firma
        chance_jahr: 0.2
        optionen:
          - {id: fest, kosten: 10, ansehen: 4, loyalitaet: 10}
          - {id: schlicht, kosten: 1, loyalitaet: 2}
      - id: insider
        bedingung: firma
        chance_jahr: 0.12
        optionen:
          - {id: handeln, gewinn: 36, entdeckung: 0.3, strafe: 3, schande: 25}
          - {id: verzichten, ansehen: 2}
      - id: arzt_pause
        bedingung: gesundheit_niedrig
        chance_jahr: 0.6
        optionen:
          - {id: pause, kosten: 5, gesundheit: 15}
          - {id: weitermachen, gesundheit: -5}
  # Familienholding und Stiftung (PV6c, FORMELN PV6c). Annäherungen.
  bindung:
    holding_kosten: 24
    stiftung: {mindest: 5, einlage_steuer: 0.02, rendite_jahr: 0.03, ausschuettung_jahr: 0.025, ansehen_je_jahreslohn: 2, ansehen_deckel: 20}
  # Wertpapierkredit und Sammlermarkt (PV7a, FORMELN PV7a). Annäherungen.
  spekulation:
    wertpapierkredit: {beleihung: {fonds: 0.5, gold: 0.4, sammler: 0.3}, zins_aufschlag: 0.02, frist_monate: 1}
    sammler: {schwankung: 0.06, rueckkehr: 0.03, spanne: 0.12}
  # Die Besitzer der KI-Firmen als Personen (PV8, FORMELN PV8). Annäherungen.
  ki_unternehmer:
    startvermoegen_jahreslohn: {von: 8, bis: 80}
    alter: {von: 30, bis: 65}
    profile: {vorsichtig: 0.4, ausgewogen: 0.4, riskant: 0.2}
    budget: 0.2
    nachfolger_alter: {von: 28, bis: 48}
    nachfolger_anteil: 0.7
  wohlbefinden:
    hintergruende:
      tueftler: {forschung: 0.05}
      kaufmann: {kreditzins: -0.005, ordergebuehr: -0.2}
      charismatiker: {loyalitaet: 0.1}
      erbe: {ansehen: 20, netzwerk: 10}
    deckel: 0.1
    erfahrung_je_jahr: 0.1
    zeit:
      standard: {firma: 60, familie: 15, netzwerk: 10, erholung: 15}
      # Mindestanteil Firma: basis + je_firma * geleitete Firmen, höchstens.
      mindest_firma: {basis: 20, je_firma: 10, hoechstens: 80}
      # Tage, um die Anliegen früher verfallen, je 100 % fehlender Anteil.
      verzoegerung_tage: 30
    gesundheit:
      start: 85
      altern_ab: 40
      altern_je_jahr: 0.01
      ueberlastung_ab: 70
      ueberlastung_verlust: 2
      erholung_gewinn: 2
      lebensstil_gewinn: [-0.2, 0, 0.2, 0.3]
      vorsorge_gewinn: 0.2
      gesund_ab: 80
      sterblichkeit_null: 3
      krank_unter: 35
      krank_chance: 0.3
      krank_monate: 3
  # Anlagen der Person (PV2): Festgeld, Staatsanleihen, Gold, Fonds. Alle Werte real.
  anlagen:
    festgeld:
      aufschlag: 0.005
      laufzeit_monate: {von: 3, bis: 120}
      kuendigung_abschlag: 0.5
    staatsanleihen:
      aufschlag: 0.005
      laufzeit_monate: {von: 12, bis: 360}
      dauer_faktor: 0.8
      spanne: 0.01
    gold:
      # Realer Preis je Unze (Kaufkraft 2026), grob.
      preis_usd: {1900: 800, 1934: 1000, 1971: 1100, 1980: 2300, 2000: 700, 2011: 2200, 2026: 3000}
      krisen_beta: 0.8
      rauschen: 0.03
      rueckkehr: 0.05
      spanne: 0.01
      gebuehr: 0.005
    beteiligung:
      schwellen: [0.03, 0.05, 0.10, 0.25, 0.30, 0.50]
      meldung_aufschlag: [0.01, 0.02, 0.03]
      sperrminoritaet: 0.25
      pflichtangebot: {ab: 0.30, aufschlag: 0.10, annahme: 0.4}
    dienste:
      hausverwaltung:
        stufen:
          - {gebuehr: 0.05, leerstand: 0.25, schaden: 0.4}
          - {gebuehr: 0.09, leerstand: 0.5, schaden: 0.7}
      steuerberater:
        stufen:
          - {kosten: 0.5, entlastung: 0.05}
          - {kosten: 1.5, entlastung: 0.12}
      verwalter:
        gebuehr: 0.01
        unehrlich_chance: 0.01
        veruntreuung: 0.1
        reserve_monate: 12
        strategien:
          vorsichtig: {festgeld: 0.5, anleihen: 0.2, fonds: 0.3, gold: 0.0}
          ausgewogen: {festgeld: 0.2, anleihen: 0.2, fonds: 0.5, gold: 0.1}
          riskant: {festgeld: 0.0, anleihen: 0.0, fonds: 0.9, gold: 0.1}
    immobilien:
      arten:
        wohnung: {preis_jahreslohn: 5, rendite: 0.045, leerstand: 0.04, instandhaltung: 0.012, verfall: 2}
        mehrfamilienhaus: {preis_jahreslohn: 25, rendite: 0.05, leerstand: 0.05, instandhaltung: 0.014, verfall: 2}
        buero: {preis_jahreslohn: 30, rendite: 0.055, leerstand: 0.08, instandhaltung: 0.015, verfall: 2.5}
        halle: {preis_jahreslohn: 20, rendite: 0.06, leerstand: 0.06, instandhaltung: 0.012, verfall: 2}
        grundstueck: {preis_jahreslohn: 8, rendite: 0.01, leerstand: 0.0, instandhaltung: 0.002, verfall: 0}
      nebenkosten: 0.09
      eigenkapital_min: 0.2
      hypothek_aufschlag: 0.015
      tilgung_jahr: 0.03
      mietband: {von: 0.8, bis: 1.2}
      leerstand_steigung: 1.5
      schaden: {chance: 0.01, kosten: 0.02, punkte: 8}
      sanierung: {kosten: 0.12, punkte: 40, monate: 3}
      werk_effekt: {je_standort: 0.02, hoechstens: 0.08}
      verkauf_abschlag: 0.03
      notverkauf_abschlag: 0.15
      zustandsgewicht: 0.3
      firma: {entlastung: 0.15, entlastung_max: 0.5}
      entwicklung: {kosten: 0.65, kosten_streuung: 0.25, monate: 12, monate_streuung: 0.5}
      angebot:
        monate: 3
        spanne: {von: -0.1, bis: 0.15}
        guete: {von: 0.7, bis: 1.4}
        zustand: {von: 30, bis: 95}
        laender_max: 5
    fonds:
      gemanagt: {ab: 1900, kosten: 0.015, aufschlag: 0.05, gebuehr: 0.005}
      index: {ab: 1990, kosten: 0.002, aufschlag: 0, gebuehr: 0.005}
  # Kinder, Ausbildung, Erbfolge (PV4).
  nachwuchs:
    ausbildung_ab: 16
    ausbildung_kosten: 3
    ausbildung_punkte: 12
    ehrgeiz_punkte: 8
    talent_punkte: 15
    eigenschaften: {von: 20, bis: 100}
    interesse_je_monat: 1.0
    interesse_basis: 15
    ausbildungen:
      ingenieur: [produktion, forschung]
      kaufmann: [einkauf_lager, vertrieb_marketing, finanzen]
      jurist: [recht, personal, strategie]
      naturwissenschaftler: [forschung, produktion]
    partner_anteil: 0.5
    firmenbeguenstigung: 0.5
    streit_chance_jahr: 0.3
    streit_verkauf: 0.5
  # Erbe (PE6): Ohne Kind erbt ein Neffe oder eine Nichte im Alter von–bis Jahren; ab
  # hinweis_ab Jahren jeden Januar der Hinweis „Nachfolge bedenken“, solange kein Erbe
  # bestimmt ist.
  erbe: {neffe_alter: {von: 25, bis: 40}, hinweis_ab: 70}
  # Erbschaft- und Schenkungsteuer je Land und Jahr: ein Satz auf den ganzen Nachlass,
  # grob der wirksame Satz großer Unternehmervermögen (Betriebsvermögen ist in vielen
  # Ländern begünstigt, daher deutlich unter den Spitzensätzen).
  erbschaftsteuer:
    standard: {1900: 0.03, 1920: 0.1, 1950: 0.2, 2026: 0.15}
    laender:
      USA: {1900: 0, 1916: 0.05, 1935: 0.3, 1980: 0.3, 2001: 0.25, 2026: 0.2}
      GBR: {1900: 0.05, 1919: 0.2, 1949: 0.4, 1975: 0.3, 1988: 0.2, 2026: 0.2}
      DEU: {1900: 0.02, 1920: 0.1, 1950: 0.15, 2026: 0.1}
      FRA: {1900: 0.03, 1950: 0.2, 2026: 0.25}
      XNO: {1900: 0.03, 1950: 0.3, 2003: 0.3, 2004: 0}
      JPN: {1900: 0.03, 1950: 0.4, 2026: 0.3}
  annaeherung: true
