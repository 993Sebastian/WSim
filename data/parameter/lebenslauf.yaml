# Alter, Ruhestand und Tod der Manager (PE1, docs/PERSON.md §3–4; Formeln: docs/FORMELN.md,
# Abschnitt PE1). Alle Werte geschätzt.

lebenslauf:
  # Alter beim Eintritt in den Pool je Ebene (Normalverteilung, abgeschnitten); die Ebene
  # eines Kandidaten folgt seiner Stärke (Mittel aus Fachwissen im Schwerpunkt, Erkennen und
  # Urteilsvermögen): ab diesen Grenzen Land, Kontinent, Vorstand.
  eintrittsalter:
    standort: {von: 26, bis: 50, mittel: 35, streuung: 6}
    land: {von: 32, bis: 55, mittel: 42, streuung: 6}
    kontinent: {von: 38, bis: 58, mittel: 47, streuung: 5}
    vorstand: {von: 42, bis: 62, mittel: 52, streuung: 5}
  ebene_nach_staerke: {land: 50, kontinent: 57, vorstand: 63}
  # Chance auf Erfahrung (MA6) mal Faktor: unter jung_bis, ab alt_ab.
  erfahrung: {jung_bis: 35, jung: 1.5, alt_ab: 55, alt: 0.5}
  # Risikofreude sinkt ab diesem Alter je Jahr, höchstens um so viele Punkte.
  risiko: {ab: 40, je_jahr: 0.3, hoechstens: 10}
  # Ab diesem Alter sinken Erkennen und Führung je Jahr mit dieser Chance um einen Punkt.
  abbau: {ab: 65, chance: 0.1}
  # Persönliche Abweichung vom Ruhestandsalter (±Jahre), Vorwarnung, Verlängerung; es gilt
  # das Ruhestandsalter des Jahres, in dem der Manager das Bezugsalter erreicht. Die Zusage
  # zur Verlängerung sinkt zwischen den beiden Altern von voll auf null.
  ruhestand: {abweichung: 5, vorwarnung_monate: 12, verlaengerung_jahre_max: 3,
              verlaengerung_aufschlag: 0.2, bezugsalter: 65, zusage_alter: [60, 80]}
  # Sterbechance je Monat ab diesem Alter: so hoch bei der Lebenserwartung, verdoppelt
  # sich alle so vielen Jahre.
  sterbetafel: {ab: 50, chance: 0.005, verdopplung_jahre: 8}
  # Ruhestandsalter je Land und Jahr: Wer früher vermögend war, arbeitete oft bis ins Alter;
  # Rentensysteme senken es bis in die 1970er, danach steigt es wieder.
  ruhestandsalter:
    standard: {1900: 70, 1930: 67, 1960: 65, 1980: 63, 2000: 63, 2026: 66, 2060: 67}
    laender:
      DEU: {1900: 70, 1916: 65, 1972: 63, 2000: 63, 2026: 66, 2031: 67}
      FRA: {1900: 70, 1945: 65, 1982: 60, 2010: 62, 2023: 64}
      JPN: {1900: 65, 1960: 60, 2013: 65, 2026: 65}
      CHN: {1900: 65, 1951: 60, 2026: 63}
      RUS: {1900: 70, 1930: 60, 2019: 63}
  # Lebenserwartung Erwachsener je Land und Jahr: das Alter, in dem die Sterbechance etwa
  # 0,5 % je Monat erreicht (nicht die Lebenserwartung bei Geburt, die bis 1950 durch die
  # Kindersterblichkeit viel niedriger lag).
  lebenserwartung:
    standard: {1900: 60, 1950: 65, 1975: 69, 2000: 72, 2026: 75, 2100: 79}
    laender:
      USA: {1900: 64, 1950: 70, 1975: 74, 2000: 77, 2026: 79, 2100: 83}
      GBR: {1900: 64, 1950: 70, 1975: 74, 2000: 78, 2026: 81, 2100: 85}
      DEU: {1900: 63, 1950: 70, 1975: 73, 2000: 78, 2026: 81, 2100: 85}
      FRA: {1900: 63, 1950: 70, 1975: 74, 2000: 79, 2026: 82, 2100: 86}
      SWE: {1900: 66, 1950: 72, 1975: 76, 2000: 80, 2026: 83, 2100: 86}
      JPN: {1900: 61, 1950: 68, 1975: 76, 2000: 81, 2026: 85, 2100: 88}
      ITA: {1900: 62, 1950: 70, 1975: 74, 2000: 79, 2026: 83, 2100: 86}
      CAN: {1900: 65, 1950: 71, 1975: 75, 2000: 79, 2026: 82, 2100: 85}
      AUS: {1900: 66, 1950: 71, 1975: 75, 2000: 80, 2026: 83, 2100: 86}
      RUS: {1900: 56, 1950: 64, 1975: 66, 2000: 64, 2026: 70, 2100: 77}
      CHN: {1900: 55, 1950: 60, 1975: 68, 2000: 73, 2026: 78, 2100: 83}
      IND: {1900: 50, 1950: 56, 1975: 62, 2000: 67, 2026: 72, 2100: 78}
  annaeherung: true
