erklaerung.faktor.vertrieb: Vertriebswege
erklaerung.faktor.vertrieb.text: Wie viele Haushalte der einzelnen Einkommensgruppen die Firma über ihre Verkaufswege erreicht.
erklaerung.faktor.veralterung: Veralterung
erklaerung.faktor.veralterung.text: Bei Gebrauchsgütern verliert ein Angebot Qualitätspunkte für jede Entwicklungsstufe, die der Führer im Land voraus ist.
