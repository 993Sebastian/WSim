# Kette 1 – Eisen und Stahl (Lastenheft §17.1)
# Eisenerz + Kohle → Stahl → Blech, Draht, Stabstahl
#
# Lastenheft §17.2 (höchstens vier Ebenen): Hochofen und Stahlwerk sind zu einem
# Hüttenwerk zusammengefasst; Roheisen ist kein eigenes Produkt.
#
# Geld in USD mit Kaufkraft 2026, Mengen in der Einheit des Produkts.
# Alle Zahlen sind Annäherungen für etwa 1900 und werden beim Balancing (M15) überprüft.
# Arbeitszeiten: Personenstunden je Durchlauf, ohne Automatisierung.

produkte:
  - id: eisenerz
    art: rohstoff
    branche: bergbau
    einheit: t                    # normiert auf 60 % Eisengehalt
    verwendung: industrie
    warengruppe: erze
    transportklasse: schuettgut
    richtpreis_usd: 90
    # Förderzins an die Grubenbesitzer (Mesabi um 1900 etwa ein Siebtel des Erzpreises).
    pacht_anteil: 0.15
    # Größere Tagebaue und Pellets aus armem Erz (M39): Die Welt förderte 1900 etwa 100,
    # 1950 250, 1970 770, 1990 980 Mio. t Erz, 2010 2,6 und 2020 2,4 Mrd. t (M41: mit
    # 2,2 im Jahr 2026 kostete Erz 2020–2025 das 1,7- bis 2,4-Fache).
    foerderindex: {1900: 1.0, 1950: 1.2, 1970: 1.5, 1990: 1.8, 2000: 2.0, 2010: 3.0, 2026: 3.4}

  - id: kohle
    art: rohstoff
    branche: bergbau
    einheit: t
    verwendung: beides            # auch Hausbrand
    warengruppe: brennstoffe
    transportklasse: schuettgut
    richtpreis_usd: 60
    heizwert_mwh: 8.1             # Steinkohle, etwa 29 GJ/t
    # Höchstförderung (M41): Bis 1980 decken die Lagerstätten den Bedarf; danach kamen die
    # Großtagebaue in China, Indien, Indonesien und Australien hinzu (Welt 1980 etwa 3,8,
    # 2000 4,7, 2010 7,2 und 2020 7,7 Mrd. t). Ohne sie kostete Kohle in den Weltläufen ab
    # 2000 das 1,8- bis 3,9-Fache des Richtpreises.
    foerderindex: {1980: 1.0, 1990: 1.2, 2000: 1.5, 2010: 2.2, 2026: 2.6}

  - id: stahl
    art: halbzeug
    branche: metallurgie
    einheit: t                    # Rohstahl in Blöcken
    verwendung: industrie
    warengruppe: eisen_stahl
    transportklasse: stueckgut
    richtpreis_usd: 900

  - id: blech
    art: halbzeug
    branche: metallurgie
    einheit: t
    verwendung: industrie
    warengruppe: eisen_stahl
    transportklasse: stueckgut
    richtpreis_usd: 1500
    staatsnachfrage:              # Schiffbau, Behälter
      je_mio_usd_bip: 0.5
      kriegsfaktor: 2.0
    annaeherung: true

  - id: draht
    art: halbzeug
    branche: metallurgie
    einheit: t
    verwendung: industrie
    warengruppe: eisen_stahl
    transportklasse: stueckgut
    richtpreis_usd: 1500

  - id: stabstahl
    art: halbzeug
    branche: metallurgie
    einheit: t                    # Profile, Schienen, Träger
    verwendung: industrie
    warengruppe: eisen_stahl
    transportklasse: stueckgut
    richtpreis_usd: 1200
    staatsnachfrage:              # Eisenbahn, Brücken, öffentliche Bauten
      je_mio_usd_bip: 2.0
      kriegsfaktor: 1.5
    annaeherung: true

anlagen:
  - id: erzbergwerk
    standorttyp: foerderstaette
    investition_usd: 15_000_000   # Förderanlage; die Erschließung der Lagerstätte kommt hinzu
    bauzeit_tage: 360
    kapazitaet_je_tag: 2000       # Durchläufe = t Erz
    lebensdauer_jahre: 40
    wartung_je_jahr: 0.04
    automatisierung_max: 0.1
    annaeherung: true

  - id: kohlenzeche
    standorttyp: foerderstaette
    investition_usd: 25_000_000   # Schächte, Förderturm, Wasserhaltung
    bauzeit_tage: 720
    kapazitaet_je_tag: 2000
    lebensdauer_jahre: 40
    wartung_je_jahr: 0.04
    automatisierung_max: 0.1
    annaeherung: true

  - id: stahlwerk_konverter      # Hüttenwerk: Kokshochofen und Bessemer-Birne
    standorttyp: werk
    investition_usd: 85_000_000   # Hochofen für 280 t Roheisen und Anteil der Birne
    bauzeit_tage: 540
    kapazitaet_je_tag: 250
    lebensdauer_jahre: 30
    wartung_je_jahr: 0.04
    automatisierung_max: 0.2
    annaeherung: true

  - id: stahlwerk_herdofen       # Hüttenwerk: Kokshochofen und Siemens-Martin-Ofen
    standorttyp: werk
    investition_usd: 95_000_000   # Hochofen für 275 t Roheisen und Anteil des Herdofens
    bauzeit_tage: 540
    kapazitaet_je_tag: 250
    lebensdauer_jahre: 30
    wartung_je_jahr: 0.03
    automatisierung_max: 0.2
    annaeherung: true

  - id: elektrostahlwerk         # Elektro-Niederschachtofen und Lichtbogenofen
    standorttyp: werk
    investition_usd: 9_000_000
    bauzeit_tage: 270
    kapazitaet_je_tag: 30
    lebensdauer_jahre: 25
    wartung_je_jahr: 0.05
    automatisierung_max: 0.3
    technologie: elektrostahl
    annaeherung: true

  - id: walzwerk
    standorttyp: werk
    investition_usd: 30_000_000
    bauzeit_tage: 360
    kapazitaet_je_tag: 300
    lebensdauer_jahre: 30
    wartung_je_jahr: 0.04
    automatisierung_max: 0.3
    annaeherung: true

  - id: drahtzieherei
    standorttyp: werk
    investition_usd: 8_000_000
    bauzeit_tage: 180
    kapazitaet_je_tag: 100
    lebensdauer_jahre: 25
    wartung_je_jahr: 0.04
    automatisierung_max: 0.4
    annaeherung: true

rezepte:
  - id: eisenerz_abbau
    produkt: eisenerz
    menge: 1
    dauer_tage: 1
    anlage: erzbergwerk
    abbau: true
    arbeit_stunden:
      ungelernt: 4.4
      fachkraft.bergbau: 4.4
      akademiker.bergbau: 0.044
    qualitaet_basis: 50
    annaeherung: true

  - id: kohle_abbau
    produkt: kohle
    menge: 1
    dauer_tage: 1
    anlage: kohlenzeche
    abbau: true
    arbeit_stunden:               # etwa 1 t je Hauer-Schicht unter Tage
      ungelernt: 3.0
      fachkraft.bergbau: 4.5
      akademiker.bergbau: 0.03
    qualitaet_basis: 50
    annaeherung: true

  - id: stahl_bessemer
    produkt: stahl
    menge: 1
    dauer_tage: 1
    anlage: stahlwerk_konverter
    technologie: bessemer_verfahren
    eingang:                      # 1,12 t Roheisen aus 1,7 t Erz und 1,5 t Kokskohle je t
      eisenerz: 1.9
      kohle: 1.68
    arbeit_stunden:               # Hochofen und Birne; C4: USA 1900 rund 58 h/t samt Walzen
      ungelernt: 13.5
      angelernt: 5.5
      fachkraft.metall: 5.2
      akademiker.metall: 0.16
    qualitaet_basis: 45           # spröder, schwer zu steuern
    annaeherung: true

  - id: stahl_siemens_martin
    produkt: stahl
    menge: 1
    dauer_tage: 1
    anlage: stahlwerk_herdofen
    technologie: siemens_martin_verfahren
    eingang:                      # 1,10 t Roheisen; dazu Generatorgas für den Herdofen
      eisenerz: 1.87
      kohle: 1.9
    arbeit_stunden:               # Hochofen und Herdofen (C4: wie Bessemer, × 1,5)
      ungelernt: 12.8
      angelernt: 6.3
      fachkraft.metall: 6.8
      akademiker.metall: 0.2
    qualitaet_basis: 65
    annaeherung: true

  - id: stahl_elektro
    produkt: stahl
    menge: 1
    dauer_tage: 1
    anlage: elektrostahlwerk
    technologie: elektrostahl
    eingang:                      # Erz elektrisch reduziert (Schweden, ab etwa 1910)
      eisenerz: 1.8
      kohle: 0.6
    arbeit_stunden:
      angelernt: 3.0
      fachkraft.metall: 3.0
      fachkraft.elektro: 0.8
      akademiker.metall: 0.2
    energie_mwh: 3.0
    qualitaet_basis: 80           # Edelstahl, Werkzeugstahl
    annaeherung: true

  - id: blech_walzen
    produkt: blech
    menge: 1
    dauer_tage: 1
    anlage: walzwerk
    technologie: warmwalzen
    eingang:
      stahl: 1.12
    arbeit_stunden:
      ungelernt: 2.5
      angelernt: 2.0
      fachkraft.metall: 2.0
      akademiker.metall: 0.04
    qualitaet_basis: 55
    annaeherung: true

  - id: stabstahl_walzen
    produkt: stabstahl
    menge: 1
    dauer_tage: 1
    anlage: walzwerk
    technologie: warmwalzen
    eingang:
      stahl: 1.08
    arbeit_stunden:
      ungelernt: 2.0
      angelernt: 1.5
      fachkraft.metall: 1.5
      akademiker.metall: 0.03
    qualitaet_basis: 55
    annaeherung: true

  - id: draht_ziehen
    produkt: draht
    menge: 1
    dauer_tage: 1
    anlage: drahtzieherei
    technologie: warmwalzen       # Walzdraht als Vorstufe
    eingang:
      stahl: 1.10
    arbeit_stunden:
      ungelernt: 3.0
      angelernt: 6.0
      fachkraft.metall: 3.0
      akademiker.metall: 0.05
    qualitaet_basis: 55
    annaeherung: true

technologien:
  - id: kokshochofen
    fachgebiet: metall
    erfindungsjahr: 1709          # Abraham Darby

  - id: warmwalzen
    fachgebiet: metall
    erfindungsjahr: 1783          # Henry Cort

  - id: bessemer_verfahren
    fachgebiet: metall
    erfindungsjahr: 1856
    voraussetzungen: [kokshochofen]

  - id: siemens_martin_verfahren
    fachgebiet: metall
    erfindungsjahr: 1864
    voraussetzungen: [kokshochofen]

  - id: elektrostahl              # Paul Héroult, Lichtbogenofen
    fachgebiet: metall
    erfindungsjahr: 1900
    voraussetzungen: [siemens_martin_verfahren]   # + Stromversorgung, sobald Kette 7 da ist
    annaeherung: true
