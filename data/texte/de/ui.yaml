# Beteiligungen: Start-ups (SU1)
beteiligungen.einleitung: Erfinder und junge Firmen arbeiten an neuen Technologien oder verbessern Produkte. Jede Phase braucht eine Finanzierungsrunde; viele scheitern. Wer es schafft, bringt eine Technologie früher in die Welt – Nachforschen wird dann für alle günstiger – oder hebt ein Produkt auf die nächste Stufe.
