# Währungen der Länder (Lastenheft §3.6, §18.2; M21). Formatbeschreibung:
# docs/DATENFORMAT.md. Länder gelten in heutigen Grenzen (wie alle Länderdaten).
#
# Jeder Zeitraum gilt ab dem ersten Tag des Jahres bzw. Monats bis zum nächsten.
# Vor einer eigenen Landeswährung gilt die Währung der Kolonial- oder Vormacht;
# Annahmen stehen als Kommentar am Land.
#
# „umrechnung“ (M28): gesetzlicher Umstellungskurs, Einheiten der bisherigen Währung
# je Einheit der neuen (Euro: amtliche Kurse vom 31.12.1998 bzw. vom Beitritt). Ohne
# ihn nennt die Meldung zur Währungsumstellung das Verhältnis der Wechselkurse.
