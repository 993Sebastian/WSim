werk.aufschlag_konkurrenz: Höchster Aufschlag der Konkurrenz im Land
werk.aufschlag_hilfe: "0 bis {max} % über den Löhnen des Landes."
werk.anlage_kosten: Anlage (Abschreibung, Instandhaltung)
werk.kosten_hinweis: Stückkosten bei geplanter Auslastung, mit Vorprodukten zu Marktpreisen. Die untere Linie zeigt deinen Preis im selben Maßstab.
