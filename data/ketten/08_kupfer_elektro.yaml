# Kette 8 – Kupfer und Elektro (Lastenheft §17.1)
# Kupfererz → Kupfer → Kupferdraht → Elektromotor (Industriegut für andere Ketten).
# Alle Zahlen sind Annäherungen für etwa 1900.

produkte:
  - id: kupfererz
    art: rohstoff
    branche: bergbau
    einheit: t                    # normiert auf 2 % Kupfer
    verwendung: industrie
    warengruppe: erze
    transportklasse: schuettgut
    richtpreis_usd: 150
    # Förderabgaben, Grubenpacht und Erkundung.
    pacht_anteil: 0.35
    # Größere Tagebaue, Flotation und Laugung (M39): Die Welt förderte 1900 etwa 0,5,
    # 1950 2,5, 1970 6,4, 1990 9, 2000 13, 2010 16 und 2020 21 Mio. t Kupfer (M41: mit
    # 3,0 im Jahr 2026 kostete Erz 2020–2025 das 2,3- bis 2,7-Fache).
    foerderindex: {1900: 1.0, 1950: 1.3, 1970: 1.8, 1990: 2.4, 2000: 3.0, 2010: 3.6, 2026: 4.6}
    annaeherung: true

  - id: kupfer
    art: halbzeug
    branche: metallurgie
    einheit: t                    # Elektrolytkupfer
    verwendung: industrie
    warengruppe: nichteisenmetalle
    transportklasse: stueckgut
    richtpreis_usd: 13_000        # um 1900 etwa 16 Cent je lb

  - id: kupferdraht
    art: halbzeug
    branche: elektro
    einheit: t
    verwendung: industrie
    warengruppe: nichteisenmetalle
    transportklasse: stueckgut
    richtpreis_usd: 15_000
    staatsnachfrage:              # Telegrafen, Fernsprechnetze
      je_mio_usd_bip: 0.05
      kriegsfaktor: 2.0
    annaeherung: true

  - id: elektromotor
    art: komponente
    branche: elektro
    einheit: stueck               # Drehstrommotor um 5 kW
    gewicht_kg: 120
    verwendung: industrie
    warengruppe: elektro
    transportklasse: stueckgut
    richtpreis_usd: 2500
    staatsnachfrage:              # Straßenbahnen, Elektrifizierung
      je_mio_usd_bip: 0.05
      kriegsfaktor: 1.5
    annaeherung: true

anlagen:
  - id: kupferbergwerk
    standorttyp: foerderstaette
    investition_usd: 20_000_000
    bauzeit_tage: 540
    kapazitaet_je_tag: 3000
    lebensdauer_jahre: 40
    wartung_je_jahr: 0.04
    automatisierung_max: 0.1
    annaeherung: true

  - id: kupferhuette              # Rösten, Schmelzen, Elektrolyse
    standorttyp: werk
    investition_usd: 25_000_000
    bauzeit_tage: 450
    kapazitaet_je_tag: 50
    lebensdauer_jahre: 30
    wartung_je_jahr: 0.04
    automatisierung_max: 0.2
    annaeherung: true

  - id: kupferdrahtwerk
    standorttyp: werk
    investition_usd: 5_000_000
    bauzeit_tage: 180
    kapazitaet_je_tag: 40
    lebensdauer_jahre: 25
    wartung_je_jahr: 0.04
    automatisierung_max: 0.4
    annaeherung: true

  - id: elektromotorenwerk
    standorttyp: werk
    investition_usd: 4_000_000
    bauzeit_tage: 240
    kapazitaet_je_tag: 50
    lebensdauer_jahre: 25
    wartung_je_jahr: 0.04
    automatisierung_max: 0.3
    annaeherung: true

rezepte:
  - id: kupfererz_abbau
    produkt: kupfererz
    menge: 1
    dauer_tage: 1
    anlage: kupferbergwerk
    abbau: true
    arbeit_stunden:
      ungelernt: 6
      fachkraft.bergbau: 4.8
      akademiker.bergbau: 0.06
    qualitaet_basis: 50
    annaeherung: true

  - id: kupfer_verhuetten
    produkt: kupfer
    menge: 1
    dauer_tage: 3
    anlage: kupferhuette
    technologie: kupferelektrolyse
    eingang:
      kupfererz: 55
      kohle: 4
    arbeit_stunden:
      ungelernt: 30
      angelernt: 10
      fachkraft.metall: 4
      fachkraft.chemie: 2
      akademiker.chemie: 0.3
    energie_mwh: 0.3
    qualitaet_basis: 60
    co2_t: 9.6                # t CO₂ je Durchlauf (H2, geschätzt)
    schadstoff_kg: 1500
    annaeherung: true

  - id: kupferdraht_ziehen
    produkt: kupferdraht
    menge: 1
    dauer_tage: 1
    anlage: kupferdrahtwerk
    technologie: warmwalzen
    eingang:
      kupfer: 1.03
    arbeit_stunden:
      angelernt: 15
      fachkraft.metall: 5
    qualitaet_basis: 55
    annaeherung: true

  - id: elektromotor_bauen
    produkt: elektromotor
    menge: 1
    dauer_tage: 3
    anlage: elektromotorenwerk
    technologie: drehstrommotor
    eingang:
      kupferdraht: 0.012
      blech: 0.09                 # Elektroblech und Gehäuse
      stabstahl: 0.04
      schrauben: 0.002
    arbeit_stunden:
      angelernt: 80
      fachkraft.elektro: 60
      fachkraft.maschinenbau: 30
      akademiker.elektro: 3
    qualitaet_basis: 55
    annaeherung: true

technologien:
  - id: kupferelektrolyse
    fachgebiet: chemie
    erfindungsjahr: 1869

  - id: drehstrommotor            # Michail Doliwo-Dobrowolski
    fachgebiet: elektro
    erfindungsjahr: 1889
