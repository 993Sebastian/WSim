erklaerung.regel_gebrauch: Haushalte ersetzen verschlissene Stücke und schließen jedes Jahr einen Teil der Lücke zum Zielbesitz; das Ziel ist der höchste Besitz je Kopf mal Kaufneigung, weniger, was Nachfolger schon verdrängt haben.
erklaerung.regel_ergaenzung: Verbraucht wird mit dem Gebrauchsgut, das die Haushalte besitzen – je Stück ein fester Bedarf mal Kaufneigung.
