strategie.titel: Strategie
strategie.hilfe: "Vorgaben sagen deinen Managern, wie sie entscheiden: Preise, Lager, Löhne, Lieferungen zwischen deinen Standorten, Investitionen und Liquiditätsreserve. Eine Vorgabe gilt auf der Ebene, auf der du sie setzt, und für alles darunter – bis eine untere Ebene eine eigene hat."
strategie.erklaerung: "Für einen Standort gilt je Feld seine eigene Vorgabe, sonst die seines Landes, seines Kontinents, der Firma, sonst der Standardwert. Vorgaben wirken, wo eine besetzte Stelle entscheidet. Was du selbst entscheidest, gilt sofort und hat Vorrang – ein fester Preis bleibt fest; anderes passt die Stelle an ihrer nächsten Prüfung wieder an die Vorgabe an. Wer an einem Ort dauerhaft anders will, setzt dort eine eigene Vorgabe. Wie gut eine Vorgabe umgesetzt wird, hängt vom Manager ab: Ein schwacher bemerkt eine Änderung später."
